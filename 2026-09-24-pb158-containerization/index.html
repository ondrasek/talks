<p class="kicker">PB158</p>

<h1>Containerization</h1>

<div class="rule">
</div>

<p class="lede">A container is not a lightweight virtual machine. It is an ordinary process that Linux kernel mechanisms isolate.</p>

<div class="author-block">
  <span class="name">Ondřej (Ondra) Krajíček</span>

  <span class="attribution">Generated by the agentic vault — an autonomous research and authoring harness. Every factual claim was gated against a cited source registry before this document was produced.</span>
</div>

Note:

<ul>
  <li>A container is an ordinary process. Unrelated kernel interfaces restrict what it sees and what it consumes [V1].</li>
  <li>A container is "not a virtual machine at all, it's just processes running in the same Linux kernel" [S18].</li>
  <li>The shared kernel makes the isolation weaker than a virtual machine's separation [V7].</li>
  <li>The engine's own teaching documentation says the same thing: containers are isolated processes [S75].</li>

<p class="kicker">Part I · The need</p>

<h2>Two commands, one flag apart</h2>

<p class="lede">One flag is the only difference between these two commands. Only the second one works.</p>

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash
docker rm -f web 2>/dev/null
docker run --rm -d --name web nginx:alpine
docker exec web sh -c \
  'apk add -q strace; strace -p 1'
# refused

docker rm -f web
docker run --rm -d --name web \
  --cap-add SYS_PTRACE nginx:alpine
docker exec web sh -c \
  'apk add -q strace; strace -p 1'
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash
podman rm -f web 2>/dev/null
podman run --rm -d --name web nginx:alpine
podman exec web sh -c \
  'apk add -q strace; strace -p 1'
# refused

podman rm -f web
podman run --rm -d --name web \
  --cap-add SYS_PTRACE nginx:alpine
podman exec web sh -c \
  'apk add -q strace; strace -p 1'
```

</div>
</div>

<ul>
  <li>Without the flag, <code>strace</code> is refused inside the container. With the flag it works.</li>
  <li>Both engines answer the same way. You run both commands in Part II.</li>
</ul>

Note:

<ul>
  <li>Under the default setting, <code>strace</code> attaches only with <code>CAP_SYS_PTRACE</code>, or when the target is a descendant of the tracer [S67].</li>
  <li>Neither engine grants <code>CAP_SYS_PTRACE</code> by default [S42] [S43].</li>
  <li>The refusal is the capability machinery working as documented [V10].</li>
  <li>A container can be taken apart with <code>ls</code>, <code>cat</code> and <code>strace</code> [V12].</li>
  <li>The image in this example is built in Part II, step 4.</li>
</ul>

<p class="kicker">Part I · The need</p>

<h2>One machine, many workloads</h2>

<p class="lede">One server runs several workloads, and three conditions must hold at once.</p>

<ul>
  <li>No application reads another application's data.</li>
  <li>No application changes how another one runs.</li>
  <li>No application takes so much of the machine that the others stop.</li>
</ul>

<div class="kv">
<div class="pair">
<div class="k">Partial answer</div>
<div class="v">An old call named <code>chroot</code> shows a process one subtree of the file tree and hides the rest.</div>
</div>
<div class="pair">
<div class="k">Why it fails</div>
<div class="v">A process inside <code>chroot</code> still lists the other processes and reaches the network.</div>
</div>
</div>

<p class="closing">Isolation for workloads that cooperate, and one defence among several. Every container uses the host kernel, so it is not a wall.</p>

Note:

<ul>
  <li>The Solaris Zones designers state the need as isolation plus resource control [S58].</li>
  <li><code>chroot</code> does not compartmentalise the process or networking spaces [S19].</li>
  <li>A process inside <code>chroot</code> therefore still reaches the other processes and the network [S19].</li>
  <li>The author of FreeBSD jails states that <code>chroot</code> was never intended as a security mechanism [S20].</li>
  <li>The shared kernel makes the isolation weaker than a virtual machine's separation [V7].</li>
  <li>Kubernetes states that containers "offer a weaker isolation boundary than virtual machines that utilize hardware-based virtualization" [S73].</li>
  <li>Part VI shows where that boundary has failed.</li>
</ul>

---

<p class="kicker">Part I · The need</p>

<h2>One machine, two applications with different needs</h2>

<p class="lede">Two applications on one host need different versions of the same thing.</p>

<ul>
  <li>The Solaris Zones paper records two applications at one customer site, both hard-coded to listen on port 80. The customer bought two servers.</li>
  <li>Hard-coded paths and log locations can make two versions of one application hard to install side by side.</li>
  <li>Boettiger cites a University of Arizona study: less than half of the software published with computer-systems papers could be built or installed.</li>
</ul>

<p class="closing">The need is a package that carries the whole user-space environment with it.</p>

Note:

<ul>
  <li>The paper records "two poorly written applications" contending for port 80, resolved "by buying two servers" [S58].</li>
  <li>The same paper names hard-coded pathnames as a barrier, including the place a log file is written [S58].</li>
  <li>They can make two versions of one application difficult to deploy on one node [S58].</li>
  <li>Boettiger reports a University of Arizona study finding that "less than 50% of software could even be successfully built or installed" [S62].</li>
  <li>The literature calls this barrier "Dependency Hell" [S62].</li>
  <li>The need is packaging, and it is separate from the isolation need.</li>
</ul>

---

<p class="kicker">Part I · The need</p>

<h2>A virtual machine solves both, and what it costs</h2>

<p class="lede">A virtual machine is a simulated computer that runs its own kernel, so the guest kernel is not the host kernel.</p>

<div class="stats">
<div>
<div class="stat">11 s</div>
<div class="stat-cap">to start a virtual machine, in a measurement Felter's paper cites</div>
</div>
<div>
<div class="stat">
<span class="pos">under 1 s</span>
</div>
<div class="stat-cap">to start a container, on the same hardware</div>
</div>
<div>
<div class="stat">1</div>
<div class="stat-cap">kernel per virtual machine, booted and held in memory</div>
</div>
</div>

<ul>
  <li>Felter's own measurements found containers equal to or better than virtual machines on almost every workload, and both needed tuning for heavy input and output.</li>
  <li>Speed is not the argument. Start-up time and density are.</li>
</ul>

Note:

<ul>
  <li>Felter's paper reports that "other measurements have shown" under one second against eleven seconds on that hardware [S63].</li>
  <li>The reason given is that a container does not boot another copy of the operating system [S63].</li>
  <li>Felter's own results report containers "equal or better" in almost all cases, and add that both need tuning for input-heavy work [S63].</li>
  <li>The Solaris Zones paper names administering many operating system instances as the other cost [S58].</li>
</ul>

---

<p class="kicker">Part I · The need</p>

<h2>A third answer, between the two</h2>

<p class="lede">A microVM is a virtual machine with almost every simulated device removed. It keeps its own kernel and gives up the rest.</p>

| | Container | MicroVM | Full virtual machine |
|---|---|---|---|
| Kernel | the host's | its own | its own |
| Boundary | the system-call interface | hardware, plus the monitor | hardware, plus the monitor |
| Start | fastest | fast | slowest |

<ul>
  <li>Firecracker is one microVM monitor, and it runs a minimal guest kernel of its own.</li>
  <li>Its authors report a boot to application code in under 125 ms, and under 5 MB of added memory for each container.</li>
  <li>AWS runs Lambda and Fargate on it, and states it built Firecracker rather than choose between isolation and compatibility.</li>
</ul>

Note:

<ul>
  <li>A microVM gives each sandbox "its own virtual hardware, page tables, and operating system kernel" [S38].</li>
  <li>The paper's claim is that this "moves the security-critical interface from the OS boundary to a boundary supported in hardware and comparatively simpler software", which is the monitor [S38].</li>
  <li>With its minimal guest-kernel configuration Firecracker "boots to application code in less than 125ms" and "offers memory overhead of less than 5MB per container" [S38].</li>
  <li>AWS runs Firecracker in Lambda and Fargate, "where it supports millions of production workloads" [S38].</li>
  <li>Reliance on a single kernel means "a fundamental tradeoff between security and code compatibility" [S38].</li>
  <li>AWS states "We built Firecracker because we didn't want to choose" [S38].</li>
  <li>A container does not boot another copy of the operating system, so it starts fastest of the three [S63].</li>
</ul>

<p class="kicker">Part I · The need</p>

<h2>What a container is</h2>

<p class="lede">A container is a process, or a tree of processes, that runs with its own view of the machine on the host's kernel.</p>

<div class="kv">
<div class="pair">
<div class="k">Its own view</div>
<div class="v">Its own files, its own process list, its own network.</div>
</div>
<div class="pair">
<div class="k">Its own share</div>
<div class="v">A set amount of memory and of processor time.</div>
</div>
<div class="pair">
<div class="k">The host's kernel</div>
<div class="v">No second kernel boots. It starts as fast as an ordinary program.</div>
</div>
</div>

<ul>
  <li>This course's own Linux toolchain is an image. You start a container from it in Part II.</li>
</ul>

Note:

<ul>
  <li>A container is an ordinary process. Unrelated kernel interfaces restrict what it sees and what it consumes [V1].</li>
  <li>The engine's own teaching documentation describes containers as isolated processes [S75].</li>
  <li>A container does not boot another copy of the operating system, and a virtual machine does [S63].</li>
  <li>This course's own Linux toolchain is a Debian-family image, which the room has not run before this deck [V17].</li>
  <li>No mechanism name is given yet. Part III names them.</li>
</ul>

<p class="kicker">Part II · Setting up</p>

<h2>The engine is the program you install</h2>

<p class="lede">A container engine takes a command, finds the files the application needs, and starts the container.</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Resolve</div>
<div class="desc">Turn the name <code>python:3.12-slim</code> into a list of files to fetch from a server.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Unpack</div>
<div class="desc">Fetch the missing files and unpack them.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Configure</div>
<div class="desc">Write a configuration naming what the process may see and use.</div>
</div>
<div class="row">
<div class="num">4</div>
<div class="term">Start</div>
<div class="desc">Start the process with that configuration.</div>
</div>
</div>

<ul>
  <li>Docker and Podman are container engines, and both take the same verbs from the command line.</li>
</ul>

Note:

<ul>
  <li>Docker's engine is a client and a daemon that builds, runs and distributes containers [S10].</li>
  <li>Podman is "a fully featured container engine that is a simple daemonless tool" [S13].</li>
  <li>Docker's licence lists education among the uses for which Docker Desktop is free [S50].</li>
  <li>The command line is enough for every step in this topic.</li>
  <li>Step 3 writes the file the OCI runtime specification defines [S7].</li>
</ul>

<p class="kicker">Part II · Setting up</p>

<h2>Linux: install the engine directly</h2>

<p class="lede">Linux runs containers natively. Install one engine, and follow it for the rest of the topic.</p>

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash
# 1. remove the distribution's packages
sudo apt remove docker.io docker-compose
# 2. run Docker's own install script
curl -fsSL https://get.docker.com \
  -o get-docker.sh
sudo sh get-docker.sh
# 3. let your account reach the daemon
sudo usermod -aG docker $USER
newgrp docker
docker run --rm hello-world
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash
sudo apt install podman
# or: sudo dnf install podman
podman --version
podman run --rm hello-world
```

</div>
</div>

<div class="kv">
<div class="pair">
<div class="k">If Podman refuses</div>
<div class="v">Podman 6 needs version 2 of the kernel's resource-limit interface. <code>stat -fc %T /sys/fs/cgroup</code> prints <code>cgroup2fs</code> for version 2.</div>
</div>
<div class="pair">
<div class="k">Version</div>
<div class="v">A distribution package can be older than Podman 6. Read <code>podman --version</code>.</div>
</div>
</div>

Note:

<ul>
  <li>Docker publishes installation steps for each Linux distribution, not one script [S51].</li>
  <li>Docker's instructions start by removing the distribution's <code>docker.io</code> and related packages, "which may conflict with the official packages provided by Docker" [S82].</li>
  <li>Docker publishes the same install steps as a convenience script fetched from <code>get.docker.com</code> [S82].</li>
  <li>Docker documents <code>sudo usermod -aG docker $USER</code> and <code>newgrp docker</code> as the step that lets a non-root account use the daemon socket [S85].</li>
  <li>A distribution package can lag the upstream Podman release, so a version-specific claim needs <code>podman --version</code> first.</li>
  <li>Podman publishes package steps for each major Linux distribution [S52]. It is built in on Fedora CoreOS and Fedora Silverblue [S52].</li>
  <li>Podman 6.0.0 removed "support for running on cgroups v1 systems" [S65].</li>
  <li>Part III explains control groups.</li>
</ul>

<h2>macOS first: Homebrew installs the command-line tools</h2>

<p class="lede">Homebrew is a package manager for macOS. It installs command-line programs, as <code>apt</code> does on Ubuntu.</p>

```bash
/bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
```

<div class="kv">
<div class="pair">
<div class="k">1 · Run the installer</div>
<div class="v">One command, taken from brew.sh. It asks for your password once.</div>
</div>
<div class="pair">
<div class="k">2 · Next steps</div>
<div class="v">The installer prints lines under "Next steps". Run them. They put <code>brew</code> on your PATH.</div>
</div>
<div class="pair">
<div class="k">3 · Where it installs</div>
<div class="v"><code>/opt/homebrew</code> on Apple Silicon, <code>/usr/local</code> on an Intel Mac. The PATH lines differ for that reason.</div>
</div>
</div>

<ul>
  <li>Check the installation with <code>brew --version</code>. Only then run <code>brew install lima</code>.</li>
</ul>

Note:

<ul>
  <li>Homebrew "installs the command-line tools and applications you need across macOS, Linux and WSL" [S83].</li>
  <li>The one-line installer is one of the install routes the project publishes [S83].</li>
  <li>Homebrew installs under "/opt/homebrew on Apple Silicon" and "/usr/local on macOS Intel" [S83].</li>

<p class="kicker">Part II · Setting up</p>

<h2>macOS: a Linux virtual machine, driven from the shell</h2>

<p class="lede">macOS has no Linux kernel. The engine runs inside a Linux virtual machine that Lima creates.</p>

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash
brew install lima
limactl create template:docker
limactl start docker
limactl shell docker \
  docker run --rm hello-world
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash
brew install lima
limactl create template:podman
limactl start podman
limactl shell podman \
  podman run --rm hello-world
```

</div>
</div>

<div class="kv">
<div class="pair">
<div class="k">Template syntax</div>
<div class="v">Current Lima takes <code>template:docker</code>, not the older <code>template://docker</code>.</div>
</div>
<div class="pair">
<div class="k">Read-only home</div>
<div class="v">Lima mounts your home directory read-only. A write there fails by design.</div>
</div>
<div class="pair">
<div class="k">Intel Mac</div>
<div class="v">Podman 6 dropped Intel Macs. Use the Lima <code>docker</code> template there.</div>
</div>
</div>

Note:

<ul>
  <li>Lima documents the template-URL change from the 1.x form [S53].</li>
  <li>The Lima defaults are four cores, 4 GiB of memory and a read-only home mount [S54].</li>
  <li><code>podman machine</code> instead mounts the home directory read-write by default [S55].</li>
  <li>Podman 6.0.0 removed "support for running on Intel Macs" [S65].</li>
  <li>Why a Linux virtual machine is needed at all is Part V.</li>
</ul>

<p class="kicker">Part II · Setting up</p>

<h2>Windows: WSL 2, and two settings to check</h2>

<p class="lede">Windows Subsystem for Linux runs a real Linux kernel in a small virtual machine.</p>

<div class="compare">

<p class="kicker">Docker</p>

<p class="kicker">Part II · Setting up</p>

<h2>macOS and Windows needed a virtual machine</h2>

<p class="lede">A container on macOS or Windows needs a Linux virtual machine, and that machine costs a boot only once.</p>

<div class="boxes">
<div class="box">
<div class="box-label">Why</div>
<div class="box-head">The mechanisms are Linux features</div>
<ul>
<li>The kernel features a container needs exist in the Linux kernel.</li>
<li>The macOS and Windows kernels do not have them.</li>
<li>So Lima and WSL 2 supply a Linux kernel, inside a virtual machine.</li>
</ul>
</div>
<div class="box filled">
<div class="box-label">What it buys back</div>
<div class="box-head">One machine, many containers</div>
<ul>
<li>The virtual machine boots once.</li>
<li>Each container after that costs one process start, not one boot.</li>
</ul>
</div>
</div>

Note:

<ul>
  <li>Every Docker on a Mac is Docker inside a Linux virtual machine [V9].</li>
  <li>Lima creates that Linux virtual machine on macOS [S53].</li>
  <li>WSL 2 supplies the Linux kernel on Windows in the same way [S46].</li>
  <li>The cost is paid once for the virtual machine, not once per container.</li>
  <li>Part V gives the mechanism and the exception.</li>
</ul>

<p class="kicker">Part II · Step 1 · An image and a container</p>

<h2>An image is a stack of layers</h2>

<p class="lede">An image is the set of files an application runs in. Those files are stored as layers.</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Layer</div>
<div class="desc">One set of file changes: files added, replaced or removed.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Stack</div>
<div class="desc">A file in a higher layer hides the file of the same name below it.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Manifest</div>
<div class="desc">The list that names each layer by a hash of its content.</div>
</div>
</div>

<ul>
  <li>Every layer is read-only. The files in an image never change after the build.</li>
</ul>

Note:

<ul>
  <li>The image specification defines a manifest naming content-addressed layer archives [S8].</li>
  <li>Each layer is one set of filesystem changes [S23].</li>
  <li>The image's layers are read-only, and a container adds its own writable layer above them [S64].</li>
  <li>A file in a higher layer hides the file of the same name in a lower one [S6].</li>
</ul>

<p class="kicker">Part II · Step 1 · An image and a container</p>

<h2>An image is not a container</h2>

<p class="lede">Two words, and every later sentence depends on telling them apart.</p>

<div class="boxes">
<div class="box">
<div class="box-label">Image</div>
<div class="box-head">Inert data</div>
<ul>
<li>A stack of read-only layers, plus the manifest that names them.</li>
<li>Nothing about it runs. It can sit in a file or on a server.</li>
</ul>
</div>
<div class="box filled">
<div class="box-label">Container</div>
<div class="box-head">A running process</div>
<ul>
<li>A process, or a tree of processes, started from an image.</li>
<li>It has a process identifier on the host.</li>
<li>It ends when its command ends.</li>
</ul>
</div>
</div>

<p class="closing">You cannot download a container. You download an image and start one.</p>

Note:

<ul>
  <li>The image specification defines a manifest naming content-addressed layer archives [S8].</li>
  <li>A container is a process or process tree started from those layers [V1].</li>
  <li>The image holds no writable layer, so a running container does not change it.</li>
  <li>One image starts many containers, and each one gets its own writable layer [S64].</li>
</ul>

<p class="kicker">Part II · Step 2 · Storing data</p>

<h2>The writable layer, and the image below it</h2>

<p class="lede">An image is a stack of read-only layers. Starting a container puts one writable layer on top of that stack.</p>

```text
   writable layer   <- everything the container writes, deleted with it
   ------------
   layer 3          |
   layer 2          |  read-only, shared by every container from this image
   layer 1          |
```

<ul>
  <li>The topmost layer that holds the file answers a read.</li>
  <li>A write always lands in the writable layer.</li>
  <li>Remove the container and the writable layer goes with it. The image is untouched.</li>
</ul>

<p class="closing">Open question 2: layer is the tool's word. Which kernel mechanism is it?</p>

Note:

<ul>
  <li>The writable layer holds every file created inside a container [S64].</li>
  <li>An image is a stack of read-only layers named by the hash of their content [S8].</li>
  <li>Each layer is one set of filesystem changes [S23].</li>
  <li>Open question 2: a layer is a word from the tool. The kernel mechanism is in Part III.</li>
</ul>

```bash

# and Lima shares your macOS home read-only, so a directory under ~ would refuse the write
mkdir -p /tmp/work && echo hi > /tmp/work/f.txt
```

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash

  alpine cat /data/f.txt
docker run --rm -v /tmp/work:/data \
  alpine touch /data/new.txt
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash

<p class="kicker">Part II · Step 3 · Keeping the data</p>

<h2>The pitfall: who owns the files</h2>

<p class="lede">A bind mount can leave files under an owner nobody chose.</p>

<div class="kv">
<div class="pair">
<div class="k">1 · What you see</div>
<div class="v"><code>ls -l /tmp/work</code> shows <code>new.txt</code> under an unexpected owner. Under Docker's root daemon it is root.</div>
</div>
<div class="pair">
<div class="k">2 · Why</div>
<div class="v">Whichever account writes the file decides its owner outside. Rootless Podman maps it into the range reserved in <code>/etc/subuid</code>.</div>
</div>
<div class="pair">
<div class="k">3 · Fix</div>
<div class="v">Run the container under your own number with <code>--user $(id -u)</code>, or add Podman's <code>:U</code> suffix to <code>-v</code>.</div>
</div>
<div class="pair">
<div class="k">4 · Windows</div>
<div class="v">Under <code>/mnt/c</code>, WSL supplies the ownership.</div>
</div>
</div>


Note:

<ul>
  <li>The documented rule is to treat root within a container as root outside of it [S32]. Under Docker's root daemon a container therefore writes host files as root.</li>
  <li>Docker's rootless mode runs the daemon and the containers inside a user namespace [S11].</li>
  <li>It needs at least 65,536 subordinate identifiers for the user [S11].</li>
  <li>Rootless Podman reads <code>/etc/subuid</code> and <code>/etc/subgid</code> and builds the identifier mapping itself [V32].</li>
  <li>A file written by a non-root user inside a rootless container therefore carries a number from the reserved range.</li>
  <li>WSL sets file metadata to <code>disabled</code> by default, so permissions under <code>/mnt/c</code> are supplied rather than stored [S71].</li>
</ul>

<p class="kicker">Part II · Step 3 · Keeping the data</p>

<h2>Why a bind mount is not enough</h2>

<p class="lede">A bind mount works. It also ties the container to one machine.</p>

<div class="kv">
<div class="pair">
<div class="k">1 · One machine</div>
<div class="v">The command needs this directory at this path. Another laptop does not have it.</div>
</div>
<div class="pair">
<div class="k">2 · Your real files</div>
<div class="v">The container can change or delete your files on the host.</div>
</div>
<div class="pair">
<div class="k">3 · Across a virtual machine</div>
<div class="v">On macOS and Windows the files cross into the Linux virtual machine. That is slow.</div>
</div>
<div class="pair">
<div class="k">4 · Owners</div>
<div class="v">Files can get an owner nobody chose.</div>
</div>
</div>

<p class="closing">Missing: storage the engine owns, under a name, on any machine.</p>

Note:

<ul>
  <li>Bind mounts "rely on the host machine's filesystem having a specific directory structure available" [S80].</li>
  <li>A process in the container can create, modify or delete files on the host through a bind mount [S80].</li>
  <li>One measurement on one macOS codebase found bind-mounted access to many small files about 3.5 times slower than Linux [S44].</li>
  <li>Moving that directory into a named volume brought the timings back in line with Linux [S44].</li>
  <li>The Lima default shares the home directory read-only [S54].</li>
  <li>On Windows, files under <code>/mnt/c</code> are slower than files inside the Linux filesystem [S72].</li>
  <li>The ownership problem is the previous slide.</li>
</ul>

<h2>The application: a page that counts its visits</h2>

<p class="lede">Save this as <code>app.py</code> in an empty directory. It is also in the deck's <code>demo/</code> folder.</p>

```python
# app.py: a web page that counts its visits and keeps the count in /data.
from http.server import BaseHTTPRequestHandler, HTTPServer
from pathlib import Path

COUNT = Path("/data/count.txt")

class Handler(BaseHTTPRequestHandler):
    def do_GET(self):
        COUNT.parent.mkdir(parents=True, exist_ok=True)
        n = int(COUNT.read_text()) + 1 if COUNT.exists() else 1
        COUNT.write_text(str(n))
        self.send_response(200)
        self.send_header("Content-Type", "text/plain")
        self.end_headers()
        self.wfile.write(f"visit {n}\n".encode())

HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
```

<ul>
  <li>With a volume on <code>/data</code>, the count survives removing the container.</li>
</ul>

Note:

<ul>
  <li>The program uses only the Python standard library, so the base image needs nothing else to run it.</li>
  <li>The count lives in <code>/data/count.txt</code>, the same path the volume and the Compose file mount, which ties step 3 to step 4.</li>
  <li>The file ships in the talk's <code>demo/</code> bundle, so a student can download it rather than copy it from a slide.</li>

<p class="lede">A namespace is a kernel object that wraps one global resource, so the processes inside it see their own instance. The entries under <code>/proc</code> are handles to it.</p>

<p class="kicker">Part III · Question 1</p>

<h2>One idea, applied eight times</h2>

<p class="lede">Linux defines eight namespace types. Each one wraps one global resource.</p>

| Type | Flag | What the process sees its own copy of |
|---|---|---|
| PID | `CLONE_NEWPID` | Process identifiers |
| Mount | `CLONE_NEWNS` | Mount points |
| Network | `CLONE_NEWNET` | Network devices, addresses and ports |
| User | `CLONE_NEWUSER` | User and group identifiers |
| IPC | `CLONE_NEWIPC` | Shared memory and message queues |
| UTS | `CLONE_NEWUTS` | The hostname |
| Cgroup | `CLONE_NEWCGROUP` | Its own position in the kernel's resource-limit tree |
| Time | `CLONE_NEWTIME` | The boot and monotonic clocks |

<ul>
  <li>The eight types are independent, and UTS is the kernel's old name for the hostname.</li>
</ul>

Note:

<ul>
  <li>The kernel documents eight namespace types with these flags [S1].</li>
  <li>The IPC namespace partitions System V IPC and POSIX message queues [V18].</li>
  <li>A container takes a private set of namespaces, and the set is a choice [V1].</li>
</ul>

<h2>Three system calls, all traceable</h2>

<p class="lede">No special interface creates a namespace. Three ordinary system calls do, and <code>strace</code> shows them.</p>

<div class="kv">
<div class="pair">
<div class="k"><code>clone(2)</code></div>
<div class="v">Creates a process. With one or more <code>CLONE_NEW*</code> flags it creates new namespaces at the same time.</div>
</div>
<div class="pair">
<div class="k"><code>unshare(2)</code></div>
<div class="v">Moves the calling process into a new namespace.</div>
</div>
<div class="pair">
<div class="k"><code>setns(2)</code></div>
<div class="v">Joins an existing namespace, named by a file descriptor from <code>/proc</code>.</div>
</div>
</div>

```bash
sudo unshare --pid --fork --mount-proc ps -ef   # a two-line process list
```

<ul>
  <li><code>--mount-proc</code> gives the new namespace its own <code>/proc</code>, which is what <code>ps</code> reads. No engine ran.</li>
  <li>Part IV traces both engines and names the program that makes the call.</li>
</ul>

Note:

<ul>
  <li><code>clone(2)</code> creates new namespaces when the flags request them [S1].</li>
  <li>Part IV traces <code>docker run</code> and <code>podman run</code> and finds the caller.</li>
  <li><code>unshare(2)</code> moves the caller to a new namespace, and <code>setns(2)</code> joins one by descriptor [S1].</li>
  <li>A short program that calls <code>clone</code> with these flags builds a container without an engine [S56].</li>
</ul>

<p class="kicker">Part III · Question 1</p>

<h2>The user namespace is the load-bearing one</h2>

<p class="lede">Only one namespace type changes which account counts as root inside it.</p>

<ul>
  <li>The user namespace remaps user and group numbers, so root inside it is an ordinary account outside.</li>
  <li>Creating any other namespace type needs administrative privilege an ordinary account does not hold.</li>
  <li>Creating a user namespace does not, unless the Linux distribution switches that off. Ubuntu restricts it by default from release 23.10.</li>
  <li>That single exception is what containers without root rest on.</li>
</ul>

Note:

<ul>
  <li><code>CLONE_NEWUSER</code> appeared in 2.6.23 and the final pieces landed in 3.8 [S21].</li>
  <li>Every namespace type other than the user namespace requires <code>CAP_SYS_ADMIN</code> to create [S21].</li>
  <li>The user namespace is the one that isolates user and group identifiers [S1].</li>
  <li>Ubuntu 24.04 "restricts the use of unprivileged user namespaces" by default [S48].</li>
  <li>Rootless containers are a consequence of that single decision [V1].</li>
  <li>Part IV shows what both engines build on top of it.</li>
</ul>

<div class="k">lowerdir</div>

<div class="pair">
<div class="k">upperdir</div>
<div class="v">The container's writable directory.</div>
</div>
<div class="pair">
<div class="k">merged</div>
<div class="v">The tree the process sees as its root.</div>
</div>
</div>

<ul>
  <li>The kernel implements this. The engine's storage driver names which filesystem does the work.</li>
  <li>The union filesystem serves a read from the topmost layer that holds the file. A write goes to the writable directory.</li>
</ul>

<p class="closing">A layer is one directory in this stack.</p>

Note:

<ul>
  <li>The kernel describes an overlay filesystem as presenting the result of overlaying one filesystem on another [S74].</li>
  <li>Docker's driver names the three directories <code>lowerdir</code>, <code>upperdir</code> and <code>merged</code> [S6].</li>

<p class="kicker">Part III · Question 2</p>

<h2>Layering is copy-on-write, one instruction at a time</h2>

<p class="lede">The first write to an existing file copies it up from the image layer into the writable layer.</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Share</div>
<div class="desc">Every container from one image reads the same layer directories.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Protect</div>
<div class="desc">The kernel mounts those directories read-only.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Copy on write</div>
<div class="desc">The first write to a file copies that file into the writable layer, and the write lands on the copy.</div>
</div>
</div>

<ul>
  <li>The copy happens on the first write to each file, not on the first write overall.</li>
  <li><code>fork(2)</code> runs this same protocol on memory pages instead of files.</li>
</ul>

Note:

<ul>
  <li>The first write to an existing file triggers a <code>copy_up</code> from the image layer [S6].</li>
  <li>The trap fires on the first write to each unit, not the first write overall [V19].</li>
  <li><code>fork(2)</code> runs the same protocol at page granularity [V19].</li>
  <li>One build instruction produces one layer in the stack [S23].</li>
</ul>

<p class="kicker">Part III · Question 2</p>

<h2>The unit of sharing is a whole file</h2>

<p class="lede">A union filesystem works at file level, not block level. The copy is never partial.</p>

<div class="stats">
<div>
<div class="stat">
<span class="neg">2 GB</span>
</div>
<div class="stat-cap">the overlay driver copies when a process appends one byte to a 2 GB file</div>
</div>
<div>
<div class="stat">128</div>
<div class="stat-cap">read-only layers the default overlay driver supports at once</div>
</div>
<div>
<div class="stat">
<span class="pos">1</span>

<div class="stat-cap">copy of a file held in memory, shared by every container reading it</div>
</div>

<ul>
  <li>A database writing small records into an image layer therefore copies each file whole before its first change.</li>
  <li>It is also why fifty containers from one image cost one copy of that image's files in memory.</li>

<ul>
  <li>All <code>copy_up</code> operations copy the entire file, however small the change [S6].</li>
  <li>The overlay2 driver supports up to 128 lower layers [S6].</li>
  <li>"Multiple containers accessing the same file share a single page cache entry for that file" [S6].</li>
  <li>Modifying a large file in an image layer copies all of it first [V20].</li>

<p class="kicker">Part III · Question 4</p>

<h2>Control groups: what it can consume</h2>

<p class="lede">A control group organises processes into a hierarchy whose use of a resource can be limited and measured.</p>

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash
docker run --rm --memory 256m alpine \
  cat /sys/fs/cgroup/memory.max
# 268435456
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash
podman run --rm --memory 256m alpine \
  cat /sys/fs/cgroup/memory.max
# 268435456
```

</div>
</div>

<ul>
  <li>Version 2 collects every resource type in one tree, and only the tree's outermost groups may hold processes.</li>
  <li>The resource types that matter here are memory, processor time, process count and input or output.</li>
  <li>A control group constrains what a process may consume. It changes nothing a process reads.</li>
</ul>

Note:

<ul>
  <li>Control groups organise processes into hierarchical groups whose resource use is limited and monitored [S2].</li>
  <li>Under version 2 "all mounted controllers reside in a single unified hierarchy" [S2].</li>
  <li>Version 2 requires that processes reside only in leaf nodes [S2].</li>
  <li>Resource limits on a container without root require version 2 [S61].</li>
</ul>

<p class="kicker">Part III · Question 4</p>

<h2>Namespaces hide, control groups constrain</h2>

<p class="lede">Two mechanisms, two different verbs. The memory result needs both words to explain it.</p>

<div class="boxes">
<div class="box">
<div class="box-label">Namespace</div>
<div class="box-head">Changes what is visible</div>
<ul>
<li>Process identifiers, mounts, hostname, network.</li>
<li>Nothing about consumption.</li>
</ul>
</div>
<div class="box filled">
<div class="box-label">Control group</div>
<div class="box-head">Changes what is allowed</div>
<ul>
<li>Memory, processor time, process count.</li>
<li>Nothing about visibility.</li>
</ul>
</div>
</div>

<p class="closing">The limit held because a control group enforced it. The report showed the host because no namespace covers that file.</p>

Note:

<ul>
  <li>A namespace makes processes inside see their own instance of one resource [S1].</li>
  <li>A control group limits and measures resource usage [S2].</li>
  <li>The two are configured separately and do different work [V1].</li>
</ul>

<h2>Nobody gave <code>/proc/meminfo</code> a namespace</h2>

<p class="lede">No kernel change fixes the memory report. A userspace workaround covers those paths instead.</p>

<ul>
  <li><code>/proc/meminfo</code> and its neighbours always display numbers from the host system.</li>
  <li>Docker's own documentation states that <code>free</code> inside a container reports the host's swap.</li>
  <li>A separate project, LXCFS, mounts a small userspace filesystem over those paths so the numbers match the limit.</li>
  <li>It is a workaround in userspace, and no kernel change replaces it.</li>

  <li>Docker states that <code>free</code> inside a container reports the host's available swap [S68].</li>
  <li>LXCFS is "a small FUSE filesystem written with the intention of making Linux containers feel more like a virtual machine" [S69].</li>
  <li>A container whose memory numbers match its limit is still one process on the host kernel.</li>

<p class="kicker">Part III · Question 5</p>

<h2>Capabilities: how much of root is left</h2>

<p class="lede">Linux divides the privilege traditionally held by the superuser into distinct units, each switchable on its own. One such unit is a capability.</p>

<div class="kv">
<div class="pair">
<div class="k"><code>CAP_SYS_ADMIN</code></div>
<div class="v">Mounting filesystems, setting the hostname, and creating namespaces. Close to root on its own.</div>
</div>
<div class="pair">
<div class="k"><code>CAP_SYS_PTRACE</code></div>
<div class="v">Tracing arbitrary processes and reading their memory. Not in either engine's default set.</div>
</div>
<div class="pair">
<div class="k"><code>CAP_NET_RAW</code></div>
<div class="v">Raw and packet sockets. In Docker's default set and not in Podman's.</div>
</div>
</div>

<ul>
  <li>The engine drops most capabilities before it starts the container, and you can print the set.</li>
</ul>

Note:

<ul>
  <li>Linux divides superuser privilege into independently switchable capabilities [S3].</li>
  <li><code>CAP_SYS_ADMIN</code> permits mounting filesystems, setting the hostname and creating namespaces [S3].</li>
  <li><code>CAP_SYS_PTRACE</code> permits tracing arbitrary processes and reading their memory [S3].</li>
  <li><code>CAP_NET_RAW</code> permits raw and packet sockets [S3].</li>
  <li>Docker's default set adds <code>CAP_NET_RAW</code> [S43], and Podman's eleven defaults do not include it [S42].</li>
  <li>Neither default set holds <code>CAP_SYS_PTRACE</code>: Podman's eleven [S42], or Docker's fourteen [S43].</li>
  <li>The manual page warns against assigning new features to <code>CAP_SYS_ADMIN</code>, whose scope is already excessive [S3].</li>
</ul>

<p class="kicker">Part III · Question 5</p>

<h2>Seccomp: which calls it may issue</h2>

<p class="lede">A seccomp filter is a small program the kernel runs before each system call. It returns allow, an error, a kill, or a notification to a tracer.</p>

<ul>
  <li>Docker's default profile refuses about 44 of more than 300 system calls.</li>
  <li><code>mount</code> is refused, with the stated reason that the capability already gates it.</li>
  <li>Installing a filter needs <code>CAP_SYS_ADMIN</code>, or the <code>no_new_privs</code> setting, which stops the process gaining privilege later.</li>
  <li>The capability set and the filter are coupled in practice. Granting a capability also allowlists the calls that go with it.</li>
</ul>

Note:

<ul>
  <li>The default profile "disables around 44 system calls out of 300+" [S5].</li>
  <li><code>mount</code> carries the reason "Deny mounting, already gated by <code>CAP_SYS_ADMIN</code>" [S5].</li>
  <li>Installing a filter requires <code>CAP_SYS_ADMIN</code> or the <code>no_new_privs</code> bit [S4].</li>
  <li>In containerd, a process that has a capability is also given the system calls that go with it [S17].</li>
</ul>

<h2>One file holds all five requests</h2>

<p class="lede">One configuration file is written before a container starts. Every mechanism in this part has a field in it.</p>

```json
{ "root":    { "path": "rootfs" },
  "process": { "capabilities": { "bounding": ["CAP_CHOWN", "CAP_KILL"] } },
  "linux": {
    "namespaces":  [ {"type": "pid"}, {"type": "mount"}, {"type": "ipc"},
                     {"type": "uts"}, {"type": "network"} ],
    "cgroupsPath": "/machine.slice/container.scope",
    "resources":   { "memory": { "limit": 268435456 } },
    "seccomp":     { "defaultAction": "SCMP_ACT_ERRNO", "syscalls": [] } } }
```

<ul>
  <li><code>root</code> names the tree the union filesystem assembled. <code>process.capabilities</code> says how much of root is left.</li>
  <li><code>namespaces</code> says what the process can see. <code>cgroupsPath</code> and <code>resources</code> say what it can consume. <code>seccomp</code> says which calls it may issue.</li>
  <li>This is an excerpt. Each mechanism from this part has its own field, and one file describes one container.</li>
</ul>

Note:

<ul>
  <li>The configuration's <code>root</code> object names the container's root filesystem path [S81].</li>
  <li><code>process.capabilities</code> carries the capability sets of the container process [S81].</li>
  <li>The Linux section of the file defines <code>namespaces</code>, <code>cgroupsPath</code>, <code>resources</code> and <code>seccomp</code> [S7].</li>
  <li>The <code>namespaces</code> array names each namespace, and an optional <code>path</code> joins an existing one [S7].</li>

  <li><code>seccomp</code> carries the system-call filter [S7].</li>

  <li>The OCI runtime then attaches the control group and applies the SELinux labels [V29].</li>
  <li>The OCI runtime loads the seccomp filter and bind-mounts the volumes [V29].</li>

<h2>What the host process table actually shows</h2>

<p class="lede">The container is not a child of the daemon on a current installation. A small shim owns it.</p>

<div>
<p class="kicker">Docker</p>

```bash
ps -ef --forest | grep -A2 containerd-shim
# containerd-shim-runc-v2, then the container
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash

# no daemon above it, only your login session
```

</div>
</div>

<div class="kv">
<div class="pair">
<div class="k">Why</div>
<div class="v">The daemon does not launch containers itself. A shim instance parents the container and invokes the OCI runtime.</div>
</div>
<div class="pair">
<div class="k">What survives</div>
<div class="v">Under Docker the container outlives your terminal, because nothing in your session owns it.</div>

  <li>The container outlives the terminal that started it.</li>

<p class="kicker">Part IV · Docker</p>

<h2>Stop the daemon, and its containers stop</h2>

<p class="lede">The shim is the container's parent, but the daemon decides its lifecycle. When the daemon stops, by default it stops every container it started.</p>

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash
docker run -d --name web nginx:alpine
systemctl --user stop docker   # rootful: sudo systemctl stop docker
systemctl --user start docker
docker inspect -f '{{.State.Status}}' web
# exited
```

</div>
<div class="side-b">
<p class="kicker">Podman</p>

```bash
podman run -d --name web nginx:alpine
# there is no daemon to stop
podman inspect -f '{{.State.Status}}' web
# running
```

</div>
</div>

<div class="kv">
<div class="pair">
<div class="k">Why</div>
<div class="v">One daemon owns the lifecycle of every container. If it stops or crashes, its containers stop with it.</div>
</div>
<div class="pair">
<div class="k">Live restore</div>
<div class="v">An optional daemon setting that keeps containers running while the daemon is down. It is off by default.</div>
</div>
</div>

Note:

<ul>
  <li>"By default, when the Docker daemon terminates, it shuts down running containers" [S12].</li>
  <li>The shim parents the container [S70], so the process tree and the lifecycle are separate facts.</li>
  <li>Live restore is the setting <code>"live-restore": true</code>, made for "daemon crashes, planned outages, or upgrades" [S12].</li>
  <li>Across daemon updates it works "only" for patch releases (<code>YY.MM.x</code>), "not for major (<code>YY.MM</code>) daemon upgrades" [S12].</li>
  <li>Verified 2026-09-30 in the Lima VM, rootless Docker 29.7.2 and Podman 4.9.3.</li>
  <li>Stopping the daemon ended the Docker container's process, and it came back as <code>exited</code>.</li>
  <li>The Podman container kept running.</li>
  <li>This is takeaway 3 made visible: no single daemon whose stop takes every Podman container with it.</li>
</ul>

<p class="kicker">Part IV · Podman</p>

<h2>Podman: fork and exec, with a monitor left behind</h2>

<p class="lede">Podman has no daemon. Each command is an ordinary program that sets the container up and starts the OCI runtime.</p>

```bash
podman rm -f web 2>/dev/null
podman run -d --name web nginx:alpine
ps -ef --forest | grep -B1 nginx   # conmon, then nginx, under your session
```

<ul>
  <li>The <code>podman</code> process itself exits once the container is running.</li>
  <li>A small program named <code>conmon</code> stays behind. It started the OCI runtime, and it sits between your session and the container.</li>
  <li>The container is therefore a child of your session or of a systemd unit.</li>
</ul>

Note:

<ul>
  <li>Podman is "a fully featured container engine that is a simple daemonless tool" [S13].</li>
  <li>Most Podman commands run as a regular user without extra privileges [S13].</li>
  <li><code>conmon</code> execs <code>crun</code> or <code>runc</code>, which sets the container up and forks the container process [V29].</li>
  <li><code>conmon</code> therefore remains between the user's session and the container process.</li>
</ul>

<p class="kicker">Part IV · Podman</p>

<h2>What a start without root actually does</h2>

<p class="lede">Removing the daemon moves work into userspace. Podman does it in a fixed order.</p>

<div class="kv">
<div class="pair">
<div class="k">1 · Pause process</div>
<div class="v">Keeps one user namespace alive for all your containers.</div>
</div>
<div class="pair">
<div class="k">2 · Identifier map</div>
<div class="v">Reads your account's reserved user numbers and maps them.</div>
</div>
<div class="pair">
<div class="k">3 · Storage</div>
<div class="v">Makes a mount namespace and assembles the layers.</div>
</div>
<div class="pair">
<div class="k">4 · Network</div>
<div class="v">Starts a userspace network stack. The kernel refuses a full one.</div>
</div>
<div class="pair">
<div class="k">5 · OCI runtime</div>
<div class="v">Execs <code>conmon</code>, then the OCI runtime.</div>
</div>
</div>

Note:

<ul>
  <li>Podman joins the pause process namespace "because a multithreaded program cannot change its user namespace" [S15].</li>
  <li>Without that process Podman reads <code>/etc/subuid</code> and <code>/etc/subgid</code>, builds the mapping, and forks the pause process [V32].</li>
  <li>Podman then creates a mount namespace and assembles the image layers [V33].</li>
  <li>Full separate networking is not allowed for non-root users, so a userspace stack emulates it [S15].</li>
  <li>The OCI runtime then creates the namespaces and attaches the control group [V29].</li>
  <li>The OCI runtime applies the SELinux labels and loads the seccomp filter [V29].</li>
  <li>The OCI runtime bind-mounts the volumes last [V29].</li>
</ul>

<p class="kicker">Part IV · Without root</p>

<h2>Rootless: two different concessions</h2>

<p class="lede">Rootless means both the engine and the container run as an unprivileged user, on top of a user namespace.</p>

<div class="boxes">
<div class="box">
<div class="box-label">Docker</div>
<div class="box-head">Keeps the daemon, moves it</div>
<ul>
<li>The daemon and the containers both run inside a user namespace.</li>
<li>The daemon itself runs unprivileged too.</li>
<li>It needs at least 65,536 reserved user numbers for your account.</li>
</ul>
</div>
<div class="box filled">
<div class="box-label">Podman</div>
<div class="box-head">Has no daemon to move</div>
<ul>
<li>Rootless is the ordinary way to run it.</li>
<li>Podman states it holds no more privilege than the account that started it.</li>
<li>Part VI shows a kernel flaw that no identifier mapping stops.</li>
</ul>
</div>
</div>

Note:

<ul>
  <li>Rootless mode runs "the Docker daemon and containers inside a user namespace" [S11].</li>
  <li>In rootless mode "both the daemon and the container are running without root privileges" [S11].</li>
  <li>It requires at least 65,536 subordinate identifiers for the user [S11].</li>
  <li>Rootless Podman builds its identifier mapping from <code>/etc/subuid</code> and <code>/etc/subgid</code> [V32].</li>
  <li>Podman states that rootless containers "will never have more privileges than the user that launched them" [S14].</li>
  <li>The sentence is a design statement, not a measurement.</li>
  <li>Dirty Pipe let an unprivileged process write to any file it could read [S30].</li>
  <li>The published proof of concept escaped a container that was granted no extra privilege [S30].</li>
  <li>An identifier map does not change a kernel code path, so it does not stop that flaw.</li>
</ul>

<p class="kicker">Part IV · Without root</p>

<h2>Host policy overrides every engine option</h2>

<p class="lede">Running without root rests on the user namespace. A Linux distribution can switch that off.</p>

```bash
unshare -U true       # succeeds if you may create a user namespace
```

<ul>
  <li>Ubuntu restricts unprivileged user namespaces by default since release 23.10, and this course's Windows path installs Ubuntu.</li>
  <li>A program without root may create a user namespace in two cases only:</li>
  <li>A Linux security module named AppArmor confines the program, and its AppArmor profile carries the <code>userns</code> rule.</li>
  <li>The program holds <code>CAP_SYS_ADMIN</code>.</li>
  <li>The switch is a kernel parameter on the host. No engine option reaches it.</li>
</ul>

Note:

<ul>
  <li>Ubuntu announced the restriction on unprivileged user namespaces with release 23.10 [S77].</li>
  <li>Ubuntu 24.04 "restricts the use of unprivileged user namespaces" by default [S48].</li>
  <li>Unprivileged processes may create them only if they "are confined and have the 'userns,' rule in their AppArmor profile (or if they have CAP_SYS_ADMIN)" [S77].</li>
  <li>Rootless Podman rests on exactly that system call, so host policy gates it.</li>
</ul>

<p class="kicker">Part IV · One format</p>

<h2>One image, either engine</h2>

<p class="lede">The image format and the OCI runtime specification are written standards, not one vendor's implementation detail.</p>

<div class="compare">
<div>
<p class="kicker">Docker</p>

```bash

  docker.io/library/python:3.12-slim
```

```bash

```

<ul>
  <li>The same registry, the same manifest, the same layer archives for both.</li>
</ul>

<ul>
  <li>The manifest names each layer archive by the hash of its content, and any engine can unpack them.</li>
  <li>A registry serves the same image to both engines over the same protocol.</li>

</ul>

<p class="kicker">Part IV · The summary</p>

<h2>The disagreement is about ownership</h2>

<p class="lede">Both engines make the same five requests to the same kernel. They disagree about which process holds the container.</p>

| | Docker | Podman |
|---|---|---|
| Path | client to daemon to containerd to shim to `runc` | one command, `conmon`, then `crun` |
| Owner | a long-lived privileged program | your own session, or a systemd unit |
| Default OCI runtime | `runc` | `crun` |
| Without root | supported, daemon moved into a user namespace | the ordinary mode |
| Default capabilities | eleven, plus `MKNOD`, `NET_RAW` and `AUDIT_WRITE` | eleven |
| Buys | one interface always listening, an integrated build system | least privilege by default, no idle program |
| Costs | a privileged program on the path of every container | userspace shims where the kernel refuses |

Note:

<ul>
  <li>The disagreement is about who owns the container process [T3] [V15].</li>
  <li>Docker's path runs through a daemon and containerd [S10] [S22].</li>
  <li>Podman execs <code>conmon</code>, which execs the OCI runtime and stays behind as the monitor [S15].</li>
  <li>Neither engine asks the kernel for a different mechanism [V1].</li>
  <li>Their default capability sets do differ: Docker's fourteen against Podman's eleven [S42] [S43].</li>
  <li>Podman's default OCI runtime is <code>crun</code> [S13]. Docker reaches <code>runc</code> through the shim named <code>containerd-shim-runc-v2</code> [S70].</li>
  <li>Docker runs without root by moving the daemon and the containers into a user namespace [S11].</li>
  <li>Most Podman commands run as a regular user without extra privilege, so this is its ordinary mode [S13].</li>
  <li>The Docker daemon listens for API requests on a socket, and it also builds and distributes images [S10].</li>
  <li>Rootless mode is what runs Docker's daemon without root privileges, and <code>userns-remap</code> mode keeps it privileged [S11].</li>
  <li>The daemon therefore sits on the path of every Docker container, and it holds root privileges unless rootless mode runs it [S10] [S11].</li>
  <li>Podman runs no daemon, so no long-lived program waits between commands [S13].</li>
  <li>Podman's default set holds three fewer capabilities than Docker's, so its container starts with less privilege [S42] [S43].</li>
  <li>Without root the kernel refuses full networking to Podman, so a userspace program carries the packets instead [S15].</li>
</ul>

<p class="kicker">Part V · Consequence 2</p>

<h2>Why macOS and Windows need a Linux virtual machine</h2>

<p class="lede">A virtual machine runs its own kernel, so the guest kernel is not the host kernel. That is what macOS and Windows are missing.</p>

<div class="kv">
<div class="pair">
<div class="k">1 · The mechanisms</div>
<div class="v">All five are Linux kernel features.</div>
</div>
<div class="pair">
<div class="k">2 · The gap</div>
<div class="v">The macOS and Windows kernels lack them.</div>
</div>
<div class="pair">
<div class="k">3 · The answer</div>
<div class="v">Supply a Linux kernel in a virtual machine.</div>
</div>
<div class="pair">
<div class="k">4 · Your own case</div>
<div class="v">Lima and WSL 2 are instances of this, not workarounds.</div>
</div>
</div>

<p class="closing">Microsoft says so plainly: WSL 2 is a Linux kernel in a small virtual machine.</p>

Note:

<ul>
  <li>Every Docker on a Mac is Docker inside a Linux virtual machine [T4] [V9].</li>
  <li>WSL 2 uses "a Linux kernel inside of a lightweight utility virtual machine (VM)" [S46].</li>
  <li>WSL 2 also "runs Linux distributions as isolated containers inside the managed VM" [S46].</li>
  <li>The mechanisms named are Linux kernel interfaces [S1] [S2] [S3].</li>
</ul>

<p class="kicker">Part V · Consequence 2</p>

<h2>Where "a Linux virtual machine" stops being the answer</h2>

<p class="lede">The claim holds for Linux containers. Windows has containers of its own, and they need a Windows kernel.</p>

<div class="boxes">
<div class="box">
<div class="box-label">Linux container on Windows</div>
<div class="box-head">Needs a Linux kernel</div>
<ul>
<li>Supplied by WSL 2, inside a virtual machine.</li>
<li>Everything in this topic applies.</li>
</ul>
</div>
<div class="box filled">
<div class="box-label">Windows container on Windows</div>
<div class="box-head">Needs the Windows kernel</div>
<ul>
<li>It shares the Windows kernel directly. Microsoft describes that as roughly how Linux containers run.</li>
<li>Adding a Linux virtual machine does not help here.</li>
</ul>
</div>
</div>

Note:

<ul>
  <li>Process-isolated Windows containers "share the same kernel with the host as well as each other" [S35].</li>
  <li>Microsoft calls that "approximately the same as how Linux containers run" [S35].</li>
  <li>The takeaway is scoped to Linux containers for this reason.</li>
</ul>

<p class="kicker">Part V · Consequence 2</p>

<h2>One shared machine, or one for each container</h2>

<p class="lede">How many virtual machines the engine builds is a design choice, and the answers differ.</p>

<div class="matrix">
<div class="m-row">
<div class="src">Lima and WSL 2</div>
<div class="ref">Lima, WSL 2</div>
<div class="claim">One virtual machine. Every container is a process inside it.</div>
<div class="kind">One kernel, many containers</div>
</div>
<div class="m-row">
<div class="src">Apple</div>
<div class="ref">its Containerization project</div>
<div class="claim">Each Linux container runs inside its own small virtual machine.</div>
<div class="kind">Stronger separation, more machines</div>
</div>
</div>

<ul>
  <li>On the second shape two containers share no kernel, so the shared-kernel claim describes the usual shape and not a law.</li>
</ul>

Note:

<ul>
  <li>Apple states that "Containerization executes each Linux container inside of its own lightweight virtual machine" [S37].</li>
  <li>The Lima and WSL 2 path runs one virtual machine for many containers [V9].</li>

<p class="kicker">Part VI</p>

<h1>Where it breaks</h1>

<div class="rule">

Part VI is the diagnostic part. Evidence first, judgement after.

<p class="kicker">Part VI · The boundary</p>

<h2>The boundary is the system-call interface</h2>

<p class="lede">A virtual machine gives a guest its own kernel behind a hardware boundary. A container shares the host kernel, so its boundary is that kernel's system-call interface.</p>

<div class="stats">
<div>
<div class="stat">1</div>
<div class="stat-cap">kernel shared by every container on the host</div>
</div>
<div>
<div class="stat">300+</div>
<div class="stat-cap">system calls the boundary is drawn on</div>
</div>
<div>
<div class="stat">
<span class="neu">~44</span>
</div>
<div class="stat-cap">of them refused by Docker's default profile</div>
</div>
</div>

<ul>
  <li>Linux publishes a stable, versioned, documented system-call interface.</li>
  <li>Stability makes it dependable. Width makes it large to defend.</li>
  <li>A kernel bug is therefore a possible container escape.</li>
</ul>

Note:

<ul>
  <li>Namespaces separate a container more weakly than a hardware-backed virtual machine separates a guest [T2] [V7] [S73].</li>
  <li>The attack surface takes in the kernel's whole system-call interface [V7].</li>
  <li>The kernel's stable, versioned, documented user-space interface is the numbered system-call interface [V21].</li>
  <li>The default profile refuses around 44 of more than 300 calls [S5].</li>
  <li>Kubernetes states that containers "offer a weaker isolation boundary than virtual machines that utilize hardware-based virtualization" [S73].</li>
</ul>

---

<p class="kicker">Part VI · The escapes</p>

<h2>A container escape, in four steps</h2>

<p class="lede">CVE-2019-5736 overwrote the host OCI runtime binary from inside a container.</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Bait</div>
<div class="desc">A malicious image points its entry at <code>/proc/self/exe</code>.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Re-entry</div>
<div class="desc">The OCI runtime re-executes itself inside it.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Handle</div>
<div class="desc">A library the attacker loaded opens the host's OCI runtime binary for writing.</div>
</div>
<div class="row">
<div class="num">4</div>
<div class="term">Overwrite</div>
<div class="desc">The next start runs attacker code as root.</div>
</div>
</div>

<ul>
  <li>The attack needed only the default options.</li>
  <li>It reached Docker, Podman, CRI-O and containerd alike.</li>
</ul>

Note:

<ul>
  <li>The entry point is a symlink to <code>/proc/self/exe</code>, so the OCI runtime re-executes itself inside the container [S25].</li>
  <li>An <code>LD_PRELOAD</code>ed library constructor "can obtain a writable descriptor to the host binary" [V34].</li>
  <li>The flaw "let a malicious image overwrite the host <code>runc</code> binary" [V34].</li>
  <li>The engine executes that same host <code>runc</code> binary again at every later container start [V34].</li>
  <li>Rootless mode is what runs Docker's daemon without root privileges, and <code>userns-remap</code> mode keeps it privileged [S11].</li>
  <li>Docker's daemon binds a UNIX socket owned by root, so a default install runs it with root privileges [S85].</li>
  <li>The OCI runtime that this privileged path executes therefore runs as root too.</li>
  <li>The next start therefore executes the attacker's code as root.</li>
  <li>The escape needed only the default options and a standard configuration [V37].</li>
  <li>The documented response is to treat the kernel as belonging to a single tenant [S25].</li>
  <li>The flaw reached Docker, Podman, Kubernetes, CRI-O and containerd alike [S24].</li>
</ul>

<p class="kicker">Part VI · The escapes</p>

<h2>One class, disclosed four times</h2>

<p class="lede">One class of bug returned four times in <code>runc</code>. The container controls a path, and the OCI runtime follows it.</p>

<div class="kv">
<div class="pair">
<div class="k">Nov 2025</div>
<div class="v">Three flaws of one class. Each turned on a path the container controlled.</div>
</div>
<div class="pair">
<div class="k">One mechanism</div>
<div class="v">A link replaces <code>/dev/null</code>, so the OCI runtime mounts a host path read-write.</div>
</div>
<div class="pair">
<div class="k">Another</div>
<div class="v">The kernel runs a helper on the host, and that helper ignores namespaces.</div>
</div>
<div class="pair">
<div class="k">2026</div>
<div class="v">CVE-2026-41579. Again a <code>/dev</code> link, again limited host writes.</div>
</div>
</div>

<ul>
  <li>An untrusted image or build file is the most likely way in. The <code>runc</code> 1.1.x branch stayed unpatched.</li>
</ul>

Note:

<ul>
  <li>November 2025 disclosed three CVEs of one class: CVE-2025-31133, CVE-2025-52565 and CVE-2025-52881 [V36].</li>
  <li>Those three abused masked paths and <code>/dev/console</code> mount races [V36].</li>
  <li>Each of the four turned on a path the container itself controlled, which is what makes them one class.</li>
  <li><code>runc</code> is the OCI runtime Docker, Podman, Kubernetes, CRI-O and containerd all use [S24].</li>
  <li>The fixes shipped in runc 1.2.8, 1.3.3 and 1.4.0-rc.3 [S26].</li>
  <li>The runc 1.1.x branch and everything earlier were left unpatched [S26].</li>
  <li>CVE-2026-41579 is the fourth disclosure of the same class [S28] [V36].</li>
  <li>In CVE-2025-31133, replacing <code>/dev/null</code> with a symlink makes runc bind-mount an attacker-chosen host path read-write [S26].</li>
  <li>"As kernel upcalls are not namespaced", the configured binary runs with full host privileges [S26].</li>
  <li>CVE-2026-41579 "allowed a malicious image with a <code>/dev</code> symlink to have limited write access to the host filesystem" [S28].</li>
  <li>Untrusted images and build files are the "most likely delivery method" [S27]. Youki and crun "are understood to have similar flaws" [S27].</li>
</ul>

<p class="kicker">Part VI · The escapes</p>

<h2>When the kernel is the bug</h2>

<p class="lede">Dirty Pipe was a kernel flaw. No fix in an OCI runtime could have prevented it.</p>

<ul>
  <li>CVE-2022-0847 let an unprivileged process write to any file it could read.</li>
  <li>A public proof of concept escaped a container that was granted no extra privilege. It overwrote the cached copy of the OCI runtime binary.</li>
  <li>Patching the engine would not have helped. Changing the engine would not have helped.</li>
  <li>This is what "the boundary is the kernel" means in practice.</li>
</ul>

<p class="closing">Every process in every container on that host was behind the same one bug.</p>

Note:

<ul>
  <li>Dirty Pipe allowed an unprivileged process to write to any file it could read [S30].</li>
  <li>The published proof of concept escaped a container that was granted no extra privilege, through the page-cache copy of <code>runc</code> [S30].</li>
  <li>No fix in the OCI runtime could have prevented a kernel bug.</li>
</ul>

<h2>One systematic study, and what it counted</h2>

<p class="lede">One published survey counted the flaws across eleven implementations instead of estimating them.</p>

<div class="stats">

<div class="stat">59</div>
<div class="stat-cap">published flaws across the 11 "container runtimes" one survey examined</div>
</div>
<div>
<div class="stat">46%</div>
<div class="stat-cap">of the 28 that had a working proof of concept enabled an escape</div>
</div>
<div>
<div class="stat">
<span class="pos">7 of 9</span>
</div>
<div class="stat-cap">tested escapes prevented by user namespaces</div>
</div>
</div>

<ul>
  <li>The survey's authors put most cases in one category: a host component leaked into the container.</li>
  <li>A user namespace prevented seven of the nine exploits the survey tested. Two still worked.</li>
  <li>The two that survived involved the host OCI runtime still running as root against objects the container controls.</li>
</ul>

Note:

<ul>
  <li>The study covers 59 flaws across the 11 "container runtimes" it examined, 28 of them with public proof-of-concept exploits [S29].</li>
  <li>46 percent of those enabled container escape, and the dominant cause was a leaked host component [S29].</li>
  <li>User namespaces prevented 7 of 9 tested escape exploits, so two of the nine still worked [S29].</li>
  <li>The two exploits that survived did so because the host OCI runtime still executes as root against container-controlled objects [V35].</li>
  <li>An LXC maintainer who worked on the runc fix states that privileged containers "are simply never going to be truly secure" [S24].</li>
</ul>

<p class="kicker">Part VI · The comparison</p>

<h2>The other boundary is narrower, not absolute</h2>

<p class="lede">A virtual machine's interface is smaller than a system-call interface. Smaller is not zero.</p>

<ul>
  <li>CVE-2025-22225 is a published flaw in VMware ESXi. An attacker with enough privilege could reach the host through the process that runs the virtual machine.</li>
  <li>The comparison is about the width of the interface, not about a guarantee on either side.</li>
</ul>

<div class="kv">
<div class="pair">
<div class="k">Container</div>
<div class="v">The whole system-call interface of a shared kernel.</div>
</div>
<div class="pair">
<div class="k">Virtual machine</div>
<div class="v">A much smaller device and instruction interface. An attacker crossed it too.</div>
</div>
</div>

Note:

<ul>
  <li>For CVE-2025-22225 "an attacker with requisite privileges could exploit this vulnerability through the VMX process to escape the sandbox" [S36].</li>
  <li>Kubernetes states the container boundary is weaker than hardware-based virtualization [S73].</li>
  <li>The claim is comparative width, not a guarantee on either side.</li>
</ul>

<p class="kicker">Part VI · The comparison</p>

<h2>Containers went back inside virtual machines</h2>

<p class="lede">AWS replaced Linux containers with microVMs to isolate the functions its on-demand service runs.</p>

<ul>
  <li>AWS first isolated its on-demand function service with Linux containers, and reported itself unsatisfied.</li>
  <li>Their stated reason: reliance on a single kernel forces a trade-off between security and compatibility.</li>
  <li>They built Firecracker instead of choosing between the two.</li>
  <li>Kubernetes says sandboxing is often recommended for untrusted code, where workloads are assumed to be malicious.</li>
</ul>

<p class="closing">Packaging is where containers replaced the alternative. Untrusted tenants are where they did not.</p>

Note:

<ul>
  <li>AWS replaced Linux containers with Firecracker microVMs for the functions Lambda runs [S38].</li>
  <li>"When we first built AWS Lambda, we chose to use Linux containers to isolate functions… We were unsatisfied with this approach" [S38].</li>
  <li>Reliance on a single kernel means "a fundamental tradeoff between security and code compatibility" [S38].</li>
  <li>AWS states "We built Firecracker because we didn't want to choose" [S38].</li>
  <li>Kubernetes states that sandboxing "is often recommended when you are running untrusted code, where workloads are assumed to be malicious" [S73].</li>
  <li>Part I named multi-tenancy as the first need, and this is where it landed.</li>
</ul>

<p class="kicker">Part VI · The scope</p>

<h2>Which containers are not virtual machines</h2>

<p class="lede">The shared-kernel claim covers the usual shape. Two documented cases fall outside it.</p>

<div class="matrix">
<div class="m-row">
<div class="src">Kata Containers</div>
<div class="ref">project page</div>
<div class="claim">An OCI runtime that builds a small virtual machine for each container.</div>
<div class="kind">An engine runs it instead of <code>runc</code></div>
</div>
<div class="m-row">
<div class="src">The standard</div>
<div class="ref">the OCI runtime specification</div>
<div class="claim">The runtime specification carries a virtual-machine section of its own.</div>
<div class="kind">Not a deviation</div>
</div>
</div>

<ul>
  <li>So the claim is scoped. A namespace-based Linux container shares the host kernel, and an OCI runtime that builds a virtual machine still conforms to the same standard.</li>
</ul>

Note:

<ul>
  <li>Kata Containers is "An open source container runtime, building lightweight virtual machines" [S33].</li>
  <li>An engine's <code>--runtime</code> option takes any OCI-compatible binary, so a conforming runtime replaces the default one [S13].</li>
  <li>The runtime specification "describes the schema for the virtual-machine-specific section of the container configuration" [S34].</li>
  <li>The claim is therefore scoped to namespace-based Linux containers.</li>
</ul>

<p class="lede">On macOS a bind mount crosses out of the virtual machine on every access. A volume does not.</p>

<div class="stats">
<div>
<div class="stat">3.5x</div>

</div>

<span class="neg">10x</span>

<ul>
  <li>One author measured these ratios on one codebase. They show direction only.</li>
  <li>Many small files dominate the cost, not total bytes.</li>
  <li>On Windows, keep working files in the Linux filesystem.</li>
  <li>Two machines on one engine version differ if one uses the slower file-sharing driver.</li>
</ul>

Note:

<ul>
  <li>Every container on macOS runs inside a Linux virtual machine, so a bind mount crosses that boundary [V9].</li>
  <li>One measurement puts macOS at roughly 3.5 times slower with VirtioFS and 10 times with gRPC-FUSE [S44].</li>
  <li>Moving the directory into a named volume brought timings back in line with Linux [S44].</li>
  <li>Microsoft advises storing files on the Linux drive for speed [S72].</li>
  <li>Storage carrying a <code>.has-mount-program</code> flag file keeps using FUSE whatever the kernel [V13].</li>
  <li>The program leaves the virtual machine on every access to a bind-mounted path, and the measurement tracks that crossing [V9] [S44].</li>
</ul>

<p class="kicker">Part VI · The leaks</p>

<h2>The leak you can trip over: the wrong architecture</h2>

<p class="lede">An image built for one processor architecture on a machine with another runs under translation, or not at all.</p>

<div class="kv">
<div class="pair">
<div class="k">Clear failure</div>
<div class="v"><code>exec format error</code>. The image was built for another architecture and nothing translates it here.</div>
</div>
<div class="pair">
<div class="k">Unclear failure</div>
<div class="v"><code>Illegal instruction</code>. The translator does not implement an instruction the program uses.</div>
</div>
<div class="pair">
<div class="k">Slow success</div>
<div class="v">It runs. Each system call is caught, converted and forwarded, so system-call-heavy work suffers most.</div>
</div>
<div class="pair">
<div class="k">Fix</div>
<div class="v">Name your own architecture with <code>--platform linux/arm64</code> or <code>--platform linux/amd64</code>. Prefer images built for that architecture.</div>
</div>
</div>

Note:

<ul>
  <li><code>exec format error</code> is the canonical symptom of an image built for the wrong architecture [S59].</li>
  <li>Rosetta does not implement AVX, so such images fail with <code>Illegal instruction</code> [S45].</li>
  <li>Under translation each system call is caught, converted and forwarded to the host kernel [S59].</li>
  <li><code>--platform=OS/ARCH</code> selects the image for a given platform [S61].</li>
</ul>

<p class="kicker">Part VI · The leaks</p>

<h2>What is inside an image nobody opened</h2>

<p class="lede">An image freezes a package set on the day it was built, and nothing refreshes it afterwards.</p>

<ul>
  <li>One scanning study of images built for neuroscience data analysis found they contain hundreds of known vulnerabilities.</li>
  <li>Rebuilding the same images against current packages removed about two thirds of those vulnerabilities.</li>
  <li>The same paper reports, from earlier work rather than its own, that over 30 percent of official images on one registry carry high-priority vulnerabilities.</li>
  <li>The images pulled in Part II are somebody else's filesystem, running under your engine.</li>
  <li>Rebuild on a schedule, because nothing else refreshes the package set.</li>
</ul>

Note:

<ul>
  <li>The study measured images for neuroscience data analysis and found they "contain hundreds of vulnerabilities" [S31].</li>
  <li>Software updates removed "roughly two-thirds of these" [S31]. The 30-percent figure for official images is quoted by that paper from earlier work [S31].</li>
  <li>The 2025 advisories name untrusted images as the most likely delivery method [S27].</li>
  <li>Image layers are read-only below the container's writable layer [S6], so only a new build applies those updates.</li>
</ul>

<p class="kicker">Part VI · Honest limits</p>

<h2>Three things the evidence leaves open</h2>

<div class="gaps">
<div class="gap">
<div class="dot">•</div>
<div class="gap-term">A namespace can outlive its processes</div>
<div class="ref">namespaces(7)</div>
<div class="gap-desc">Bind-mounting an entry in <code>/proc</code> keeps a namespace alive after every process in it exits.</div>
</div>
<div class="gap">
<div class="dot">•</div>
<div class="gap-term">The memory report has no kernel fix</div>
<div class="ref">Docker docs</div>
<div class="gap-desc">Nothing namespaced those files. The workaround is a userspace filesystem.</div>
</div>
<div class="gap">
<div class="dot">•</div>
<div class="gap-term">Your own installation has its own defaults</div>
<div class="ref">containers.conf</div>
<div class="gap-desc">Read your network backend and storage driver from <code>containers.conf</code>.</div>
</div>
</div>

<p class="closing">Read the real limit from <code>/sys/fs/cgroup/memory.max</code>, not <code>free</code>. Check <code>/proc</code> for a bind mount before trusting that a namespace is gone.</p>

Note:

<ul>
  <li>Bind mounting a file in <code>/proc/pid/ns</code> "keeps the corresponding namespace… alive even if all processes currently in the namespace terminate" [S1].</li>
  <li><code>/proc/meminfo</code> and its neighbours always display host numbers [S41].</li>
  <li>The control group holds the limit, and the files <code>free</code> reads do not [S2] [S41].</li>
  <li>The remaining default is read from <code>containers.conf</code> and the release notes for the installed version [V27].</li>
  <li>Where an inside number and an outside number disagree, count the boundary crossings between them [V23].</li>
</ul>

<ul>
  <li><code>chroot</code> shows a process one subtree of the file tree and hides the rest.</li>
  <li>FreeBSD jails, in 2000, answered the same need with a compartment that reached past the file tree.</li>
  <li>Solaris Zones, in 2004, answered the same need on Solaris, and limited what each compartment consumed.</li>
  <li>The <code>chroot</code> date comes from a reading of the source-control logs, not from folklore.</li>
  <li>Popular timelines print 1979. The two accounts genuinely disagree, and the log date is better evidenced.</li>
  <li>Control groups are dated by the kernel release that carried them, not by a press date.</li>
</ul>

Note:

<ul>
  <li><code>chroot(2)</code> was added to BSD by Bill Joy on 18 March 1982, per Kirk McKusick's reading of the SCCS logs [V30].</li>
  <li><code>chroot</code> limits a process to a single subtree of the filesystem name space [S19].</li>
  <li>The compartment of <code>chroot</code> "does not extend to the process or networking spaces", and a jail does [S19].</li>
  <li>The jails paper states that a jail "effectively amounts to a virtual machine environment" [S19].</li>
  <li>The Solaris Zones paper states the need as isolation plus a limit on resource use, which is what a zone provides [S58].</li>
  <li>The author of FreeBSD jails states that <code>chroot</code> was never intended as a security mechanism [S20].</li>
  <li>Popular timelines date the call to 1979 and to Version 7 Unix, and the two accounts genuinely disagree [V31].</li>
  <li>The mount namespace arrived in kernel 2.4.19 in 2002 [S21].</li>
  <li>Control groups version 1 appeared in Linux 2.6.24 [S2].</li>
  <li>The 2013 date for the first Docker image and registry is the one every account cited here gives.</li>
  <li>The Open Container Initiative was launched on 22 June 2015 [S9].</li>
</ul>

<ul>
  <li>The lanes are parallel answers to one pressure, not a line of descent. Accounts written at the time attribute the idea of namespacing to Plan 9, not to BSD.</li>
  <li>The kernel maintainers refused the word. Google's "process containers" became control groups.</li>

  <li>Contemporaneous accounts attribute the idea of namespacing to Bell Labs' Plan 9 [V5].</li>
  <li>Google engineers began "process containers" in 2006, and the name changed to control groups to avoid overloading the word container [V6].</li>
  <li>Jails were presented as amounting to a virtual machine environment, which is where the reading began [S19].</li>
</ul>
