<p class="kicker">Part VII · Optional</p>

<h2>What 2013 added, and what it did not</h2>

<p class="lede">Isolation was available for a decade before the first Docker release. What was missing was a way to move an application between machines.</p>

<div class="boxes">
<div class="box">
<div class="box-label">Not new in 2013</div>
<div class="box-head">The isolation</div>
<ul>
<li>Namespaces from 2002, control groups from 2008.</li>
<li>LXC had already combined them, and Docker began as a command-line front end to LXC.</li>
</ul>
</div>
<div class="box filled">
<div class="box-label">New in 2013</div>
<div class="box-head">The image and the transport</div>
<ul>
<li>A layered image named by the hash of its content.</li>
<li>A protocol for moving it between machines.</li>
<li>Deployment becomes one command against a named hash.</li>
</ul>
</div>
</div>

Note:

<ul>
  <li>The problem containers were built to solve is distribution, not isolation [V3].</li>
  <li>The technically interesting part was the least technically novel part [V4].</li>
  <li>Docker began as a Python command-line front end to LXC and AUFS [S22].</li>
  <li>Low-level container management later moved out of Docker into containerd [S22].</li>
</ul>

---

<p class="kicker">Part VII · Optional</p>

<h2>Kubernetes dropped Docker, and the images kept working</h2>

<p class="lede">Since 2015 the image format and the runtime contract are standards. One consequence arrived seven years later.</p>

<ul>
  <li>Kubernetes removed <code>dockershim</code>, its adapter for Docker, in release 1.24.</li>
  <li>Images built by Docker kept working everywhere, because they are standard OCI images.</li>
  <li>Docker was replaced underneath the format. The format did not move.</li>
</ul>

<p class="closing">Docker no longer controls the implementation, and the images it builds still run under every conforming engine.</p>

Note:

<ul>
  <li>The v1.24 release of Kubernetes "actually removed the dockershim", the adapter for Docker [S39].</li>
  <li>"The image that Docker produces isn't really a Docker-specific image—it's an OCI image" [S40].</li>
  <li>A standard image therefore keeps working under every conforming engine [S40].</li>
  <li>The standard was launched in June 2015 by Docker, CoreOS and others [S9].</li>
</ul>

<h2>Takeaways</h2>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">No kernel object</div>
<div class="desc">Five mechanisms in one configuration file. Remove one and something still runs.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Not a small machine</div>
<div class="desc">The boundary is a shared kernel. The record has real escapes through it.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Same parts, two shapes</div>
<div class="desc">They differ over who owns the container, not over what is asked of the kernel.</div>
</div>
<div class="row">
<div class="num">4</div>
<div class="term">Linux, or a Linux inside</div>
<div class="desc">Lima and WSL 2 supply that kernel. Windows containers are the exception.</div>
</div>
<div class="row">
<div class="num">5</div>
<div class="term">Configuration, not magic</div>
<div class="desc">Read the capability set before reaching for an option that removes it.</div>
</div>
</div>

Note:

<ul>
  <li>A container is a list of kernel requests, not a kernel object [T1] [V2].</li>
  <li>The boundary is the system-call interface of a shared kernel [T2] [V7].</li>
  <li>The two engines disagree about ownership of the container process [T3] [V15].</li>
  <li>A Linux container on macOS or Windows runs inside a Linux virtual machine [T4] [V9].</li>
  <li>What a process may do is a readable capability set and a readable filter [T5] [V10].</li>
</ul>

---

<h2>What follows</h2>

<p class="lede">Four things to do differently once a container stops being a black box.</p>

<div class="kv">
<div class="pair">
<div class="k">1 · Read the refusal</div>
<div class="v">Find which capability or filter rule refused. Then grant that one.</div>
</div>
<div class="pair">
<div class="k">2 · Choose where data lives</div>
<div class="v">Writable layer, volume or bind mount. Decide before the first run.</div>
</div>
<div class="pair">
<div class="k">3 · Check the host, not the flag</div>
<div class="v">Control group version, namespace policy and architecture set the limits. No option overrides them.</div>
</div>
<div class="pair">
<div class="k">4 · Keep the habit</div>
<div class="v">Predict, observe, explain.</div>
</div>
</div>

<p class="closing">Three of these read a value the machine already holds: the capability set, the storage destination, and the control group version.</p>

Note:

<ul>
  <li>Never answer a permission error with <code>--privileged</code>, which is the absence of a boundary [V8].</li>
  <li>Treat root within a container as if it is root outside of the container [S32].</li>
  <li>The three storage destinations have three different lifetimes [S64].</li>
  <li>The capability set of a running process is readable from <code>/proc</code> [S3].</li>
  <li>Host policy gates rootless operation, and no engine option reaches it [S48] [S77].</li>
  <li>Podman 6.0.0 removed support for control groups version 1, so the host's version decides whether the engine runs at all [S65].</li>
  <li>Resource limits on a rootless container need control groups version 2 [S61].</li>
  <li><code>exec format error</code> is the symptom of an image built for the host's other architecture [S59].</li>
  <li><code>--platform=OS/ARCH</code> selects the image for a platform, and it cannot change the host's own [S61].</li>
  <li>The same correction applies to another everyday word: a thread is not a kernel concept [V26].</li>
  <li>The course toolchain is one reproducible environment built from these primitives [V24].</li>
</ul>
