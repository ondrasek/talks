<p class="kicker">Part I</p>

<h2>What does one byte cost?</h2>
<p class="lede">Two programs write the same mebibyte to a file. That is 1,048,576 bytes. One uses a buffer. One does not.</p>

```python
<h1>A: unbuffered — one call per byte</h1>
with open("a.out", "wb", buffering=0) as f:
    for i in range(1024 * 1024):
        f.write(b"x")

<h1>B: buffered — the default</h1>
with open("b.out", "wb") as f:
    for i in range(1024 * 1024):
        f.write(b"x")
```

One argument differs. Python documents it: "Pass 0 to switch buffering off (only allowed in binary mode)" [S6].

<div class="footnotes">
[S6] Built-in Functions, open() — Python documentation. https://docs.python.org/3/library/functions.html#open
</div>

Note:
Read both programs now. The next twenty minutes depend on you believing they are the same program apart from one argument [S6].

Same loop. Same iteration count. Same interpreter. Same bytes, in the same order, to the same kind of file.

Notice also that you have to ask for the unbuffered version. It is not the default. You cannot write program A by accident, and that will matter when we decide what the practical lesson is.

One word about the word buffer, because I use it in exactly one sense today. A buffer is memory that collects bytes for consecutive positions in the file. The next level then takes them in one call instead of many. It saves calls. It does not save work.

<p class="kicker">Part I</p>

<h2>Two programs, two access patterns</h2>
<div class="kv">
  <div class="pair"><div class="k">Sequential access</div><div class="v">Each write continues where the last one ended.</div></div>
  <div class="pair"><div class="k">Random access</div><div class="v">Each write follows a move to a new offset.</div></div>
  <div class="pair"><div class="k">Why it matters</div><div class="v">Lampson advised batch processing in 1983. He named sequential access in the next sentence, as a second and separate reason [S12].</div></div>
</div>

<div class="footnotes">
[S12] Hints for Computer System Design — Lampson (1983), p. 19. https://www.microsoft.com/en-us/research/wp-content/uploads/2016/02/acrobat-17.pdf
</div>

Note:
Two terms, and I hold them to these meanings for the rest of the course.

Sequential access means each write continues where the last one ended. Random access means each write follows a move to another offset. Do not say scattered and do not say non-linear. Say random access, because that is what the assignment says.

Both programs on the last slide use sequential access. Assignment one asks you to run the comparison a second time with random access and explain the difference. I tell you now so you can listen to section two with the assignment in mind.

The vocabulary is not new. Lampson wrote both terms down in 1983, in a paper of design hints. Use batch processing if you can, he says. Doing things incrementally almost always costs more. He then adds that disks and tapes work much better when accessed sequentially. Read that clause carefully. He sets it aside from the batching advice. He does not rest the advice on it.

That sentence is forty-three years old, and it names the two access patterns you measure next week.

Note:
This slide is why I refuse to print a benchmark figure.

Python's default buffer was eight kilobytes for sixteen years. It is now typically one hundred and twenty-eight kilobytes. The change landed in Python 3.14. The project's own issue explains the old value. The maintainers chose eight kilobytes in 2008, for a machine that ran a thirty-two bit operating system with under two gigabytes of memory.

One caution on that multiplier. The issue author measured it himself, on Python 3.11, writing a file he had downloaded over HTTP [S7]. A core developer confirmed the direction in the same thread, and posted no numbers [S7]. So nobody reproduced the figure. I quote it as the maintainers' stated reason for the change, not as a figure you can rely on.

Think what that does to your homework. Say some of you run 3.13 and others run 3.14. Your crossing counts then differ by a factor of sixteen. That reason has nothing to do with what the assignment measures. So report the version and the buffer size beside every number. One line of Python prints it.

<p class="kicker">Part II</p>

<h2>Where does the difference come from?</h2>
<p class="lede">The difference is the number of times each program crosses into the operating system.</p>

Your theory course defined a system call. This lecture counts them: each one makes a **crossing** out of your program, "a privilege transition, not a jump" [V15].

<div class="rows">
<div class="row"><div class="num">A</div><div class="term">Unbuffered</div><div class="desc">One call per byte, so <span class="neg">1,048,576</span> calls.</div></div>
<div class="row"><div class="num">B</div><div class="term">Buffered</div><div class="desc">One mebibyte divided by the buffer size.</div></div>
<div class="row"><div class="num">=</div><div class="term">So measure first</div><div class="desc">At 8 KiB, <span class="pos">128</span> calls. At 128 KiB, 8 calls.</div></div>
</div>

Note:
Here is the answer. The two programs differ in the number of crossings they make into the operating system.

Program A asks once per byte. A mebibyte is one million and forty-eight thousand five hundred and seventy-six bytes, so that many requests.

Program B asks once per buffer fill. Divide one mebibyte by the buffer this machine allocated. At eight kilobytes that is one hundred and twenty-eight requests. At one hundred and twenty-eight kilobytes it is eight. Print the size before you divide, because I am not going to guess it for you.

Be precise about the vocabulary now, because I use it for the rest of the course. You already know what a system call is, so I am not going to define it. I am going to name the thing I count. The passage out of your program and back is one crossing, and every crossing is one system call. Do not call it a kernel call. Do not call it an API call. An API call may or may not become one, and that distinction is what this lecture exists to draw.

---

<p class="kicker">Part II</p>

<h2>What one crossing costs</h2>
<div class="stats">
  <div><div class="stat">4,972</div><div class="stat-cap">instructions, one <code>stat</code> call</div></div>
  <div><div class="stat">13,585</div><div class="stat-cap">cycles for the same call</div></div>
  <div><div class="stat">2,559</div><div class="stat-cap">L3 lines evicted — your data, not the kernel's</div></div>
</div>

Soares and Stumm measured this on 2010 hardware [S16]. The counts are not current [V2]. What carries over is the regime distinction, not the numbers. That distinction is a call rate. The lost cache state dominates at one call per 2,000 to 100,000 instructions. The transition cost takes over above that rate [S16].

<div class="footnotes">
[S16] <span class="src-title">FlexSC</span> — Soares and Stumm, OSDI 2010. https://www.usenix.org/legacy/event/osdi10/tech/full_papers/Soares.pdf
</div>

Note:
Why is a crossing expensive? Your theory course probably said the processor changes privilege level. That is true, and it is not the main cost [S16].

Soares and Stumm measured what one system call does to the processor. A single stat call retires just under five thousand instructions in about thirteen and a half thousand cycles. Retiring an instruction means finishing it. The ratio is 0.37 instructions per cycle, so the processor finishes one instruction every three cycles [V2]. Straight-line code on the same processor finishes more than one per cycle, so this is slow work rather than ordinary work.

Now the third number. That one call evicted two and a half thousand lines from the level three cache [V2]. That is the processor's own cache, the last one before main memory. Those lines held your program's data. Each one becomes a cache miss that your code pays for after the call returns.

Two caveats, and they are the kind this course exists to teach. The measurement is from 2010 hardware, so do not quote the counts as current. And the paper separates two regimes by call rate. The medium band is one call per two thousand to one hundred thousand instructions. In that band the lost cache state dominates. Above that rate the transition itself takes over. Both regimes are in the same paper [S16].

Program A makes one system call for every loop iteration. That loop probably runs fewer than two thousand instructions between calls, so it sits above the medium band. That places it where the transition cost dominates. The paper measures no Python program, and I have not counted the interpreter's instructions per call, so the placement is mine.

Either way the cost is largely fixed per call. Doubling the bytes in one call is nearly free. Doubling the calls is not.

<p class="kicker">Part II</p>

<h2>What one trace line says</h2>
<p class="lede">A trace records the system calls a program made, in order, with arguments and return values.</p>

```text
open("/dev/null", O_RDONLY) = 3
```

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">The name</div><div class="desc">Which system call ran [S1].</div></div>
<div class="row"><div class="num">2</div><div class="term">The arguments</div><div class="desc">In parentheses, decoded [S1].</div></div>
<div class="row"><div class="num">3</div><div class="term">The return value</div><div class="desc">After the equals sign [S1].</div></div>
</div>

A trace is not a log. A log carries what the program's author chose to print. A trace carries what the program did.

<div class="footnotes">
[S1] strace(1) — Linux man-pages, which documents this example line. https://man7.org/linux/man-pages/man1/strace.1.html
</div>

Note:
This is one line of output from a tool called strace. It is the example the manual page itself uses, so it is a safe one to learn on [S1].

Read it left to right. The name of the system call. Then the arguments in parentheses, decoded into names rather than raw numbers. Then an equals sign and the return value.

That is the whole format. Every line looks like this. Once you can read one line you can read a thousand, and the rest of this course assumes you can.

One word about vocabulary. A trace is not a log. A log contains what the author decided to print. A trace contains every call the program made, including the ones the author never printed. So a tracer answers questions the author did not anticipate.

Read that line again, slowly.

<h2>Count the crossings</h2>
<p class="lede">The same two programs, run again under a counting tracer.</p>

<div class="kv">

  <div class="pair"><div class="k">Program A</div><div class="v">One <code>write</code> per byte.</div></div>

<div class="footnotes">
[S1] strace(1) — Linux man-pages. https://man7.org/linux/man-pages/man1/strace.1.html
</div>

Note:
I am running the counting version now. The filter matters. Before your code starts, Python itself opens and reads a large number of files. Without the filter you get every call that work makes, and the one interesting line disappears into the noise [S1].

Look at the two summaries side by side. First I print the buffer size this machine uses. Then I divide one mebibyte by it. Then I compare my result with the count the tool reported. If those two disagree, the arithmetic used the wrong divisor. Finding that out is the exercise working rather than failing.

This is what I mean when I say the boundary is observable. You run one command and you get the exact number of requests your program made. Not an estimate, and not a model. Program A was slow because it made a million of them.

<p class="kicker">Part II</p>

<h2>The count ratio over-predicts the time</h2>
<p class="lede">Illustration, not a measurement from this room: a count ratio of 100,000 beside a time ratio of 40 is not a mistake.</p>

<p class="model"><code>time &asymp; crossings &times; fixed cost&ensp;+&ensp;bytes &times; marginal cost</code> [V1]</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Two terms</div><div class="desc">Not a function of bytes alone [V1].</div></div>
<div class="row"><div class="num">2</div><div class="term">One term is shared</div><div class="desc">Both programs write the same mebibyte through the same loop.</div></div>
<div class="row"><div class="num">3</div><div class="term">So counts over-predict</div><div class="desc">Under this model the count ratio exceeds the time ratio.</div></div>
</div>

Note:
This slide exists because of a sentence I was tempted to say and will not. The tempting sentence is that the ratio of the counts is the ratio of the times. It is false, and the run you just watched shows it false [V1].

Now apply it. Both programs write one mebibyte through the same million-iteration loop. So the second term, and all the interpreter work, is identical. It is a floor neither program can get under.

Under that model the count ratio over-predicts the time ratio, and the shared floor is why. If your counts differ by a hundred thousand and your times by forty, you have not made a mistake. You measured the floor. Those two figures are an illustration, not a measurement from this room.

One caveat on the model itself. Nobody has verified it across machines, and per-crossing costs vary by an order of magnitude between them [V1]. So treat it as a shape, not as a formula to solve.

You will see this gap in assignment one. Meet it here rather than there.

<p class="lede">A buffer collects adjacent bytes and hands them down in one call.</p>

Cost has two terms: the number of crossings, and the number of bytes [V1]. A buffer cuts the first and leaves the second alone, so the saving sits entirely in the call count.

Note:
Look at the picture. Your loop still runs a million times. Every one of those writes still happens, and every byte is still copied.

What changed is the right-hand arrow. Instead of a million crossings there are a few hundred, because the buffer holds bytes until it is full and then hands over a block.

I want to be precise about the word adjacent, because the next slide turns on it. A buffer holds bytes destined for consecutive positions in the file. It can do that because a block write to the operating system carries one offset and one length. Bytes going to one place travel together. Bytes going to two places cannot.

Say it back to yourselves in one sentence. A buffer saves calls, not work. The copying still happens. The loop still runs. Only the number of crossings goes down.

That is takeaway one, half stated. The other half is next, and it is the half the assignment measures.

<p class="kicker">Part II</p>

<h2>Why a seek gives the saving back</h2>
<p class="lede">A buffer holds bytes for consecutive positions. Move elsewhere and those bytes cannot stay in it.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Constraint</div><div class="desc">Buffered bytes belong at the old offset.</div></div>
<div class="row"><div class="num">2</div><div class="term">Consequence</div><div class="desc">Every seek forces the buffer out.</div></div>
<div class="row"><div class="num">3</div><div class="term">Result</div><div class="desc">The buffered run converges on the unbuffered.</div></div>
</div>

The rule is <span class="neu">buffering is fast when writes are adjacent, and buys little when they are not</span>. Lampson gave the batching half in 1983 [S12].

Note:
If you keep one slide from today, keep this one. Assignment one is graded on the rule it states.

A buffer collects bytes for consecutive positions. Now suppose you write one byte, move to a different offset, and write another. The first byte belongs at the old offset. It cannot sit in the buffer waiting, because the buffer has one destination. So the library must hand it over before it can move.

Every seek forces the buffer out. Seek between every write and the buffer never holds more than one byte. The buffered program then makes the same number of crossings as the unbuffered one. The saving is gone, and the trace shows it.

So the rule has a condition. Buffering is fast when writes are adjacent, and buys little when they are not. Lampson wrote the batching half in 1983. The part about a seek emptying a userspace buffer is mine. It follows from the mechanism above rather than from him.

One honest limit. Adjacency is necessary and not sufficient. A program already writing a mebibyte in one call has nothing left to collect.

---

<p class="kicker">Part II</p>

<h2>Does the seek itself cost a crossing?</h2>
<p class="lede">Yes. And a pair of system calls exists to remove it.</p>

<div class="kv">
  <div class="pair"><div class="k">Naive</div><div class="v"><code>lseek</code> then <code>write</code> — two crossings for one operation.</div></div>
  <div class="pair"><div class="k">Merged</div><div class="v"><code>pread</code> and <code>pwrite</code> "combine[s] file access and seek operations into a single command" [V3].</div></div>
  <div class="pair"><div class="k">Measured</div><div class="v">The merged pair cut the call count [V3]. For the same data volume the study also reports "a relatively reduced load in terms of overall duration" [V27].</div></div>
</div>

Note:
Somebody always asks this, so I answer it before you do.

Yes. Moving to a new offset is itself a request to the operating system. So a random-access run does not make one crossing per byte. It makes two.

That is worth knowing for your assignment, because the random pattern is worse than the sequential unbuffered pattern rather than merely equal to it.

And here is the evidence that the crossing count is the real variable. Linux offers a pair of calls that merge the move and the access into one call. A study replaced the two-call pattern with the merged pair. The call count fell [V3]. For the same data volume the study reports a reduced overall duration [V27].

I am not claiming that the crossing count was why those calls were added. I do not know that, and the source does not say it. My claim is narrower. Merging two crossings into one gave a relatively reduced overall duration for that workload [V27].

You will not need these calls for assignment one. I mention them as evidence.

<h2>Trust the counts. Do not trust the times.</h2>
<p class="lede">The tracer stops your program twice per call. That destroys the timing and leaves the counting intact.</p>

<div class="matrix">
<div class="m-row"><div class="src">Every call stops</div><div class="ref">[V13]</div><div class="claim">So "the counts are trustworthy and the absolute times are not".</div><div class="kind">Counts only</div></div>
<div class="m-row"><div class="src">Gregg's dd loop</div><div class="ref">[V17]</div><div class="claim">One byte per call, "runs 442× slower under strace".</div><div class="kind">His machine</div></div>
<div class="m-row"><div class="src">Re-runs</div><div class="ref">[V31]</div><div class="claim">"roughly 37× to 136×", other hardware.</div><div class="kind">Not a bound</div></div>
</div>

The range does not contain Gregg's figure. Each number measures one machine and one workload.

Note:
You have no reason yet to believe this tracer, so let me give you one, and let me tell you where it misleads.

Because it stops every call that reaches the kernel, it counts every one of them. Nothing is sampled. That is why you may believe the counts.

There is one gap worth knowing. Linux serves a few calls without a crossing at all, from a page it shares with your process. The tracer is silent on those, because there is nothing to intercept [V26].

Because it stops every call, it also makes your program much slower. Brendan Gregg measured the worst case with a dd loop that copies one byte per call [V17]. That program does almost nothing but system calls, and it ran four hundred and forty-two times slower under the tracer [V17]. Later runs of the same loop report thirty-seven to one hundred and thirty-six times [V31]. Those runs used other hardware, with other speculative-execution mitigations [V31]. Notice that the later range does not contain Gregg's figure. None of the numbers is wrong, because the overhead follows the call rate of one program on one machine. So a single overhead number is not a fact about the tool.

So the rule for this course is: count under the tracer, time without it. That is why part one and part two used two different runs, and I said so at the time.

If you benchmark under a tracer in the lab, you will report nonsense.

<p class="kicker">Part III</p>

<h2>Four levels, and who empties each one</h2>
| level | who owns it | emptied by |
|---|---|---|
| 1 Application | the runtime's own buffer [S8] | `f.flush()` [S17] |
| 2 C library | the `stdio` buffer [S3] | `fflush()` [S3] |
| 3 Kernel | the page cache [V32] | `fsync()` [S13] |
| 4 Device | the drive's write cache [V20] | a cache-flush command [V33] |

The page cache lives in the machine's memory [V32]. It is not the disk's cache — the disk has its own, one level further down [V20].

Reads use the same four levels, in the other direction. The kernel fetches pages ahead of a sequential reader, so "a sequential `read()` just happens to return faster because the data was already fetched" [V34].

Note:
The same four levels as a table, because you will want to copy this one.

Level three deserves its own name. It is called the page cache, and it is the operating system's own buffer for file data. It lives in the machine's memory. A write that reaches it has left your program, and it has not left the machine.

Two things people get wrong, and you should get neither wrong.

First, it is not the disk's cache. The disk has its own cache, and that is level four, one step further down. Two caches, two owners, two failure modes.

Second, a busy machine shows very little free memory because the page cache has grown into it. That is correct behaviour and not a leak. The memory is reclaimable the moment something else needs it.

One sentence about reading, because this hour only ever writes. The same four levels carry data upward. Level three fetches pages ahead of a sequential reader, so the read returns from memory rather than from the device [V34]. This stack is not a write-only structure, even though every demonstration today is a write.

Now look at the last row. The device has a cache of its own, and emptying that one is the least reliable step in the diagram. Hold that thought.

<p class="kicker">Part III</p>

<h2>To flush is to cross one boundary</h2>
<p class="lede">The verb means one thing here: to hand a buffer's contents to the next level down.</p>

The C library manual says it plainly: "Note that fflush() flushes only the user-space buffers provided by the C library. To ensure that the data is physically stored on disk the kernel buffers must be flushed too" [S3].

<div class="rows">
<div class="row"><div class="num">✗</div><div class="term">Do not say</div><div class="desc">Save, commit, persist — all claim durability.</div></div>
<div class="row"><div class="num">✓</div><div class="term">Say</div><div class="desc">Flush. It names one boundary.</div></div>
</div>

<div class="footnotes">
[S3] fflush(3) — Linux man-pages. https://man7.org/linux/man-pages/man3/fflush.3.html
</div>

Note:
This is the misconception I most want to remove today, and it earns a slide of its own.

The common belief is that the verb flush means "written to disk". It does not. It means "handed to the next level down". The manual page says so in its own words. It carries that note because the question comes up so often.

Read the quote carefully. It flushes only the user-space buffers provided by the C library. To get data physically onto a disk, the kernel buffers must be flushed too. That is two calls, not one.

So in this course, flush is a verb with a precise meaning. It crosses one boundary. If you write "save" or "persist" in your assignment when you mean flush, I will ask which boundary you crossed.

A student who leaves believing that a program flushes all the way to the platter has learned something false. Ordinary use will not correct it, because only a power cut falsifies the belief.

---

<p class="kicker">Part III</p>

<h2>Wholesale down, retail up</h2>
<p class="lede">Every level buys a large block from the level below. It sells small pieces to the level above.</p>

That asymmetry is why every level in this diagram holds a buffer. Each level's "unit of purchase is larger than its unit of sale" [V18].

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Buys in blocks</div><div class="desc">4096 bytes on an ext4 file [V7].</div></div>
<div class="row"><div class="num">2</div><div class="term">Sells in bytes</div><div class="desc">Your loop writes one byte.</div></div>
<div class="row"><div class="num">3</div><div class="term">Same shape elsewhere</div><div class="desc">Allocators, caches, network stacks.</div></div>
</div>

Note:
Four levels is four facts, and four facts are hard to keep. One rule is easier, so here is the rule that generates all four [V18].

Each level buys wholesale from the level below and sells retail to the level above. Its unit of purchase is larger than its unit of sale. That asymmetry is why every level in the diagram holds a buffer.

Apply it to level two. On an ext4 file the C library takes a buffer of four thousand and ninety-six bytes [V7]. It sells single bytes to your loop. The gap between those two units is the saving you measured in part one.

I give you the rule rather than the four facts because the rule travels. You will meet it in memory allocation, in processor caches and in network buffers.

I avoid one thing deliberately. I am not giving you a warehouse or a bucket for the page cache. Physical memory is a cache rather than a container, and a container image installs the wrong intuition.

---

<p class="kicker">Part III</p>

<h2>Python's buffer does not sit on the C library's</h2>
<p class="lede">Levels one and two are alternatives, not a pile.</p>

<div class="boxes">
<div class="box">
<p class="kicker">Intuitive, and wrong</p>
A Python write falls through the runtime buffer into the C library buffer and then into the operating system.
</div>
<div class="box filled">
<p class="kicker">What happens</p>
"CPython reimplements the same policy above libc rather than inheriting it" [V6]. Python uses level one. C uses level two.
</div>
</div>

Python documents a typical <span class="neu">128 KiB</span> [S6]. The C library takes 4096 on an ext4 file [V7]. Two adjacent levels, two sizes, neither in your source.

<div class="footnotes">
[S6] <span class="src-title">Built-in Functions, open()</span> — Python documentation. https://docs.python.org/3/library/functions.html#open
</div>

Note:
I flagged this on the diagram and I am returning to it, because it is the detail people get wrong.

If you read levels one and two as a stack, you conclude that a Python write passes through both. It does not. CPython reimplements the buffering policy above the C library instead of inheriting it. A Python program uses level one. A C program uses level two. They are alternatives.

Here is evidence you can check yourself, and it is the best evidence today that the stack is real. Python documents a typical buffer of one hundred and twenty-eight kilobytes [S6]. Now take an ext4 file with a block size of four thousand and ninety-six bytes. On that file the C library buffer measures four thousand and ninety-six bytes too [V7]. That is one measured machine. Do not carry the number to a machine you have not measured.

Two adjacent levels. Two sizes, a factor of thirty-two apart. Neither number appears in your source code.

---

<p class="kicker">Part III</p>

<h2>The bottom level acknowledges early too</h2>
<p class="lede">Level four is the uncomfortable one, and skipping it would make the diagram dishonest.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">The device holds a buffer</div><div class="desc">"most HDDs and many SSDs acknowledge a write once it lands in an onboard DRAM cache" [V20].</div></div>
<div class="row"><div class="num">2</div><div class="term">The standard allows a no-op</div><div class="desc">On <code>fsync</code>: "a null implementation is permitted" [S13].</div></div>
<div class="row"><div class="num">3</div><div class="term">Software cannot check</div><div class="desc">No trace separates a device that flushed from one that only reported it [V5].</div></div>
</div>

<div class="footnotes">
[S13] fsync — The Open Group. https://pubs.opengroup.org/onlinepubs/9699919799/functions/fsync.html
</div>

Note:
I could stop the diagram at three levels. I am not going to, because the fourth is where data is actually lost, and no tool in this lecture can watch it [V20] [V5].

The device has its own memory. Most spinning disks and many solid state drives report a write as complete when it lands in that memory. At that moment the bytes are still short of the platter or the flash. A power cut in that window loses the data. The device already told the operating system that the write succeeded.

And here is the limit on today's thesis, which I would rather state than have you find. A trace cannot separate a device that flushed from a device that only reported that it flushed. Everything above this level is observable with a tool you can run. This level is not.

That is why a durability lecture exists, why databases are written the way they are, and why people test storage with a power switch.

<p class="kicker">Part III</p>

<h2>Three lines that print nothing</h2>
<p class="lede">A demonstration. You have the stack now, so predict this one.</p>

```python
import os
print("hello")
os._exit(0)

<p class="kicker">Part III</p>

<h2>Why the file is empty</h2>
<p class="lede">The rule sits in the C standard, not in the kernel.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Mode follows destination</div><div class="desc">Output is "fully buffered if and only if the stream can be determined not to refer to an interactive device" [S5].</div></div>
<div class="row"><div class="num">2</div><div class="term">A terminal is interactive</div><div class="desc">Bytes go out per line.</div></div>
<div class="row"><div class="num">3</div><div class="term">A file is not</div><div class="desc">Bytes wait.</div></div>
<div class="row"><div class="num">4</div><div class="term">The exit skips cleanup</div><div class="desc">No <code>write</code> reaches the kernel.</div></div>
</div>

<div class="footnotes">
[S5] C99 draft §7.19.3. https://busybox.net/~landley/c99-draft.html
</div>

Note:
Here is the explanation, and notice where it comes from [S5].

The rule is in the C language standard. It is not an operating system behaviour and it is not a Python quirk. The standard says that standard output is fully buffered if and only if the stream can be determined not to refer to an interactive device.

Then the third line ends the process without running any cleanup. The standard explicitly permits termination paths that do not close files properly. The buffer is process memory. The process is gone. The bytes went with it.

Now the sentence that connects this back to section two. A trace of this program holds no write call at all. Not a failed one. Not a short one. None. The bytes never got as far as the operating system.

That is the top of the stack, proved to exist by removing it.

<p class="kicker">Part III</p>

<h2>What this demonstration does not prove</h2>
<p class="lede">It proves level one is real. It proves nothing about levels three and four.</p>

"the honest classroom demo is a power-cut, not a `kill -9`. Killing the process loses only the *runtime's* buffer; the kernel still writes back." [V14]

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">What died</div><div class="desc">The process, and the level-one buffer with it.</div></div>
<div class="row"><div class="num">2</div><div class="term">What survived</div><div class="desc">Anything already in the page cache [V14].</div></div>
<div class="row"><div class="num">3</div><div class="term">Wrong conclusion</div><div class="desc">"So <span class="neg">flush() was enough</span>." It was enough against this test.</div></div>
</div>

Note:
I have to bound that demonstration immediately, because it is easy to over-read.

Killing a process destroys that process's memory. That is level one. The program gave some bytes to the operating system earlier. Those bytes sit in the page cache. The operating system writes them back in its own time. Your process does not need to exist.

So this proves that level one exists and can lose your data. It proves nothing about levels three and four.

The honest test for the lower levels is a power cut, not a kill. Pull the plug and you find out what the page cache was holding. Nobody is doing that in this room today.

Why so careful? Because students test with a kill, watch the file survive, and conclude that the program flushed everything it needed to. That conclusion holds against a kill. It does not hold against a power failure.

Same demonstration, correct conclusion. The difference is which level you claim it tested.

<h2>The same write, at three levels</h2>
| level | Python | C | buffered? |
|---|---|---|---|
| Application | `f.write(b"x")` [S6] | — | yes [S6] |
| C library | — | `fwrite(...)` [S3] | yes [S3] |
| System call | `os.write(...)` [S20] | `write(...)` [S2] | no |

The bottom row takes a **file descriptor** — the small integer naming an open file. You saw one already: the `= 3` in the trace line was a file descriptor [S1].

<div class="footnotes">
[S1] strace(1) — Linux man-pages. https://man7.org/linux/man-pages/man1/strace.1.html
[S2] write(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/write.2.html

[S20] os — Miscellaneous operating system interfaces, os.write(). https://docs.python.org/3/library/os.html#os.write
</div>

Note:
Read the table by column first, then by row.

The Python column and the C column are two routes to the same bottom row. Python's file objects hold a buffer at level one. C's fwrite fills a buffer at level two. Both call write in the end, and write is the system call.

Now read the last column, because it carries the point. Each level holds a buffer, or it passes the bytes straight down. A Python file object holds one. The os.write function does not, because it wraps the system call directly. In C, fwrite fills a buffer and write does not. The levels are not decoration. They are the mechanism you measured in part one.

The bottom row introduces a term I deferred until now. A file descriptor is the small integer a Linux program uses to name an open file in system calls. You have seen one: the open call returned three. It will appear as the first argument of every write to that file.

Remember the word. In section five it is the first thing that differs.

Three fwrite calls in the source. Fourteen bytes. One write in the trace.

Point at the source. Point at the trace. There is no line-by-line correspondence between them, and there never was. What you write is a library call. What the operating system sees is a system call. Your source did not say how many system calls to make. The buffering policy in the library fixed that number.

The line on the slide is a prediction. I wrote it from the source before I ran anything. Now watch the real trace. Check it against the prediction. If they differ, the prediction was wrong and the machine was not.

<p class="kicker">Part IV</p>

<h2>`fwrite` takes a size and a count</h2>
<p class="lede">Four arguments, and two of them multiply.</p>

```c
fwrite("three\n", 1, 6, f);
/*      data      ^  ^   stream
                  |  +-- number of items
                  +----- size of one item, in bytes  */
```

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">It returns a count</div><div class="desc">Items written, not bytes. The count equals bytes only when the item size is 1 [S21].</div></div>
<div class="row"><div class="num">2</div><div class="term">Fewer is legal</div><div class="desc">Below it, "a successful write() may transfer fewer than count bytes" [S2].</div></div>
</div>

<div class="footnotes">
[S2] write(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/write.2.html
[S21] fread(3), which documents fwrite(3) — Linux man-pages. https://man7.org/linux/man-pages/man3/fwrite.3.html
</div>

Note:
A small thing that trips people. It costs thirty seconds now or twenty minutes in the lab.

The call takes four arguments. A pointer to the data, the size of one item in bytes, the number of items, and the stream. In our program I passed one and six, meaning six items of one byte each. I could have passed six and one and written the same bytes.

Why does it matter? Two reasons.

First, the return value counts items, not bytes. The manual says the count equals the number of bytes only when the item size is one [S21]. If you write six items of one byte and the call returns four, you wrote four bytes. If you write one item of six bytes and it returns zero, you wrote nothing.

Second, fewer is legal. The system call underneath may transfer fewer bytes than you asked for, and the manual says so. The library call has its own version of that: it may report fewer items than you asked for. Two different contracts, one habit. Read the return value.

<div class="kv">

<div class="footnotes">
[S9] winternl.h — Microsoft Learn. https://learn.microsoft.com/en-us/windows/win32/api/winternl/nf-winternl-ntquerysysteminformation
[S22] Windows API index — Microsoft Learn. https://learn.microsoft.com/en-us/windows/win32/apiindex/windows-api-list

Note:
Three words, thirty seconds, and then the Windows trace makes sense.

Win32 is the documented interface a Windows program calls. It is the Windows equivalent of the C library plus the POSIX calls. It is the interface the documentation tells you to use. The name is historical. Microsoft renamed the same thing the Windows API. The new name "more accurately reflects its roots in 16-bit Windows and its support on 64-bit Windows" [S22]. So the 32 in the older name tells you nothing about the width of a program or of a trace. The trace you see next is genuinely a thirty-two bit one, and the two facts are unrelated.

The native API is the layer below Win32. It lives in a library called ntdll, and it is the last user-mode code before the kernel. Microsoft's own documentation calls it internal to the operating system.

The object manager is the kernel component that names open things — files, processes, events. Its paths look different from the paths you type, and one of those paths is on the next slide.

Linux has one. A system call fails and you get a number, and that number is the error. There is nothing to translate, because only one layer names errors.

Look at the path in the Windows trace. It starts with a backslash, two question marks, a backslash. No Win32 program ever types that string. It is the name of the file in the object manager's namespace. That namespace sits below the interface a Windows programmer uses. The tracer is showing you a layer programs do not normally see.

Microsoft says so in its own documentation. The native entry points are internal to the operating system and subject to change between releases of Windows. That is a first-party statement.

On Linux the opposite holds. The system call interface is the public contract. You may write a system call number down and rely on it.

Now the careful sentence, and it is the takeaway. Both systems are stable at the layer they nominate. The disagreement is about which layer gets nominated. Everything else follows from that single placement, including where a tracer can attach.

Note:
I said the placement was a decision. Let me be more careful, because the evidence supports two readings and I would be overstating if I gave you only one [S15] [S19].

Reading A is design. NT had three operating environments: POSIX, OS/2 and Win32 [S19]. Each one served its own clients through its own interface. Each one reached NT through the native API [S19]. The source does not say where those environments ran, so neither do I. On that reading the split is deliberate. An unstable lower layer then follows from it.

Reading B is vestige. A POSIX subsystem did exist. One practitioner account says it was built to satisfy the procurement rules of the United States government. It was never finished. On that reading the split is what remained after the plan was abandoned.

Both accounts are in the literature and I am not going to settle it in a practicum. The mechanism is settled. The intent is not.

Linux is the clearer case. It was a kernel built against a separately developed userland it did not control [V38]. It could not update the C library in lockstep, so it had to make the kernel boundary itself the stable one [V38].

<h2>Linux is the outlier, not Windows</h2>
<p class="lede">The tempting conclusion is backwards, and the evidence is a list of other systems.</p>

"Linux is the only mainstream system that treats the raw syscall interface as a public contract." [V9]

<div class="rows">

<div class="row"><div class="num">3</div><div class="term">So say different</div><div class="desc">Never say worse.</div></div>

Note:
Now the correction to the conclusion you were probably forming.

After the last two slides it is tempting to think Windows is the odd one out. It is not. Look at the list: FreeBSD, OpenBSD, NetBSD, illumos, macOS. None of them publishes a Linux-style promise about the raw system call interface.

They are not equally strict about it, and I should say so. FreeBSD compiles in compatibility layers, so in practice it holds the ABI while declining to promise it formally [V36]. Read the list as "nobody else promises it in the same way", not as "everybody else breaks it".

Linux is the exception. It is the only mainstream system that treats the raw system call interface as a public contract.

In this course you say the platforms are different. You do not say one is worse. If you write that, I will ask which property you are ranking them on.

<p class="kicker">Part VI</p>

<h2>`write()` returned success. The bytes are not on a disk.</h2>
<p class="lede">The whole hour built towards this sentence. I leave it unresolved.</p>

The manual says it plainly: "A successful return from write() does not make any guarantee that data has been committed to disk" [S2].

Saltzer, Reed and Clark gave the general form in 1984. A lower level may offer "an incomplete version of the function… useful as a performance enhancement" [S11].

<span class="neu">So when is it actually safe?</span> That is the durability lecture's question, and this lecture leaves it open.

<div class="footnotes">
[S2] write(2) — Linux man-pages. [S11] End-to-End Arguments in System Design — Saltzer, Reed and Clark (1984). https://web.mit.edu/Saltzer/www/publications/endtoend/endtoend.pdf
</div>

Note:
Read the first quote again. It comes from the manual page for the most basic write call there is. It says a successful return guarantees nothing about a disk [S2].

That should now be obvious rather than alarming, because you have the stack. A successful write means the bytes reached the next level down. Which level depends on which call you made.

The second quote is there so you do not think this is a bug someone will fix. Saltzer, Reed and Clark wrote it in 1984. A lower level may offer an incomplete version of a function as a performance improvement. The complete version needs the application at the end points. Every level in our diagram is an instance of that.

So: when is it actually safe? I am not answering today. I want you to leave with the question open, because a programmer who believes it is already answered writes no durability step at all.

---

<p class="kicker">Part VI</p>

<h2>Buffering moves your errors</h2>
<p class="lede">The error arrives somewhere other than where you caused it.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Why it moves</div><div class="desc">The bytes only reached a buffer.</div></div>
<div class="row"><div class="num">2</div><div class="term">Where it arrives</div><div class="desc">Where the library flushes, so at <code>fclose</code>.</div></div>
<div class="row"><div class="num">3</div><div class="term">The rule</div><div class="desc">Check the return value of the call that flushes.</div></div>
<div class="row"><div class="num">4</div><div class="term">The idiom hides it</div><div class="desc">"the most common durability idiom in every mainstream language… contains no durability step anywhere" [V4].</div></div>
</div>

Note:
Here is the practical consequence, and it will cost you a debugging afternoon at some point.

Your fwrite returned success. It returned success because the bytes reached a buffer. A full disk, an unplugged device, an exceeded quota — none of that is known yet, and none of it can be.

That is why the demo program checks the return value of fclose. Almost none of the C I have read does. That single check is the difference between having written fourteen bytes and believing you did.

The last row is worth saying slowly. The most common way to write a file in every mainstream language contains no durability step anywhere.

Python differs here. A Python with block does raise if the close fails. The two languages differ in what they force you to notice, which is the property I am ranking them on.

This is error reporting, not error recovery. Recovery belongs to the durability lecture.

---

<p class="kicker">Part VI</p>

<h2>Never retry a failed close</h2>
<p class="lede">The obvious repair is wrong. Three storage engines dropped the retry in 2018 [V40].</p>

"Retrying the close() after a failure return is the wrong thing to do, since this may cause a reused file descriptor from another thread to be closed" [S4].

Three databases reached the same conclusion one level down, for `fsync`: PostgreSQL, MySQL's InnoDB and MongoDB's WiredTiger [V40]. WiredTiger wrote the reason into its own source comment: "we don't retry fsync-style calls and panic if a flush operation fails" [V24].

<div class="footnotes">
[S4] close(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/close.2.html
</div>

Note:
Now you check the return value of close. You will want to do the obvious thing with it, and the obvious thing is wrong [S4].

Do not retry. The manual page says why, and the reason is specific. After a failed close the descriptor may already be gone. If another thread has opened a file meanwhile it may have been given that same number. Your retry closes somebody else's file.

Think how strong that is. The three have three different architectures and arrived at the same answer within months [V41]. All three chose to crash the program deliberately when `fsync` fails [V40]. None of them tries again.

The transferable rule: when a failure leaves you unable to tell what state you are in, stop the program and report it. Continuing hides the damage and does not repair it.

<p class="kicker">Part VI</p>

<h2>Networking and IPC are this same mechanism</h2>
<p class="lede">Not new subjects. The same objects and the same calls, wearing different names.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">A socket on Linux</div><div class="desc">It is a file descriptor, and Linux makes that contract binding [V28].</div></div>
<div class="row"><div class="num">2</div><div class="term">A socket on Windows</div><div class="desc">An opaque <code>SOCKET</code>, and Windows makes Winsock the contract [V28].</div></div>
<div class="row"><div class="num">3</div><div class="term">A pipe</div><div class="desc">A file descriptor too, so the same calls reach it [V29].</div></div>
</div>

Depth belongs to the next lecture. The job here is to stop you filing networking under "something else".

Note:
Thirty seconds, and then I stop naming things.

When you meet networking in this course it will not be a new mechanism. On Linux a socket is a file descriptor. The same read and write calls work on it. Sockets, pipes and terminals are all file descriptors, which is why one program can wait on all of them at once [V29].

On Windows a socket is an opaque type rather than a file descriptor. The binding contract is Winsock, the Windows sockets interface, rather than the file-descriptor contract [V28]. That is section five's pattern showing up again in a place you did not expect it [V8]. Same job, different mechanism.

<p class="kicker">Part VI</p>

<h2>Honest limits</h2>
<p class="lede">What today's tools cannot see.</p>

<div class="gaps">
<div class="gap"><div class="dot">•</div><div class="gap-term">The device level</div><div class="ref">[V5]</div><div class="gap-desc">Not observable from software: no trace can check it.</div></div>
<div class="gap"><div class="dot">•</div><div class="gap-term">Asynchronous I/O</div><div class="ref">[V11]</div><div class="gap-desc">The tracer sees the setup, then no I/O.</div></div>
</div>

Note:
Here is what today did not establish.

The device level is not observable from software. I said it in section three and I repeat it here. It is the limit on today's thesis, and it is where data is actually lost.

Asynchronous I/O breaks the model you have just learned, and it breaks it interestingly. A modern Linux interface moves submission into shared memory rings. One option starts a kernel thread. That thread polls the rings. Steady-state submission then makes no system calls at all. The tracer sees the setup and then nothing. The boundary you just learned to watch is already moving.

Note:
Four takeaways went up at the start. Here is what follows from them, which is a different list, and the one I would rather you carried.

First. Ask of every fast call whether it reported acceptance or completion. Success means accepted, not done. That one question covers today's material, and it covers a message broker acknowledging a message for the same structural reason.

Second. No level reports which one holds your data, so you cannot reason your way to it [V16]. You have to make the crossings visible and count them. That is why I spent twenty minutes on a measurement before I drew a single diagram.

Third. When you say the data is written, say which level holds it. Your own buffer, the C library's buffer, the page cache, or the device cache.

Fourth. Measure the machine in front of you. The one constant I could safely have quoted for sixteen years moved by a factor of sixteen in Python 3.14.
