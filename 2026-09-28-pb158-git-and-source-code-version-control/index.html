<p class="kicker">Part I</p>

<h1>What a commit actually is</h1>

<div class="rule"></div>

Four object types, one kind of pointer, and a repository rebuilt by hand.

Note:

<ul>

<p class="kicker">Part I · The object model</p>

<h2>Git is a filesystem with a version-control interface on top</h2>

<p class="lede">Content addressing: store bytes, get back a name derived from those bytes.</p>

Give Git a file. It writes the bytes into `.git/objects/` under a name that is the hash of a short header plus the content. Ask for that name later and the same bytes come back.

Identical content always produces the same name. Two files with the same bytes are stored once, in every repository that holds them.

Note:

<ul>
  <li>Git is a content-addressable filesystem with a version-control interface written on top [V1] [S2].</li>
  <li>An object is written under a name derived from a header plus its content [S1].</li>
  <li>Identical content yields one object, so deduplication is automatic rather than an optimisation [S1].</li>
</ul>

The interface came later.

---

<p class="kicker">Part I · The object model</p>

<h2>Four object types, and nothing else</h2>

| Type | What it holds |
|---|---|
| `blob` | File content. No filename and no path. |
| `tree` | Directory entries. A mode, a type, a name and a hash each. |
| `commit` | One tree hash, zero or more parent hashes, an author and a message. |
| `tag` | A target hash, a tagger and a message. |

A commit hash covers its tree hash and its parent hashes. A tree hash covers the hashes below it. So one commit hash names the whole project state and all history behind it.

Note:

<ul>
  <li>The object universe is four types, and the list is complete [S1].</li>
  <li>A blob holds content and carries no name [S1].</li>
  <li>Because each hash covers the hashes below it, one commit hash names the whole history [S4].</li>
  <li>The same hash-tree structure appears in the container image layers the room has already met.</li>
</ul>

Name the earlier topic.

<p class="kicker">Part I · The object model</p>

<h2>Open <code>.git</code> and look</h2>

<p class="lede">A fresh repository is one line of text, a directory of small files, and an empty object store.</p>

```console
$ git init demo && cd demo
$ ls .git
HEAD  config  description  hooks  info  objects  refs
$ cat .git/HEAD
ref: refs/heads/main
$ find .git/objects -type f
```

`HEAD` names the commit you have checked out. Here it does so indirectly, by naming a branch. `refs` is a directory of small files, and `objects` is empty, because nothing has been stored yet.

Note:

<ul>
  <li>The four entries that matter are <code>HEAD</code>, <code>index</code>, <code>objects</code> and <code>refs</code> [S2].</li>
  <li><code>HEAD</code> holds a symbolic ref, normally the text <code>ref: refs/heads/main</code> [S3].</li>
  <li>The object store starts empty, so every object appearing later was written by a command run in the room.</li>
</ul>

Run this live.

<p class="kicker">Part I · The object model</p>

<h2>A blob is content without a name</h2>

<p class="lede">Two low-level commands write one object and read it back.</p>

```console
$ printf 'test content\n' | git hash-object -w --stdin
d670460b4b4aece5915caf5c68d12f560a9fe3e4
$ find .git/objects -type f
.git/objects/d6/70460b4b4aece5915caf5c68d12f560a9fe3e4
$ git cat-file -t d670460
blob
$ git cat-file -p d670460
test content
```

The first two characters of the hash are the directory. The remaining thirty-eight are the filename. Nowhere in that object is a filename recorded.

Low-level commands like these two are called plumbing. The everyday commands you already type are called porcelain.

Note:

<ul>
  <li><code>hash-object -w</code> writes a blob and prints its name [S1].</li>
  <li>The object path splits the hash into a two-character directory and a thirty-eight-character filename [S1].</li>
  <li>A blob stores content only, so filenames must come from somewhere else [S1].</li>
  <li>The low-level commands are called plumbing, and the user-facing ones are called porcelain [S2].</li>
</ul>

Say plumbing and porcelain once.

<p class="kicker">Part I · The object model</p>

<h2>The index is the third state</h2>

<p class="lede">Between the files on disk and a commit sits one file that maps every tracked path to a hash.</p>

The working tree is the checked-out files you can edit. The index is `.git/index`, a list of paths with the hash of the content staged for each.

`git add` computes a blob and writes the path and hash into the index. Nothing is committed yet.

Note:

<ul>
  <li><code>.git/index</code> is the third state, between working tree and commit [V7].</li>
  <li>The index maps every tracked path to the hash of its staged content [V7].</li>
  <li><code>git add</code> stages an existing file, and it does not create the file [S20].</li>
</ul>

Say it plainly.

---

<p class="kicker">Part I · The object model</p>

<h2>A tree gives content its names</h2>

<p class="lede">Write an entry into the index, then turn the index into a tree object.</p>

```console
$ git update-index --add --cacheinfo 100644 \
    d670460b4b4aece5915caf5c68d12f560a9fe3e4 test.txt
$ git write-tree
80865964295ae2f11d27383e5f9c0b58a8ef21da
$ git cat-file -p 8086596
100644 blob d670460b4b4aece5915caf5c68d12f560a9fe3e4    test.txt
```

`--cacheinfo` writes an index entry directly, from a mode, a hash and a path, with no file on disk. `100644` is the mode: Git records only normal file, executable file and symbolic link, and no owner, group or permission bits.

Note:

<ul>
  <li><code>write-tree</code> turns the current index into a tree object [S1].</li>
  <li>A tree entry is a mode, a type, a filename and a hash [S1].</li>
  <li>The only valid blob modes are <code>100644</code>, <code>100755</code> and <code>120000</code> [S1].</li>
</ul>

Do not skip `update-index`.

---

<p class="kicker">Part I · The object model</p>

<h2>A commit is a tree, its parents and a message</h2>

<p class="lede">One more command wraps the tree. The result is a snapshot with provenance.</p>

```console
$ echo 'First commit' | git commit-tree 8086596
e0437810144e64a708a6441a7094db56fe376eda
$ git cat-file -p e043781
tree 80865964295ae2f11d27383e5f9c0b58a8ef21da
author Student <s@example.org> 1774000000 +0100
First commit
```

A first commit has no parent line. Every later commit records the hash of the commit it was built on. That single link is what makes history a graph.

Your own commit hash will differ. The author name and the timestamp are hashed too.

Note:

<ul>
  <li>A commit holds one tree hash, zero or more parent hashes, identity and a message [S1].</li>
  <li>The parent link is recorded in the child, so history is built backwards [S1].</li>
  <li>A root commit has no parent line at all.</li>
  <li>A commit hashes identity and timestamps, so two people committing one tree get two hashes [S1].</li>
</ul>

Compare the two hashes.

<p class="kicker">Part I · The object model</p>

<h2>A ref is a file with a hash in it</h2>

<p class="lede">Objects are immutable. The only mutable thing in a repository is a pointer.</p>

```console
$ git update-ref refs/heads/main e043781
$ cat .git/refs/heads/main
e0437810144e64a708a6441a7094db56fe376eda
$ cat .git/HEAD
ref: refs/heads/main
```

A branch is that file. Creating one writes forty-one bytes. Deleting one removes a file. Nothing is copied, at any repository size.

Note:

<ul>
  <li>A branch is a file under <code>.git/refs/heads/</code> containing one hash [V3] [S3].</li>
  <li>Refs are mutable and objects are immutable [S17].</li>
  <li><code>HEAD</code> names a branch, so committing rewrites the branch file that <code>HEAD</code> points at [S3].</li>
</ul>

<p class="kicker">Part I · Storage</p>

<h2>Why <code>.git</code> is not enormous</h2>

<p class="lede">Every commit holds the whole project, and the cost tracks only what changed.</p>

A file that did not change hashes to the same blob, so the new tree points at the object that already exists. A directory that did not change also hashes to the same tree. Git therefore shares everything below it instead of copying it.

This is the mechanism behind container image layers. Each party sees what looks like a private copy. Both parties point at one physical original.

Note:

<ul>
  <li>An unchanged file yields an unchanged blob hash, so the new tree points at the existing blob [V5] [S4].</li>
  <li>Storage cost tracks changed content rather than project size per commit [V5].</li>
  <li>The same structural sharing is copy-on-write, reached by content identity rather than page tables [V50].</li>
</ul>

Name the earlier topic again.

<p class="kicker">Part I · Storage</p>

<h2>Snapshots are the model, packfiles are the storage</h2>

<p class="lede">Both halves are true. A delta is a recipe for rebuilding one object from another plus the difference.</p>

<div class="boxes">
<div class="box">
<p class="kicker">The model</p>
A commit names a whole tree. There is no delta anywhere in the object graph.
</div>
<div class="box filled">
<p class="kicker">The storage layer</p>
Git compresses each object on its own as it writes it. Git also packs many objects into one file from time to time. Only inside a packfile does Git store objects as deltas against one another.
</div>
</div>

Note:

<ul>
  <li>Snapshots are the model and deltas are an implementation detail of the storage layer [V6].</li>
  <li>Git packs loose objects periodically, and only packed objects are delta-compressed [S5].</li>
  <li>Students who learned Subversion carry the delta model across, and readers of the packfile format decide the snapshot story was a lie [V6].</li>
</ul>

Say both halves.

---

<p class="kicker">Part I · Storage</p>

<h2>The same two lines can hash to two values</h2>

<p class="lede">Content addressing hashes bytes. Line endings are bytes.</p>

A file saved with carriage-return and line-feed endings is not byte-identical to the same text saved with line-feed endings. The hashes differ.

Git normalises line endings to line feed in the index when a file is checked in. The default on Windows checks files out with carriage returns. So two laptops agree on the hash only when the file reaches the index with the same bytes.

Note:

<ul>
  <li>Line endings are normalised to line feed in the index every time a file is checked in [S13].</li>
  <li>The default for the <code>eol</code> attribute is carriage-return-line-feed on Windows [S13].</li>
  <li>A hash printed on a Windows laptop can therefore differ from the one on the slide.</li>
</ul>

Say this before comparing.

---

<p class="kicker">Part I · Integrity</p>

<h2>The hash detects accidents</h2>

<p class="lede">Tamper-evidence is structural. Adversary resistance is a property of the hash function.</p>

Change one byte below a commit and the commit hash changes. Two people who agree on a hash agree on the whole history behind it. An attack finds a collision: two inputs, one hash.

Git's own breaking-changes document names four attacks on the SHA-1 default. They are the SHAppening in 2015, SHAttered in 2017, a birthday-near-collision in 2019, and Shambles in 2020.

The default moves to SHA-256 for new repositories at version 3.0. News reporting of a maintainer summit gives April 2027 for that release. The project's own document carries no date.

Note:

<ul>
  <li>Everything is checksummed before it is stored and is referred to by that checksum [S4].</li>
  <li>Git's own document names the SHAppening, SHAttered, Birthday-Near-Collision and Shambles as the reason to move to SHA-256 [S15].</li>
  <li>One news report of a maintainer summit dates the release to April 2027, and the project page carries no date [S16].</li>
</ul>

Do not overstate this.

<p class="kicker">Part I · The invariant</p>

<h2>Add objects, or move refs</h2>

<p class="lede">Two operations. Every command in the tool is one of them, or both.</p>

<div class="boxes">
<div class="box">
<p class="kicker">Adds objects</p>
<code>add</code>, <code>commit</code>, <code>fetch</code>, <code>merge</code>. Additive, and safe on shared work.
</div>
<div class="box filled">
<p class="kicker">Moves refs</p>
<code>branch</code>, <code>reset</code>, <code>checkout</code>, <code>push</code>. A ref that moves backwards unnames work.
</div>
</div>

`commit --amend`, `rebase` and `cherry-pick` do both. Cherry-pick copies one commit onto another branch. All three build new objects and move a pointer, and none of them modifies the commit you started from.

Note:

<ul>
  <li>Every command is either add objects or move refs, or both [V2].</li>
  <li>Amend, rebase and cherry-pick build replacement objects rather than editing existing ones [V2].</li>
  <li>Classifying a command this way predicts whether it is safe after publishing.</li>
</ul>

Repeat the invariant here.

<p class="kicker">Part II</p>

<h1>Pointers, the graph, and one remote</h1>

<div class="rule"></div>

Merge, rebase and squash are one function. A remote adds one more namespace of pointers.

Note:

<ul>

<p class="kicker">Part II · Refs</p>

<h2>A branch is a pointer, not a container</h2>

<p class="lede">Nothing is inside a branch. A branch names one commit, and that commit names its parents.</p>

Switching branches rewrites `HEAD` and replaces the files in the working tree. It does not move you into anything.

A branch owns no commits. A commit is reachable from a branch, or it is not. Git computes reachability by walking parent links.

Note:

<ul>
  <li>A branch is a file under <code>.git/refs/heads/</code> containing one hash [V3].</li>
  <li>Learners commonly regard branches as folders in the file system, and might try to move into one with <code>cd</code> [S20].</li>
  <li>Membership is reachability through parent links, not containment.</li>
</ul>

Keep saying reachable.

<p class="kicker">Part II · The graph</p>

<h2>Ancestor, and the merge base</h2>

<p class="lede">Two words carry every rule in this part. Both are defined by walking parent links.</p>

| Word | Definition |
|---|---|
| ancestor | Commit A is an ancestor of B when A is reached by following B's parent links. |
| merge base | A common ancestor of two commits with no better common ancestor below it. |

A merge base is not "where the branches split". The ancestry ordering defines it. Git states plainly that a pair of commits can have more than one.

Note:

<ul>
  <li>The merge base is a best common ancestor under the ancestry ordering [S7].</li>
  <li>Git states that there can be more than one best common ancestor for two commits [S7].</li>
  <li>Teaching the base as the split point cannot predict the plural case.</li>
</ul>

Ancestry arrives before merge.

<p class="kicker">Part II · The graph</p>

<h2>A fast-forward creates nothing</h2>

<p class="lede">When one side is an ancestor of the other there is nothing to reconcile.</p>

If your branch tip is an ancestor of the other branch tip, Git moves your branch file forward to that commit. Git writes no new object and computes no merge.

This is the one integration that adds nothing to history. It is available only when the branch never diverged.

Note:

<ul>
  <li>In a fast-forward <code>HEAD</code> is updated to point at the named commit without creating an extra merge commit [S8].</li>
  <li>Git's glossary defines a fast-forward as a merge with a descendant, which is why the word governs the push rule too [S6].</li>
  <li>A fast-forward is a pure ref move under the Part I invariant [V2].</li>
</ul>

Name it now.

<p class="kicker">Part II · The graph</p>

<h2>Detached HEAD is one file holding a hash</h2>

<p class="lede">It is not a mode, a state machine or an error. It is the contents of <code>.git/HEAD</code>.</p>

```console
$ cat .git/HEAD
ref: refs/heads/main
$ git checkout e043781
You are in 'detached HEAD' state.
$ cat .git/HEAD
e0437810144e64a708a6441a7094db56fe376eda
```

Commit now and Git writes a commit object, but no branch file moves. Switch away and nothing points at that commit any more.

The warning Git prints here is a description of that one file. It is not a diagnosis.

Note:

<ul>
  <li>Detached HEAD is simply <code>HEAD</code> containing a raw hash instead of a symbolic ref [V4].</li>
  <li>Committing in this state writes an object that no ref names.</li>
  <li>The commit is abandoned rather than deleted, and the reflog still records the hash [V9].</li>
  <li>The warning names the contents of <code>.git/HEAD</code>, which the transcript prints on the next line.</li>
</ul>

<p class="kicker">Part II · Merging</p>

<h2>A merge is a function of three trees</h2>

<p class="lede">A base, and two sides. Two versions are not enough to decide what happened.</p>

With only two versions, "this line is in A and not in B" is ambiguous. It could be an addition on one side or a deletion on the other. The base resolves it.

Git compares each side against the base. Where one side changed a region, that side wins. Where both changed the same region, the function has no rule and emits a conflict.

Note:

<ul>
  <li>A three-way merge takes a base and two sides, and the third input is what resolves the ambiguity [S7] [S8].</li>
  <li>A conflict occurs if both sides have changes in a common segment of lines [V12].</li>
  <li>Overlap of changed line ranges, not meaning, is the entire conflict criterion [V12].</li>
</ul>

Draw three inputs once.

<p class="kicker">Part II · Merging</p>

<h2>A conflict is a line-range overlap</h2>

<p class="lede">The criterion is textual. A merge that succeeds is not a merge that is correct.</p>

Two people can edit different lines of the same function and produce a clean merge that does not compile. The comparison is over line ranges, and nothing in it depends on what the lines do.

The reverse also holds. Two people can edit the same line with the same intent, and the function still refuses, because the ranges overlap.

Note:

<ul>
  <li>A conflict occurs if both sides have changes in a common segment of lines [V12].</li>
  <li>Only the heads and the merge base are considered, and the individual commits between them are not [S8].</li>
  <li>A clean merge is therefore a statement about text, not about behaviour.</li>
</ul>

Tests decide, not merges.

<p class="kicker">Part II · Merging</p>

<h2>The base can be plural, and then one side is discarded</h2>

<p class="lede">Two people resolve the same conflict in opposite directions. Now two commits qualify as the base.</p>

Git names this a criss-cross. Both candidates are best common ancestors, and neither is better. `git merge-base` prints one of them and does not say which, while `git merge-base --all` prints both.

Picking either candidate makes the merge succeed cleanly and silently drops the other person's decision. The default merge strategy avoids that: it merges the two candidates into one synthesised base, and uses that as the third input.

Note:

<ul>
  <li>Git states that under criss-cross merges there can be more than one best common ancestor [S7].</li>
  <li>Without <code>--all</code> it is unspecified which best base is output [S7].</li>
  <li>Using either candidate as the base will give an incorrectly clean merge [V13].</li>
  <li>When more than one common ancestor can be used, the default strategy merges the ancestors into one tree and merges against that tree [S8].</li>
</ul>

Read `merge-base --all` aloud.

<h2>Three ways to call the same function</h2>

<p class="lede">The function is fixed. What changes is which inputs it gets and where its result is written.</p>

```bash

git checkout -b claire && printf 'claire\n' >> f.txt && git commit -am claire
git checkout main && printf 'main\n' > g.txt && git add g.txt && git commit -m main

<div class="pair"><div class="k"><code>git rebase main</code></div><div class="v">Replay claire's commits onto main, one by one.</div></div>

  <li><code>--squash</code> produces the merge result without recording the second parent [S8].</li>

<h2>Explain: one function, three placements</h2>

| Operation | What it leaves in the graph | Part I invariant |
|---|---|---|
| Merge commit | Both tips become parents, so ancestry is preserved. | Adds objects |
| Rebase | One new commit per replayed commit, then the branch pointer moves. | Adds and moves |
| Squash | One new commit with one parent. The side branch is not an ancestor. | Adds objects |

All three put the same content on `main`. Git's own merge and rebase manuals describe all three. They differ in what the graph then says about where that content came from.

Note:

<ul>
  <li>All three leave the same file content, and they differ in the object graph they leave behind [V11] [T2].</li>
  <li>Only the merge commit makes the side branch an ancestor of <code>main</code> [S8].</li>
  <li>Ancestry is what the next merge base is computed from [S7].</li>
</ul>

<p class="kicker">Part II · Merging</p>

<h2>Why a squash-merged branch keeps re-conflicting</h2>

<p class="lede">The content arrived. The ancestry did not.</p>

Merge-base discovery walks parent links. A squash commit has one parent, so the side branch's commits are not ancestors of anything on `main`.

Merge the same branch again and the base is computed from a graph in which that work never landed. Git re-offers changes that are already present, and they conflict with themselves.

A branch lands when its content reaches `main`. The fix is one line. Delete the branch once its content has landed. Start the next change from `main`.

Note:

<ul>
  <li>The squash commit has the same tree, but the side branch is not its ancestor and the merge base is still the root [V14].</li>
  <li>The vendor documents the same hazard, warning that later pull requests can include commits already squashed into the base branch [S36].</li>
  <li>Deleting the branch after landing removes the situation rather than repairing it.</li>
</ul>

State the cure too.

<p class="kicker">Part II · Rewriting</p>

<h2>Rebase keeps the tree and replaces the commit</h2>

<p class="lede">A commit hashes its parents as well as its tree. Change the parent and you have a different object.</p>

Replaying a commit onto a new base can produce exactly the same file content. The commit hash is still different, because the parent hash is part of what was hashed.

That is why every hash changes after a rebase. Rebasing work that other people already fetched forces them to reconcile two histories of the same changes.

Note:

<ul>
  <li>A replayed commit can have the same tree and still be a different object, because a commit hashes its parents [V15].</li>
  <li>The rebase manual renames the replayed results in its own diagram, rather than reusing the original names [S9].</li>
  <li>Rebase adds objects and moves a ref, which is safe locally and hazardous after publishing [V2].</li>
</ul>

<p class="kicker">Part II · Rewriting</p>

<h2>Garbage collection deletes what no ref reaches</h2>

<p class="lede">A rewrite abandons objects. Garbage collection is the later pass that removes them.</p>

```console
$ git reflog main
e043781 main@{1}: commit: First commit
9a1c4e0 main@{0}: rebase (finish): refs/heads/main onto origin/main
$ git branch rescue main@{1}
```

The reflog records every position a ref has held in this repository, and `main@{1}` names the position before the last one. Pointing a new branch at an old position makes the abandoned commits reachable again, so collection leaves them alone.

Note:

<ul>
  <li>Rewritten commits are abandoned rather than deleted until garbage collection, and the reflog recovers a lost hash [V9].</li>
  <li>A ref that points at an abandoned commit makes it reachable again.</li>
  <li>The reflog is local, so it does not recover work that was never in this repository.</li>
</ul>

<p class="kicker">Part II · Remotes</p>

<h2>A remote is a name and a refspec</h2>

<p class="lede">Not a connection and not a session. Two lines of configuration that <code>clone</code> writes for you.</p>

```console
$ git config --get remote.origin.url
/tmp/demo.git
$ git config --get remote.origin.fetch
+refs/heads/*:refs/remotes/origin/*
```

The left side of the refspec names refs on the other repository, and the right side names refs in yours. The leading `+` allows the destination to be replaced even when that loses history, which is safe here because nothing of yours lives there. `origin` is simply the name `clone` chooses.

A bare repository is the usual other end. It holds the object store and the refs with no checked-out files.

Note:

<ul>
  <li>The refspec <code>+refs/heads/<em>:refs/remotes/origin/</em></code> fetches every branch on the remote into the remote-tracking hierarchy [S11].</li>
  <li>A bare repository does not have a locally checked-out copy of any of the files under revision control [S6].</li>
  <li>The refspec is a rename rule applied silently on every fetch [S11].</li>
</ul>

<p class="kicker">Part III</p>

<h1>Where centralisation went</h1>

<div class="rule"></div>

Distribution removed a fact from the data model. It did not remove the need for it.

Note:

<ul>
  <li>Part divider. Part III separates what the tool cannot do from what a team's policy does not do.</li>
</ul>

---

<p class="kicker">Part III · Before</p>

<h2>What a central server used to provide</h2>

<p class="lede">One repository, on one server, and committing is the same act as publishing.</p>

In a centralised system such as Subversion there is one repository, on one server. Committing sends the change to that server, so committing and publishing are the same act. Working offline is not possible for anything that needs history.

The server saw every operation, so it could also enforce two things. One was an exclusive lock on a file. The other was a rule about which paths a user may read.

Note:

<ul>
  <li>Committing a change implicitly publishes it, and the distributed tools decouple the two [V22].</li>
  <li>A single authoritative server is a structural fact of the centralised data model [V22].</li>
  <li>Subversion offers access controls down to the level of individual files, and Git does not [V25].</li>
</ul>

Thirty seconds is enough.

---

<p class="kicker">Part III · The relocation</p>

<h2>Distribution removed the fact, not the need</h2>

<p class="lede">Every clone is a complete repository. None of them is authoritative by construction.</p>

Nothing in the object model marks one copy as the real one. Authority becomes a claim that people agree to honour, and the agreement is enforced somewhere outside the data model.

That somewhere is a forge: a hosting service that stores one repository and applies rules to it. Branch protection on a forge is doing the job the central server used to do structurally.

Note:

<ul>
  <li>Git relocated centralisation from the data model into policy, where forges now implement it [V22].</li>
  <li>Branch protection rules define whether collaborators can delete or force-push, and set requirements for any push [S44].</li>
  <li>The dominant practice is a hosted authoritative repository, which is a social convention on a peer-to-peer model [V10].</li>
</ul>

Define forge here.

<p class="kicker">Part III · The residue</p>

<h2>Locking needs a single arbiter</h2>

<p class="lede">A lock is a claim over a resource, and a claim is only meaningful if one party decides it.</p>

Two clones can each record that the lock is held, and nothing in a peer-to-peer model settles which record is right. A peer-to-peer data model therefore cannot provide locking. A team either relies on a social norm, or puts a single server back in the path.

The implication runs one way only. Locking requires centralisation. Centralisation does not require locking, which is why some centralised systems make locks optional.

Note:

<ul>
  <li>Locking requires centralisation, and centralisation does not require locking [V24].</li>
  <li>A lock needs a single arbiter to be meaningful, so distributed systems rely on social norms instead [V24].</li>
  <li>Merge-by-default assumes a useful three-way merge exists for the file type, and locking assumes it does not.</li>
</ul>

The file type decides.

<p class="kicker">Part III · The residue</p>

<h2>Per-path read access has no Git equivalent</h2>

<p class="lede">The unit of transfer is a reachable object graph, so there is no point at which a per-path rule applies.</p>

A centralised server answers each command by consulting a table of paths and users. Git answers a fetch by sending the objects needed to complete a history.

To hide one directory you would have to rewrite the history being served. The workarounds therefore change the unit instead: split the tree into separate repositories, or enforce at the forge.

Note:

<ul>
  <li>Subversion offers access controls down to the level of individual files, and Mercurial and Git do not [V25].</li>
  <li>The workarounds change the unit of transfer rather than adding a rule [V25].</li>
  <li>Forge enforcement covers the shared copy and nothing else [V23].</li>
</ul>

Not an omission.

<p class="kicker">Part III · The limit</p>

<h2>Git does ship enforcement, and it binds one repository</h2>

<p class="lede">"Git has no access control" is too strong. Git ships hooks, and a hook can refuse a push.</p>

Git ships hooks. A receiving repository can run an update hook that refuses any non-fast-forward push, or that consults a table before accepting a ref. Those are core Git, not forge features.

What Git does not do is choose the policy. And a hook binds the repository it lives in. Anyone who clones from you can bypass it entirely, and two peers who exchange commits directly are bound by nothing.

Note:

<ul>
  <li>The update hook can enforce a fast-forward-only policy and can implement access control without filesystem ownership [S14].</li>
  <li>Policy above a peer-to-peer model can approximate a central server for the shared remote, and cannot bind two peers talking directly [V23].</li>
  <li>The defensible claim is that Git supplies the mechanism and sets no policy [T3].</li>
</ul>

The counterexample is stated first.

<p class="kicker">Part IV · The comparison</p>

<h2>Nothing in Git's design was the only option</h2>

<p class="lede">Content addressing already existed, and a rival project began two weeks after Git.</p>

Monotone stored objects by content hash before Git did. Torvalds tried it for a day and gave up on it, because its performance was so bad.

Mercurial's announcement is dated 20 April 2005. It states two aims: to be as simple as possible, and to be as scalable as possible.

So content addressing was not Git's invention. Git's properties are choices, and other projects took several of the alternatives.

Note:

<ul>
  <li>Monotone had interesting ideas and performance so bad that its evaluator abandoned it in a day [S19].</li>
  <li>The Mercurial announcement is dated 20 April 2005 and states the aims of simplicity and scalability [S42].</li>
  <li>Git's rename design was already being defended on its mailing list on 14 April 2005, so the two projects are contemporaries [S18].</li>
  <li>Content addressing predates Git, and a contemporary project made different choices, so these properties are not laws.</li>
</ul>

<p class="kicker">Part IV · The index</p>

<h2>The index has two roles, and only one needs to be visible</h2>

<p class="lede">A cache of filesystem information, and a staging buffer the user operates.</p>

The first role is uncontroversial. It is what makes `git status` fast enough to run constantly.

The second role is a design choice. Git exposes it, and exposes it under three different names across its own documentation: index, cache and staging area.

Note:

<ul>
  <li>The index is a cache of filesystem information and also a user-visible staging buffer [S22].</li>
  <li>Git exposes the index to the user, and Jujutsu names it as a concept it deliberately drops [S22].</li>
  <li>An analysis of Git's concepts finds that the staged and the working versions are not orthogonal [S21].</li>
  <li>The index is the third state between the working tree and a commit [V7].</li>
</ul>

<p class="kicker">Part IV · A system that chose differently</p>

<h2>Keep the object graph, replace the layer above it</h2>

<p class="lede">Jujutsu stores its data in a Git repository and discards Git's user model.</p>

The working copy is itself a commit, snapshotted automatically. Because of that there is no index, and no stash either. A stash is Git's side pocket for unfinished edits, and an ordinary commit already does that job.

Everything the system changes sits strictly above the object graph, and it still interoperates with the same repositories. That is what makes it evidence about Git rather than a rival product.

It is pre-1.0, at release v0.45.1 of September 2026, and the project calls itself experimental. This is not migration advice.

Note:

<ul>
  <li>Everything Jujutsu changes sits above the object graph, which separates what Git is from what Git merely does [V26].</li>
  <li>There is no index, because an automatically committed working copy makes an index-like concept unnecessary [S22].</li>
  <li>The same analysis reads stashing as a patch for flaws in Git's design rather than a requirement of version control [V31].</li>
  <li>As of release v0.45.1 it remains pre-1.0 [V27].</li>
</ul>

Interface replaced, format kept.

---

<p class="kicker">Part IV · A different model</p>

<h2><code>cherry-pick</code> writes a new object with no link to the original</h2>

<p class="lede">Git derives changes by comparing snapshots. A change has no identity of its own.</p>

Copying a commit to another branch builds a new commit object. Its content may be identical and its hash is different, because the parent differs. Nothing records that the two are the same change.

So Git cannot tell you that a fix is already present somewhere else, and a later merge can offer the same change again.

Note:

<ul>
  <li>A replayed or copied commit has a different hash, because a commit hashes its parents as well as its tree [V15].</li>
  <li>Rebase replays commits one by one, and each replay is similar to a cherry-pick [S9].</li>
  <li>Nothing in the object model links a copy to its original.</li>
</ul>

The pairing comes next.

---

<p class="kicker">Part IV · A different model</p>

<h2>Darcs and Pijul make the change the object</h2>

<p class="lede">Store patches with durable identities, and derive the tree by applying a set of them.</p>

Once a change is a first-class object you can ask whether two changes commute. If A then B reaches the same state as B then A, the two are independent.

A change keeps its identity wherever it is applied, so cherry-picking is not a re-creation. A later merge recognises the patch rather than re-offering it.

The model is a real trade. Darcs still records its own exponential merge problem as unfixed, and Pijul has no stable release. No independent benchmark found in this research compares Pijul's merge speed with Git's.

Note:

<ul>
  <li>Darcs and Pijul store the change itself, give it a durable identity, and derive the tree state by applying a set of them [V28].</li>
  <li>A change carries the same identity wherever it is applied, so cherry-picking is not a re-creation [V29].</li>
  <li>Commutation is what lets a merge work by set difference over identities rather than by comparing endpoint trees [V28].</li>
  <li>The Darcs conflict representation can make merges exponential, and its own page records the answer as no, dated 2012-08-02 [V30] [S41].</li>
  <li>No independent benchmark of Pijul's merge performance against Git on a large repository was found for this topic.</li>
</ul>

Define commute out loud.

<p class="kicker">Part IV · Unpaired</p>

<h2>Git stores no fact that one file became another</h2>

<p class="lede">The rename is reconstructed at comparison time, from content similarity alone.</p>

The design position was stated in 2005 and defended since. Git is about tracking data, and not about tracking what happened to create that data.

At comparison time Git scores each deleted path against each created path for content similarity. It merges the pair into a rename when the score passes a threshold. The default threshold is 50 percent.

Note:

<ul>
  <li>Git is about tracking data, not about tracking what happened to create that data [S18].</li>
  <li>Rename detection merges a deleted and a created filepair when the contents are similar enough [S46].</li>
  <li>The algorithm that measures the extent of the changes decides what counts as similar enough [S46].</li>
  <li>The default similarity score is 50 percent, and no object records the result [S46].</li>
</ul>

State the design position first.

---

<p class="kicker">Part IV · Unpaired</p>

<h2>A rename plus a large edit scores below the threshold</h2>

<p class="lede">Put both in one commit and the trail of the file ends there.</p>

```console
$ git mv parser.c lexer.c
$ # ...then rewrite most of lexer.c in the same commit
$ git commit -qam 'rename and rewrite'
$ git log --follow --oneline lexer.c
9f2a1c8 rename and rewrite
```

The similarity score falls below 50 percent. Git reports a delete and an add, so `--follow` has nothing to cross.

The remedy is one commit per action. Commit the rename on its own. Commit the edit afterwards. No alternative system surveyed here removes the underlying cost.

Note:

<ul>
  <li>Rename detection runs while two commits are compared, so a large edit in the same commit defeats it [S46].</li>
  <li>A commit holding only the rename keeps the similarity score high, so <code>--follow</code> crosses it.</li>
  <li>No alternative surveyed for this topic pairs with this limitation, so it is named as unresolved.</li>
</ul>

Show the two-commit remedy.

---

<p class="kicker">Part IV · Scale</p>

<h2>Scale breaks one assumption, not the model</h2>

<p class="lede">A commit is a whole-tree snapshot whether the tree holds fifty files or five million.</p>

What breaks is an assumption layered on top of the model. The assumption is that one client can do three things cheaply:

<ul>
  <li>hold the whole tree</li>
  <li>transfer it on clone</li>
  <li>walk it on every status check</li>
</ul>

The production fixes split into two families. One fetches less, so the repository is genuinely incomplete. The other presents a complete working tree over an incomplete one. It fetches each file on demand.

A partial clone therefore gives up offline operation, because a missing object has to be fetched.

Note:

<ul>
  <li>What breaks at monorepo scale is an assumption layered on top of the model [V32].</li>
  <li>The symptoms do not share one axis, so a single fix does not exist [V32].</li>
  <li>A partial clone defers blobs to a promisor remote, so the client has to be online.</li>
</ul>

The work moved.

<h1>Branching strategy</h1>

<div class="rule"></div>

<p class="kicker">Part V · The variable</p>

<h2>A branching strategy is a contract about branch lifetime</h2>

<p class="lede">Git enforces none of this. A branch can sit unmerged for two years and no command refuses.</p>

In these repositories the single shared branch is called `main`. The literature calls that branch the trunk.

A strategy says which branches exist and who may move them. It says how long a change may stay outside the trunk, and what it must pass on the way back. The team imposes every one of those constraints from outside the tool.

The named models differ mainly in that one variable, and almost every documented cost and benefit follows from it.

Note:

<ul>
  <li>A branching strategy is a social contract expressed in refs [V33].</li>
  <li>Almost every documented cost and benefit follows from that one variable [V34].</li>
  <li>Trunk is the literature's word for the single shared branch, also known as main or master [S26].</li>
</ul>

Name trunk here.

---

<p class="kicker">Part V · The models</p>

<h2>The five models you will meet</h2>

| Model | Long-lived branches | Built for |
|---|---|---|
| Trunk-based | `main` only, plus short release branches | Frequent delivery, high throughput |
| GitHub Flow | `main` only | Web applications that deploy on merge |
| GitLab Flow | `main` plus one branch per environment or version | Explicit promotion gates, several versions |
| Release Flow | `main` plus one branch per release | Several supported versions at large scale |
| Gitflow | `main` and `develop`, plus release and hotfix | Scheduled, explicitly versioned releases |

Read the middle column. The difference between the five is which branches are allowed to live a long time, and that is the whole disagreement.

Note:

<ul>
  <li>Trunk-based development resists any pressure to create other long-lived development branches [S26].</li>
  <li>Gitflow keeps two long-lived lines, <code>main</code> and <code>develop</code>, plus supporting release and hotfix branches [S29].</li>
  <li>Release Flow keeps <code>main</code> as the single integration branch and cuts a release branch per iteration [S35].</li>
  <li>Almost every documented cost and benefit follows from that one variable [V34].</li>
</ul>

Five names, one axis.

---

<p class="kicker">Part V · Mechanics</p>

<h2>Three merge methods, three shapes of history</h2>

| Merge method | What lands on the trunk | Available when |
|---|---|---|
| Fast-forward | The branch commits, unchanged. No new object at all. | The branch never diverged |
| Merge commit | All branch commits, plus one commit with two parents. | Always |
| Squash | One new commit. Intermediate commits do not survive. | Always |

A forge offers these as three buttons, and all three are ordinary Git operations.

Note:

<ul>
  <li>A fast-forward updates <code>HEAD</code> without creating an extra merge commit [S8].</li>
  <li>Squash merging does not preserve intermediate commits as separate commits on the base branch [S36].</li>
  <li>Rebase merging always updates committer information and creates new commit hashes [S36].</li>
</ul>

Tie back to Part II.

<p class="kicker">Part V · The model</p>

<h2>Trunk-based development is a cadence, not a topology</h2>

<p class="lede">The definition is stated in merges per day, not in the shape of the graph.</p>

Each developer divides their work into small batches and merges into the trunk at least once a day, and potentially several times.

trunkbaseddevelopment.com defines it by what it forbids: collaborating in a single branch and resisting pressure to create other long-lived development branches. Short-lived branches for review and build checks are inside the model, not outside it.

Note:

<ul>
  <li>Each developer divides work into small batches and merges into trunk at least once a day [S28].</li>
  <li>The model forbids other long-lived development branches rather than all branches [S26].</li>
  <li>A pull-request branch that lives four hours is trunk-based, and one that lives four weeks is not [V34].</li>
</ul>

<p class="kicker">Part V · Evidence</p>

<h2>Conflicts rise with divergence, and size predicts better than time</h2>

<p class="lede">The largest mining study of merge conflicts, with the effect size that qualifies it.</p>

One study covers 182,273 merge scenarios in 80 projects. The comparison is against the study's own average conflict rate. Branches integrated in under a day produced about 40% fewer conflicts. Branches older than 30 days produced about 161% more.

The same paper reports the effect size for branch duration as small, at minus 0.3 on its own scale. It finds the number of changed files, commits and authors to predict conflicts more strongly. So size is the stronger predictor, and duration is largely standing in for it.

Note:

<ul>
  <li>The study covers 182,273 merge scenarios across 80 projects, with 40% fewer conflicts under a day and 161% more beyond 30 days [S38].</li>
  <li>The same paper reports a small effect size of minus 0.3 for branching duration [S38].</li>
  <li>Size is the stronger predictor and duration is largely a proxy for size [V35].</li>
</ul>

Put both figures up.

<p class="kicker">Part V · Evidence</p>

<h2>The resolutions themselves ship defects</h2>

<p class="lede">A conflict is not merely annoying. The code that comes out of one is measurably worse.</p>

Across 143 open-source projects and 36,122 merge commits, 19.32% produced conflicts that a person had to resolve.

Lines involved in a conflict were about twice as likely to be buggy as lines that were not. Lines involved in a conflict of entangled syntax-tree changes were about 26 times more likely to need a bug-fixing commit than lines from trivial conflicts.

Note:

<ul>
  <li>19.32% of 36,122 merge commits produced conflicts requiring human intervention [S39].</li>
  <li>Conflicted lines were about twice as likely to be buggy [S39].</li>
  <li>Semantically entangled resolutions were about 26 times more likely to need a bug-fixing commit than trivial ones [S39].</li>
</ul>

<h2>The delivery evidence points the same way, and is weaker</h2>

<p class="lede">Two lines of evidence with different weaknesses. One objection does not remove both.</p>

The survey research associates higher delivery performance with teams that keep three or fewer active branches and merge to the trunk at least daily.

It is self-reported and correlational. Nothing in the data establishes that adopting the practice causes the performance rather than accompanying the test automation that makes it survivable.

Note:

<ul>
  <li>The association is with three or fewer active branches and merging to trunk at least daily [S28].</li>
  <li>The methodology relies on self-reported data, which introduces documented biases in accuracy and social desirability [V46].</li>

</ul>

<p class="kicker">Part V · The real dispute</p>

<h2>Nobody defends long-lived feature branches</h2>

<p class="lede">The argument that survives is about release branches, and whether your product needs them.</p>

Vincent Driessen published the best-known model in 2010, and it is usually called Gitflow. He narrowed it himself in 2020. For a team that ships on demand he suggests a much simpler workflow. For software that is explicitly versioned, or that supports multiple versions in the wild, he says his model may still fit.

Microsoft's documented practice does both at once. Short-lived branches come off `main`. The team cuts a release branch for each three-week iteration. That branch never merges back, and fixes reach it by copying a commit forward from `main`.

Note:

<ul>
  <li>Nobody defends long-lived feature branches, and the dispute is entirely about long-lived release branches [V36].</li>
  <li>Driessen suggests a simpler workflow for continuous delivery, and says his model may still fit explicitly versioned software [S29].</li>
  <li>Release branches never merge back, and a fix goes to the trunk first so that it does not recur at the next deployment [S35].</li>
</ul>

Fix trunk, then forward.

<p class="kicker">Part V · The substitution</p>

<h2>Flags replace branches, and the debt is measured</h2>

<p class="lede">Unfinished work has to be isolated somewhere. A branch isolates it in history, a flag isolates it at run time.</p>

An unmerged branch is listed by `git branch` until somebody deals with it. A feature flag is a switch in the code that hides unfinished work from the user. A flag left in place after a release is listed nowhere.

Across 100 projects holding 7,593 flags, half were removed within fifteen months, and a quarter remained for more than eight years. Accumulation is the default path, not an occasional lapse.

Note:

<ul>
  <li>Every unmerged branch announces itself, and a flag that was supposed to be removed does not [V37].</li>
  <li>Half of the flags are removed within 15 months, and 25% remain for a very long time or forever [S40].</li>
  <li>Cheap integration is what makes small changes possible at all, and the setup cost is what moved [V49].</li>
</ul>

  <li>Supporting multiple versions in the wild is what earns a long-lived release branch [S29] [V36].</li>
  <li>Changed files, commits and authors predict conflicts more strongly than branch duration does [S38] [V35].</li>
</ul>

Run it on one project.

<!-- .slide: class="part" data-background-color="#0000dc" -->

<p class="kicker">Part VI</p>

<h1>Pull requests and review</h1>

<div class="rule"></div>

Not Git. A convention roughly eighteen years old, and what the measurements actually say about it.

Note:

<ul>
  <li>Part divider. Part VI is about what people do, and the only Git fact in it is a limitation.</li>
</ul>

---

<p class="kicker">Part VI · Origins</p>

<h2>The name is from 2005, the button is from 2011</h2>

<p class="lede">A pull request was originally a request that somebody else perform a pull.</p>

A maintainer with work ready mailed a message naming a repository and a list of commits, and asked the recipient to fetch it. Git shipped a command to generate exactly that message in July 2005.

In February 2008 GitHub wrapped that message in a web page. Inline comments on the difference arrived in February 2011, three years later. The button that performs the merge arrived in April 2011, two months after that. Until then every pull request was merged by hand.

Note:

<ul>
  <li>A pull request was originally a request that someone perform a pull, which is why the name does not describe what it does today [V39].</li>
  <li><code>git request-pull</code>, the command that generates exactly that message, was written in July 2005 [V60].</li>
  <li>GitHub's February 2008 pull request was essentially a graphical wrapper over that command [V61].</li>
  <li>Inline comments in the diff view arrived in February 2011, and the merge button in April 2011 [V51].</li>
  <li>Before the merge button, every pull request was merged by hand [V52].</li>
  <li>Git ships approval, reviewer and comment thread nowhere, because those are forge inventions [V38].</li>
  <li>The data model was fixed in 2005 and the policy layer accreted between 2008 and 2011.</li>
</ul>

Chronology is the thesis.

---

<p class="kicker">Part VI · Evidence</p>

<h2>What reviewers write about is mostly not defects</h2>

<p class="lede">One study classified 570 comments from 200 review threads at a large software company.</p>

Finding defects was the top-ranked motivation the participants gave. In the classified comments, defect was the fourth most frequent category of nine, at 14%. Code improvements was the most frequent, at 29%.

The study's own summary says review comments about defects are few, at roughly one eighth of the sample. It adds that they mostly address superficial concerns rather than design-level ones.

That does not make review idle. A separate study still estimates up to two and five extra defects after release where review coverage and participation are low.

Note:

<ul>
  <li>Finding defects was the top-ranked motivation the participants gave [S23].</li>
  <li>In the classified comments, defect was the fourth most frequent category of nine, at 14% [S23].</li>
  <li>Code improvements was the most frequent category, at 29% [S23].</li>
  <li>Review comments about defects are few, comprising one-eighth of the total in that sample [S23].</li>
  <li>Those defect comments mostly address superficial concerns rather than conceptual or design-level ones [S23].</li>
  <li>The study observed 17 developers, classified 570 comments and surveyed 873 programmers [S23].</li>
  <li>What the study finds review delivering instead is knowledge transfer, team awareness and shared code ownership [S23].</li>
  <li>Low review coverage and participation are estimated to produce up to two and five additional post-release defects [S24].</li>
</ul>

Outcomes come next.

---

<p class="kicker">Part VI · Evidence</p>

<h2>The outcome evidence cuts the other way</h2>

<p class="lede">Counting what reviewers write is not the same as measuring what review prevents.</p>

The two-and-five estimate came from measuring components rather than comments. It set how much review each component received against how many defects that component showed after release.

So the honest claim is narrower than either headline. Review spreads understanding of the change: afterwards a second person can alter that code without asking the author. It also catches some defects, and only up to a size limit.

Note:

<ul>
  <li>Low review coverage and participation are estimated to produce up to two and five additional post-release defects respectively [S24].</li>
  <li>Review is a bounded-capacity comprehension activity whose dominant output is shared understanding [V40] [T5].</li>
  <li>Its measured defect yield degrades sharply once a change exceeds what one person holds in one sitting [V40].</li>
</ul>

Say the takeaway aloud.

---

<p class="kicker">Part VI · Mechanism</p>

<h2>Review is comprehension, and comprehension is the bottleneck</h2>

<p class="lede">A reviewer does not fail to find a defect through carelessness. Finding one requires understanding the change.</p>

The same study found that code and change understanding is the key aspect of reviewing. It also found that 798 of 873 surveyed programmers confirmed that unfamiliar files take longer.

This is the mechanism underneath every rule about small changes. Small changes are not tidier. They are comprehensible.

Note:

<ul>
  <li>Code and change understanding is the key aspect of code reviewing [S23].</li>
  <li>91% of the surveyed programmers confirmed that unfamiliar files take longer to review [S23].</li>
  <li>Every size rule in this part follows from the comprehension limit rather than from taste.</li>
</ul>

Mechanism before numbers.

---

<p class="kicker">Part VI · Limits</p>

<h2>Two numbers, one source, and they are not in conflict</h2>

<div class="stats">
<div><div class="stat">100–300</div><div class="stat-cap">lines in 30 to 60 minutes, the authors' own advice</div></div>
<div><div class="stat">400</div><div class="stat-cap">lines, the ceiling, because more overwhelms a reviewer</div></div>
</div>

A ten-month study of 2,500 reviews covering 3.2 million lines produced both figures. The first pairs a size with a time. The second is a size limit on its own.

Time carries a separate finding in the same study. Reviewers found defects at a roughly constant rate through the first 60 minutes, after which the rate levelled off. No reviewer found a defect after 90 minutes.

Note:

<ul>
  <li>The advice is to review between 100 and 300 lines at a time and spend 30 to 60 minutes on it [S25].</li>
  <li>Lines under review should be under 200 and not exceed 400, because larger changes overwhelm reviewers [S25].</li>
  <li>The study ran for ten months and covered 2,500 reviews of 3.2 million lines of code [S25].</li>
  <li>Defects appeared at relatively constant rates through the first 60 minutes, after which the rate levelled off [S25].</li>
  <li>In no case is a defect discovered after 90 minutes, which is a finding separate from the line ceiling [S25].</li>
</ul>

One source, two figures.

---

<p class="kicker">Part VI · Queues</p>

<h2>A branch is old because it is waiting</h2>

<p class="lede">Review latency does not merely delay a change. It grows the change it then fails to review.</p>

A change sits waiting for a reviewer. The author has more work that depends on it, so the commits go onto the same branch rather than a new one.

The change that eventually reaches a reviewer is therefore larger than the one that was submitted. Past 400 lines the review measurement found no further defects, so the waiting produces the size that review can no longer absorb.

Note:

<ul>
  <li>What developers usually do is add more commits to the waiting change, which turns it into a giant code change [V41].</li>
  <li>The size ceiling means the enlarged change is past the point where defects are found [S25].</li>
  <li>Branch duration is largely a proxy for size, which connects this directly to the Part V evidence [V35].</li>
</ul>

Parts V and VI meet.

---

<p class="kicker">Part VI · The Git limitation</p>

<h2>Git cannot record that one branch depends on another</h2>

<p class="lede">A commit records its parents. Nothing records its children.</p>

A stack is one change split into a chain of branches, each built on the branch below it. There is no object that says branch B is stacked on branch A. Nothing in the repository records that editing the bottom of a chain invalidates every layer above it.

Every tool that offers stacked review closes that gap the same way: by keeping each branch's intended parent outside the commit graph. Every such tool therefore has a state that can disagree with the repository.

Note:

<ul>
  <li>A commit records its parents and records no child [V8].</li>
  <li>No Git object says that one branch is stacked on another [V42].</li>
  <li>Each stacking tool keeps the dependency outside the graph, so its state can drift [V42].</li>
</ul>

The only Git claim here.

---

<p class="kicker">Part VI · Stacking</p>

<h2>Two operations, under many names</h2>

<div class="kv">
<div class="pair"><div class="k">Retarget</div><div class="v">Point each change's comparison base at the change below it, so its difference shows only its own layer.</div></div>
<div class="pair"><div class="k">Restack</div><div class="v">After any edit to a lower layer, replay every layer above it and move the intermediate branch tips.</div></div>
</div>

Interactive rebase has carried the second operation since Git 2.38, as `git rebase -i --update-refs`. On 30 July 2026 GitHub put stacked pull requests into public preview, which is a trial release rather than the finished feature.

Note:

<ul>
  <li>A stack is a chain of changes, each targeting the branch of the one below it [S37].</li>
  <li>The feature is rolling out in public preview to all repositories rather than generally available [S37].</li>
  <li>Git 2.38 taught <code>git rebase -i</code> to update branches whose tip appears in the rebased range, with <code>--update-refs</code> [S47].</li>
  <li>No source consulted here documents how a stack behaves inside a merge queue.</li>
  <li>Landing part of a stack merges lower layers while the ones above stay open and rebase automatically [S37].</li>
</ul>

State the preview status.

---

<p class="kicker">Part VI · Stacking</p>

<h2>Squash-merging one layer strands the layers above it</h2>

<p class="lede">The Part II squash result, applied to a chain.</p>

Squash the bottom layer and the trunk gains one commit with one parent. The original branch is not an ancestor of it.

The layer above still sits on the old version of the layer below. Its merge base falls back to the root, and it re-presents content that is already integrated.

Note:

<ul>
  <li>The layer above a squash-merged layer finds its merge base back at the root and re-presents integrated content [V43].</li>
  <li>The squash commit carries the same tree, and the side branch is not its ancestor [V14].</li>
  <li>The vendor documents the same hazard for ordinary sequential pull requests [S36].</li>
</ul>

Ask them first.

---

<p class="kicker">Part VI · What changes next</p>

<h2>Review when nobody wrote the code</h2>

<p class="lede">The measured output of review assumes a person wrote the change and a person absorbs the comment.</p>

If a language model produced the change, nobody on the team ever held the reasoning behind it, so there is no understanding to transfer. Catching defects is then the only function review has left, and the measured size and time limits bound that function.

The measurement to watch is where the effort goes. In one 2026 developer survey the work moved from writing code to verifying it, rather than disappearing. That is an open question, not a settled result.

Note:

<ul>
  <li>The work moved from writing to verifying rather than disappearing [V48].</li>
  <li>The knowledge-transfer output assumes a human author and a human reader, and neither premise is guaranteed.</li>
  <li>No source consulted here measures review effectiveness on generated code specifically.</li>
</ul>

Leave it open.

---

<p class="kicker">Part VI · Decision</p>

<h2>One pull request, or a stack?</h2>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Under 300 lines</div>
<div class="desc">One change. A stack costs coordination it does not need.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Separable layers</div>
<div class="desc">Stack it, so each layer is reviewed against the one below.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Landing a stack</div>
<div class="desc">Merge bottom upwards. Squash an intermediate layer and the rest re-conflicts.</div>
</div>
</div>

Note:

<ul>
  <li>The recommendation is 100 to 300 lines at a time, and the ceiling is 400 [S25].</li>
  <li>Landing part of a stack merges lower layers first, and the layers above rebase and retarget [S37].</li>
  <li>Squash-merging an intermediate layer strands the layers above it [V43].</li>
</ul>

Apply it to one change.

<!-- .slide: class="part" data-background-color="#0000dc" -->

<p class="kicker">Part VII</p>

<h1>Integration, delivery, deployment</h1>

<div class="rule"></div>

Three different practices, one abbreviation, and a branching strategy that depends on which one you do.

Note:

<ul>
  <li>Part divider. Part VII closes the loop, because the branching choice in Part V is bought by this practice.</li>
</ul>

---

<p class="kicker">Part VII · Separation</p>

<h2>Three practices wearing one abbreviation</h2>

<div class="kv">
<div class="pair"><div class="k">Continuous integration</div><div class="v">A property of how a team uses version control.</div></div>
<div class="pair"><div class="k">Continuous delivery</div><div class="v">A property of the artefact the pipeline produces.</div></div>
<div class="pair"><div class="k">Continuous deployment</div><div class="v">A policy about what happens to an artefact that passes.</div></div>
</div>

The pipeline is the automated sequence of builds and tests that every change goes through.

Each one requires the one before it. A team can integrate continuously and release twice a year. A team cannot deploy continuously without first being able to deliver continuously.

Note:

<ul>
  <li>Integration is a property of version-control use, delivery a property of the artefact, deployment a policy [V44].</li>
  <li>Continuous deployment requires continuous delivery first [S32].</li>
  <li>The other link in the chain is not stated by any source consulted here, and follows from the definitions.</li>
  <li>The three are routinely collapsed into one abbreviation, which hides the dependency order.</li>
</ul>

Leave three on the board.

---

<p class="kicker">Part VII · Integration</p>

<h2>Continuous integration is a frequency claim</h2>

<p class="lede">It is about how often people merge, not about which server runs the build.</p>

Each member merges their changes into the shared codebase together with their colleagues' changes at least daily. Each of those integrations is verified by an automated build that includes tests.

Two clauses, both routinely dropped. At least daily makes it a claim about cadence. Verified by an automated build including tests makes it a claim about a self-testing build.

Note:

<ul>
  <li>Each member merges into the codebase with colleagues at least daily [S31].</li>
  <li>Each integration is verified by an automated build including tests [S31].</li>
  <li>Running a build server does not establish the practice, because the cadence clause is separate [S31].</li>
</ul>

Say it plainly.

---

<p class="kicker">Part VII · Integration</p>

<h2>Three questions that settle it</h2>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Daily</div>
<div class="desc">Is everyone pushing to the trunk every day, rather than to feature branches?</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Every commit</div>
<div class="desc">Does every commit trigger a run of the unit tests?</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Ten minutes</div>
<div class="desc">When the build breaks, is it typically fixed within ten minutes?</div>
</div>
</div>

The author of the test reports that in his experience fewer than 20% of teams who believe they are doing this can pass it. That figure is one practitioner's recollection, not a measurement.

Note:

<ul>
  <li>The three questions cover daily trunk pushes, unit tests on every commit and a ten-minute fix [S34].</li>
  <li>Less than 20% of teams that think they are doing CI can actually pass the test, in the author's stated experience [S34].</li>
  <li>Using a tool does not mean doing the practice [S34].</li>
</ul>

One anecdote, labelled.

---

<p class="kicker">Part VII · The link back</p>

<h2>The same practice under two names</h2>

<p class="lede">The branching choice in Part V and the integration practice here are one decision.</p>

The author of the canonical definition writes that this practice is called continuous integration, or in some circles trunk-based development.

That is why the preconditions match. Merging daily requires a trunk that stays shippable, which requires automated checks on every commit, which is the healthy-branch rule from Part V.

Note:

<ul>
  <li>The practice is called continuous integration, or in some circles trunk-based development [S31].</li>
  <li>A healthy branch means automated checks on each commit so that there are no defects on the branch [S30].</li>
  <li>Branching strategy therefore functions as a diagnostic for test maturity rather than an independent choice.</li>
</ul>

Answer question one first.

---

<p class="kicker">Part VII · Delivery</p>

<h2>Continuous delivery is a property of the artefact</h2>

<p class="lede">The team builds the software so that it can go to production at any time. Production is the running system users depend on, and nobody has to release to it.</p>

The ThoughtWorks continuous delivery working group reduced it to four observable indicators.

<ul>
  <li>The software is deployable throughout its life.</li>
  <li>The team prioritises keeping it deployable over new features.</li>
  <li>Anyone can get fast automated feedback on production readiness.</li>
  <li>Any version deploys to any environment on demand.</li>
</ul>

The acceptance test is social. A sponsor could ask for the current development version to go to production at a moment's notice, and nobody would panic.

Note:

<ul>
  <li>Continuous delivery means the software can be released to production at any time [S32].</li>
  <li>The four indicators include prioritising deployability over new features [S32].</li>
  <li>The acceptance test is that a deployment request at a moment's notice would not cause alarm [S32].</li>
</ul>

Indicator two is expensive.

---

<p class="kicker">Part VII · Deployment</p>

<h2>Continuous deployment is a policy</h2>

<p class="lede">Every change that passes the pipeline goes to production automatically.</p>

Nothing about the artefact changes. What changes is who decides to release it, and the answer becomes nobody.

That is why it sits last in the dependency order. Releasing an artefact the team does not trust automatically reaches an outage faster than it reaches delivery performance.

Note:

<ul>
  <li>Continuous deployment means every change goes through the pipeline and is automatically put into production [S32].</li>
  <li>It requires continuous delivery first [S32].</li>
  <li>The distinction is the release decision, not the artefact [V44].</li>
</ul>

Ask about their project.

---

<p class="kicker">Part VII · The precondition question</p>

<h2>Feature flags follow from the release policy</h2>

<p class="lede">Two sources disagree about whether flags are required. The disagreement dissolves along the delivery and deployment line.</p>

The goal is to separate the technical decision to deploy from the business decision to launch a feature. Where releasing is automatic, the team must hide unfinished work at run time. That needs a feature flag, or a dark launch, which ships the code with nothing calling it yet.

Where a person still picks the release moment, that person is the gate, and the flag is optional. The author of the pattern says exactly this: flags are only really necessary when practising continuous deployment.

Note:

<ul>
  <li>Flags are needed when the release policy is automatic, and optional when a human still picks the release moment [V45].</li>
  <li>The goal is to separate the technical deployment decision from the business launch decision [S33].</li>
  <li>The author states that a feature flag is only really necessary when practising continuous deployment [S34].</li>
</ul>

Chosen on the release axis.

---

<p class="kicker">Part VII · The measurement</p>

<h2>Deployment frequency stands in for batch size</h2>

<p class="lede">Batch size is how much change ships at once. It cannot be counted directly, so the number of releases stands in for it.</p>

A smaller change fits inside the 400-line review limit from Part VI, and reverting it removes less than reverting a large one. Reducing the cost of a deployment is what makes smaller batches affordable at all.

The proxy is under strain. The 2024 survey report states that it is possible, even likely, that change sizes are growing, and it did not measure change size. Treat the proxy as a proxy.

Note:

<ul>
  <li>Reducing setup and deployment cost enables smaller release batches [V49].</li>
  <li>The report states that it is possible, even likely, that changelists are growing in size [V47].</li>
  <li>The report reasoned from a prior finding rather than measuring change size [V47] [T6].</li>
</ul>

Say the takeaway aloud.

---

<p class="kicker">Part VII · Decision</p>

<h2>Diagnose what a team actually practises</h2>

| What to look at | The question | Which practice |
|---|---|---|
| Merge cadence | Daily to the trunk, or branches that live for weeks? | Integration |
| The artefact | Could any commit that passed the pipeline ship now? | Delivery |
| The trigger | Does passing the pipeline release, or does a person decide? | Deployment |

Fowler's definitions supply all three questions. A team that answers no to the first is not doing any of the three, whatever its pipeline is called.

Note:

<ul>
  <li>The cadence question is the definition of continuous integration [S31].</li>
  <li>The artefact question is the definition of continuous delivery [S32].</li>
  <li>The trigger question separates deployment from delivery [S32].</li>
  <li>A team failing the cadence question is doing none of the three, because each practice builds on the one before.</li>
</ul>

Diagnose one public project.

<p class="kicker">Closing</p>

<h2>What follows from the object graph</h2>

<p class="lede">The thesis, stated again now that every part of it has been shown.</p>

Git gives you a content-addressed object graph and a way to move pointers into it. The object model has been stable since 2005.

Branching strategy, pull requests, code review and delivery practice are policy your team layered on top. They are choices, they are contested, and the evidence for them is weaker than the evidence for the graph. The honest limit: Git does ship hooks, so it supplies the enforcement mechanism and sets no policy.

Note:

<ul>
  <li>A Git repository is objects plus refs, and every command adds objects or moves refs [V2].</li>
  <li>Pull requests, code review and continuous integration are not Git concepts [V10].</li>
  <li>Git ships hooks that can enforce a fast-forward-only policy, so the mechanism is Git and the policy is yours [S14].</li>
</ul>
