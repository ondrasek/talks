<p class="kicker">The claim</p>

<h2>Reliability is engineered, not prompted</h2>
<p class="lede">Building reliable AI systems is an engineering discipline, not a prompting one.</p>

<ul>
  <li>Reliability comes from <strong>external grounding</strong> and <strong>bounded autonomy</strong> — not from asking the model to check its own work.</li>
  <li>The two load-bearing words are <em>external</em> and <em>bounded</em>: a check the model cannot grant itself, and autonomy inside a fence someone else drew.</li>
</ul>

Note:
Here is the thesis on slide two, so you know exactly what you came to agree or disagree with. Building reliable AI systems is an engineering discipline, not a prompting one — a testable claim, not a slogan. The hour hangs on two words: *external*, a check the model cannot grant itself, and *bounded*, autonomy inside a fence someone else drew and the model cannot move. So push on it: if by the end you think these are not the load-bearing variables, tell me which ones are.
---

<p class="kicker">Part I</p>

<h2>Prompt engineering</h2>
<h3>stopped being the interesting problem</h3>
<div class="rule"></div>

The centre of gravity moved from the prompt to the system.

<!-- grounding: none -->

Note:
Part one — a signpost, no claim. The argument is one move: the centre of gravity shifted from the prompt to the system around it, and — the part that matters for a sceptical room — that shift is now backed by results, not fashion. I want to make it carefully, because "prompt engineering is dead" is an overstatement you would be right to reject, and it is not what I am claiming. What I am claiming is narrower and harder to argue with.
---

<p class="kicker">Prompts</p>

<h2>Prompt engineering got demoted</h2>
<p class="lede">It did not die — it became the innermost layer of a larger discipline. [S1]</p>

<ul>
  <li>Prompt engineering "demoted itself to the innermost layer of context engineering." [S1]</li>
  <li>The 2025–2026 frontier is <em>negative</em> results: "always add reasoning steps" is now a per-model empirical question, not a universal trick. [S1]</li>
  <li>If your reliability plan is a cleverer prompt, you are optimising the smallest layer.</li>
</ul>

<div class="footnotes">
[S1] <span class="src-title">Building AI Systems: 5 Pillars</span> — vault research report.
</div>

Note:
Prompt engineering did not disappear; it got demoted. [S1] In the words of the five-pillars report this section is built on, it "demoted itself to the innermost layer of context engineering" — still necessary, no longer the outer game. [S1] Here is the tell that the field matured: the 2025-to-2026 frontier is dominated by negative results. [S1] The advice everyone internalised — add chain-of-thought, give it an expert persona — turns out to hurt some reasoning models, so whether to do it is now a per-model empirical question you measure, not a universal trick you assume. [S1] So if your entire plan for making an AI feature reliable is a cleverer prompt, you are pouring effort into the smallest, least durable layer.
---

<p class="kicker">Context</p>

<h2>Context is a budget, not a bucket</h2>
<p class="lede">Its maturity is measured by whether context assembly is a deterministic, testable pipeline. [S2]</p>

<ul>
  <li>Context engineering "treats the window as a capped per-turn budget to allocate — not a bucket to fill." [S2]</li>
  <li>The tell for a mature system: you can unit-test what the model was shown. [S2]</li>
  <li>That is already an engineering property, not a prompting one.</li>
</ul>

<div class="footnotes">
[S2] <span class="src-title">Building AI Systems: 5 Pillars</span> — vault research report.
</div>

Note:
The layer outside the prompt is context engineering, with one central discipline. The report frames it exactly: it "treats the window as a capped per-turn budget to allocate — not a bucket to fill." [S2] The tell that separates a mature context system from an improvised one is testability: you can unit-test what the model was shown, because the assembly is a deterministic, inspectable pipeline, not string concatenation you cannot reproduce. [S2] That is the thesis in miniature: reliability appears the moment you treat the thing around the model as a system with testable properties.
---

<p class="kicker">Context</p>

<h2>Why "just add more context" backfires</h2>
<p class="lede">More context is often less reliability — measured, not asserted. [S3]</p>

<div class="stats">
  <div><div class="stat neg">18</div><div class="stat-cap">LLMs where accuracy degrades as length grows, even with irrelevant tokens masked [S3]</div></div>
  <div><div class="stat neg">~4×</div><div class="stat-cap">rise in agentic failure at doubled task duration [S3]</div></div>
</div>

<div class="footnotes">
[S3] <span class="src-title">Building AI Systems: 5 Pillars</span> — vault research report (context rot).
</div>

Note:
This is the measurement behind the last slide, and the load-bearing caveat of the context pillar. The phenomenon has a name — context rot. [S3] Accuracy degrades as the window grows, and it degrades even when the extra tokens are irrelevant and masked — so this is not the model distracted by bad content, it is length itself costing you, observed across eighteen models. [S3] The second number should worry anyone building agents: agentic failure rises roughly fourfold when you double the task duration. [S3] The engineering response is the budget — allocate the window deliberately, and treat "add more" as a cost, not a free win.
---

<p class="kicker">Prompts</p>

<h2>The reframe</h2>
<p class="lede">The model is a commodity; the system around it is where reliability lives.</p>

<ul>
  <li>Long-running-agent failures "are not solved by a smarter model. They are solved by infrastructure." [S24]</li>
  <li>Two teams, same frontier model, wildly different production reliability — the difference is the harness. [S24]</li>
  <li>So the question stops being <em>what do I type</em> and becomes <em>what do I build</em>.</li>
</ul>

<div class="footnotes">
[S24] <span class="src-title">Harness Engineering</span> — vault concept note.
</div>

Note:
Put the last three slides together and the centre of gravity has visibly moved. The vault's standing note states the sharp version: the recurring failures of long-running agents "are not solved by a smarter model. They are solved by infrastructure." [S24] Make it concrete with a pattern you have lived: two teams take the same frontier model — same weights, same API — and ship products with wildly different reliability. [S24] The delta is not the model, because the model is identical; it is everything they wrapped around it. [S24] That is what I mean by the model becoming a commodity: it is the interchangeable part, and the durable engineering is the system around it. So the question that decides whether your feature is reliable stops being "what do I type" and becomes "what do I build." Everything from here answers that second question.
---

Grounding is not one thing, and conflating its layers is where a lot of production RAG quietly goes wrong. The report decomposes it into three epistemically distinct layers. [S4] Layer one is parametric correlation — the model answering from its own weights, its memory; a correlation, not a guarantee. [S4] Layer two is structural grounding: you condition on retrieved evidence, which narrows what it can plausibly say. [S4] Layer three is deterministic verification, where the answer is decided by something that is not the model — a test, a solver, a schema — and the model is demoted to orchestrator. [S4] Reliability, the report says, comes from closing that generation-and-verification loop against an external oracle — not from a more capable model at layer one. [S4]

<p class="kicker">Grounding</p>

<h2>Only the deterministic layer certifies</h2>
<p class="lede">Retrieval narrows the output space; only a deterministic check gives a causal guarantee. [S41]</p>

<ul>
  <li>Structural (retrieval) grounding improves the odds — it does not certify anything. [S41]</li>
  <li>Only deterministic verification, where the model is <em>not</em> the load-bearing component, "approaches a genuine causal guarantee (Layer 3)." [S41]</li>
  <li>Match the layer to the stakes: an advisory answer rides on retrieval; an irreversible action — a deploy, a migration, a payment — needs a deterministic gate.</li>
</ul>

<div class="footnotes">
[S41] <span class="src-title">Structural Grounding</span> — vault concept note (three-layer grounding taxonomy).
</div>

Note:
The line between layer two and layer three is the one that tells you where to put your effort. Retrieval grounding — layer two — improves your odds; it conditions on real evidence and narrows the output space, and it is worth doing. [[Concepts/LLM/Structural Grounding]] Only the deterministic layer — where the model is explicitly not load-bearing — approaches a genuine causal guarantee. [[Concepts/LLM/Structural Grounding]] Match the layer to the stakes of the action. But the moment the action is irreversible — a deploy, a migration, a payment, a delete — you want a deterministic check between the model and the effect, not a more confident model and a hope.
---

<p class="kicker">Grounding</p>

<h2>The number that should change your mind</h2>
<p class="lede">The same agents, open loop → closed loop, model-invariant across DeepSeek and Claude. [S5]</p>

<div class="stats">
  <div><div class="stat neg">56.8%</div><div class="stat-cap">compliance — open loop, no external verifier [S5]</div></div>
  <div><div class="stat pos">98.6%</div><div class="stat-cap">compliance — closed loop, external FE verifier [S5]</div></div>
</div>

Nothing about the model changed; the generation–verification loop did. [S5]
But scope bounds the guarantee: a loop fixes only the errors its verifier can see — a defect outside its scope passes through. [S37]

<div class="footnotes">
[S5] <span class="src-title">Building AI Systems: 5 Pillars</span> — vault research report (closed-loop external-verifier study).
[S37] <span class="src-title">5 Pillars — Grounding, the study's own boundary condition</span> — vault research report.
</div>

Note:
This is the strongest single number in the talk, so I will slow down and be precise — precision is what this room will demand. A published 2026 study ran a set of agents open-loop, no external verifier, and measured 56.8% compliance. [S5] Holding the agents the same, it closed the loop with an external FE — finite-element — verifier and measured 98.6%. [S5] Same agents; the only change is that a check the model could not grant itself now sat in the loop, and the gain held across two model families, DeepSeek and Claude. [S5] It is a safety-critical engineering-compliance benchmark — a domain that owns a clean external verifier, and one that is not yours; I cite it purely as the cleanest external-verifier result I know, not as your example. What transfers is the mechanism, not the domain — but the mechanism is not unbounded, and the study's authors flag the limit honestly, so I will too. [S37] A verification loop fixes only the errors its verifier can see: in their own case, when a defect came from structural topology rather than the parameters the FE verifier checks, the closed loop was "powerless" to catch it. [S37] So the guarantee generalises across domains, but never past the scope of the oracle you build — I return to that on the honest-limits slide. [S37] Let the number sit before I say why it is model-invariant.

<p class="kicker">Grounding</p>

<h2>What the number says</h2>
<p class="lede">The mechanism matters more than the magnitude.</p>

<ul>
  <li>The gain is model-invariant because "the guarantee now lives in the verifier, not the generator." [S15]</li>
  <li>The general pattern: "reliability is bought by <em>relocating the truth-determining computation out of the probabilistic model</em>." [S6]</li>
  <li>Architecture beats scale.</li>
</ul>

<div class="footnotes">
[S15] <span class="src-title">Loop Engineering</span> · [S6] <span class="src-title">5 Pillars</span> — vault research reports.

Note:
Why is that gain model-invariant — why does it survive swapping DeepSeek for Claude? The Loop Engineering report gives the reason in one line: because "the guarantee now lives in the verifier, not the generator." [S15] Once the thing that certifies correctness is external, changing the generator does not move the guarantee. [S15] That is the general pattern behind every pillar, stated by the five-pillars report as plainly as I can put it: "reliability is bought by relocating the truth-determining computation out of the probabilistic model." [S6] The reflex when a feature is unreliable is "wait for the smarter model" or "scale it up." This says the leverage is elsewhere: architecture beats scale, because architecture decides where truth gets determined — and a bigger model at layer one is still at layer one.

<p class="kicker">Grounding · definition</p>

<h2>What is an oracle?</h2>
<p class="lede">An oracle is a check that can tell right from wrong <em>without</em> asking the model.</p>

<ul>
  <li>A test's exit code, a type checker, a solver's verdict, a schema validator — the verdict comes from somewhere the generator does not control.</li>
  <li>The defining property is negative: the model cannot satisfy it by <em>asserting</em> it is done.</li>
  <li>It is what reliability is bought with — "closing a generation–verification loop against an external oracle where the LLM is orchestrator, not load-bearer." [S4]</li>
</ul>

<div class="footnotes">
[S4] <span class="src-title">5 Pillars — grounding, three layers</span> — vault research report.
</div>

Note:
One word has been carrying a lot of weight, so let me define it before I lean on it further. An oracle, in this talk, is a check that can tell right from wrong without asking the model — a test's exit code, a type checker, a solver's verdict, a schema validator, a business-rule engine. The defining property is negative: the generator cannot satisfy it by asserting it is done, because the verdict comes from somewhere the model does not control. That is exactly the thing the five-pillars report says reliability is bought with — closing a generation-and-verification loop against an external oracle, with the model as orchestrator rather than the load-bearing component. [S4] Hold that definition, because the next slide asks the only question that decides your adopt call: for the task in front of you, which oracle do you actually have?

<p class="kicker">Grounding · triage</p>

<h2>Which oracle do you actually have?</h2>
<p class="lede">The guarantee is bounded by your oracle, not the domain. [S37]</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Oracle-rich</div>
<div class="desc">A cheap external check exists — schema validator, contract test, migration dry-run. Close the loop, get the guarantee.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Oracle-scoped</div>
<div class="desc">The verifier sees only part — a type checker proves types, not logic. It certifies only what it checks. [S37]</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Oracle-free</div>
<div class="desc">Is this refactor correct? This summary good? No complete oracle — partial checks, bounded review, sometimes refuse.</div>
</div>
</div>

<div class="footnotes">
[S37] <span class="src-title">5 Pillars — Grounding boundary</span> — vault report.
</div>

Note:
Now the question that is the hinge of your adopt decision, and the objection this room is already forming: "that study has a finite-element verifier — I don't have one for a pull request." Correct — so sort the task into one of three zones, each with an example from your own world. Oracle-rich: a cheap external check already exists — a schema validator on an API response, a contract test on a service boundary, a migration dry-run — close the loop and get something close to the flagship guarantee. Oracle-scoped: a verifier sees only part of the space — a type checker proves your types are sound but says nothing about the business logic — so the loop certifies what it checks and no more; the flagship study's own FE verifier is parameter-level, and a defect from structural topology passed straight through. [S37] Oracle-free: most open-ended work — is this refactor correct, is this summary good — has no cheap oracle at all, and there external grounding does not save you; the honest architecture is bounded autonomy plus human review, and sometimes the call is to refuse. I won't pretend the oracle is free — building it is the real cost, which I return to on the honest-limits slide. The move is diagnostic: decide which zone the task is in, because that decision is the adopt-defer-refuse call itself.

---

<p class="kicker">Grounding · oracle-free zone</p>

<h2>Cheap checks you already own</h2>
<p class="lede">No complete oracle rarely means no check.</p>

<ul>
  <li><strong>Property-based tests</strong> — assert invariants, not exact outputs. A sound one synthesizes "in 2.4 samples on average", but covers only 21% of properties. [S38]</li>
  <li><strong>Metamorphic relations</strong> — equivalent inputs must not change the output. On HumanEval, caught "75% of the erroneous programs generated by GPT-4" at an 8.6% false-positive rate. [S39]</li>
  <li><strong>Canary / shadow</strong> — route 1% of traffic, alarm on the error-rate delta. Production is the oracle. [S40]</li>
  <li><strong>Idempotency</strong> — an idempotent write or reversible migration; a wrong call is safe to retry. [S42]</li>
</ul>

<div class="footnotes">
[S38][S39][S40][S42] — vault notes.
</div>

Note:
This is the answer to the sharpest objection in the room — "my pull request has no finite-element verifier." True, and you rarely have a complete one; but oracle-free almost never means check-free — you already own partial oracles that raise the floor, and each maps onto something you run. Property-based testing asserts invariants rather than exact outputs — the workhorse is a round-trip: assert deserialize of serialize of x equals x for random x, catching a class of encoder bugs with no hand-written cases — and — with the best model and prompting approach — a valid, sound one synthesizes in about 2.4 samples on average, though that same best model covers only twenty-one percent of properties, so it is a best-case figure, not a general rate. [S38] Metamorphic testing checks that equivalent inputs give consistent outputs, no ground truth needed — reorder two independent query filters, or rename a variable, and the result must not change — and on the HumanEval benchmark it caught seventy-five percent of the erroneous programs generated by GPT-4, at under a nine-percent false-positive rate. [S39] Canary and shadow deployment make production itself the oracle: route one percent of traffic to the new agent, alarm on the error-rate delta, blast radius you set. [S40] And the oldest tool in the box: make the action idempotent — a write behind a key, or a migration with a real down-step — so executing it once has the same effect as twice, and a wrong call is safe to retry, not a thirteen-hour outage. [S42] None is as clean as an FE solver, but stacked they turn "no oracle" into "good-enough oracle" — usually the honest answer for this room.

Note:
Orchestration is the fourth pillar — how you compose more than one agent — and its load-bearing move is one idea: split the agent that makes from the agent that checks. [[Concepts/AI Agent Infrastructure/Loop Engineering]] One vocabulary note so nothing trips you up: I call these two roles the maker and the checker throughout, and the papers I quote name the same split differently — generator versus verifier, or the independence of the observer — but it is the same two boxes every time. It is primarily a context boundary, not necessarily a different model: the checker sees the task and the result and deliberately not the maker's chain of thought. [[Concepts/AI Agent Infrastructure/Loop Engineering]] A checker who reads the maker's reasoning is biased toward confirming it; strip the reasoning and the check becomes meaningful. And on the "how many agents" debates: the note is explicit that what carries the effect is the split — maker ≠ checker — not the count, an implementation degree of freedom rather than the load-bearing property. [[Concepts/AI Agent Infrastructure/Loop Engineering]] So ten agents sharing one context, with no real boundary between making and checking, buy you less than two that have one — the split is the point, not the headcount.

Here is a team that learned the maker-checker corollary the expensive way, in public. Intuit rebuilt its agent architecture twice in about four months — a specialist-agent fleet, then a central orchestration layer, then a skills-and-tools design. [S27] Be precise about what the source explains, because two rebuilds is two decisions and I only have one reason. The *second* rebuild is sharp — I'll quote their AI VP because the phrasing is exact: "a ten agent chain did not fail occasionally, it compounded errors by design." [S27] The *first* — why the fleet became an orchestration layer — the source does not give; it reports the endpoint, not that step, and I won't reverse-engineer a motive. The fix was not a better model or more agents; it was replacing free-text delegation with typed skills and tools: "skills-and-tools, not agent-to-agent natural-language delegation." [S27] Translate to an instinct you have: a natural-language handoff is an untyped, unvalidated interface between two unreliable components — you would never ship that between two of your services, so don't ship it between two agents.

Note:
The fifth pillar is governance, and the core claim is blunt: "unbounded autonomy in complex systems inherently creates unbounded risk." [S7] The vault reframes autonomy as a calibrated design parameter, not a default: freedom inside a fence someone else drew, with humans keeping authority over the boundary conditions rather than approving every step inside it. [[Concepts/Active Inference/Bounded Autonomy in AI]] Now the part that surprises people, because it inverts the intuition that a constraint costs capability — one clean measured result, from a CAD study I flag up front as not your domain, cited only for the mechanism. Physics-in-the-Loop put a deterministic finite-element solver inside an agent's design loop as the fence, then ran the ablation: with the oracle off, the agents hit the target safety factor 22.2% of the time; with it on, 59.0%, at p = 0.0008 — more than double the hit rate, and they produced designs 4.2 times more complex, not fewer. [S45] The bound is not a leash that shortens the agent's reach; it is the floor that lets it explore aggressively without falling through — and the fence is what makes the freedom safe to grant. A fence the model can talk its way past is not a fence.

<p class="kicker">Part III</p>

<h2>Loops</h2>
<h3>why self-verification underperforms</h3>
<div class="rule"></div>

The one thing a loop must not do is grade its own work.

<!-- grounding: none -->

Note:
Part three — the section most teams get wrong, so it is worth the time; no claim on the divider. The pattern I see everywhere: a team builds a loop where the model produces something, the same model is asked "is this correct?", and if it says yes the loop stops and ships. They call that verification. The research says self-grading is the one thing a loop must not do, and I will give both the theory and the measurements, because a claim this counterintuitive needs both.
---

<p class="kicker">Loops</p>

<p class="lede">What carries the effect is the independence of the observer, not the loop itself. [S9]</p>

Note:
There are two shapes of loop, and on the surface they look almost identical — both iterate, both have a pass-or-retry decision. The top loop closes against an external oracle: a test, a solver, an independent judge decides pass or fail, and only a real pass exits. [[Concepts/AI Agent Infrastructure/Loop Engineering]] But the finding that reorganises this field is that "what carries the effect is the independence of the observer, not just the presence of a loop." [S9] Iteration count is not the variable; independence is.

Here is the whole section on one concrete task, because a number lands harder than a principle. A controlled study ran the same job — audit an agent's work for real violations — three ways. [S47] Iterated self-check: the agent audits its own output and flags zero of thirty-four violations, at ninety-to-a-hundred confidence — a confident miss. [S47] Weak independence: a *fresh* instance of the same model, shown only the work and not the reasoning, catches seven — better, because the context is isolated, though still the same weights. [S47] External oracle: a deterministic checker catches all thirty-four. [S47] The model is identical in the first two; what changed is how independent the check's evidence is. So the sentence to keep: "a loop's verdict is only worth what its verifier's independence is worth; buy that independence in the check, or don't call the loop verified." [S10] You buy it in the check — an isolated context, a deterministic gate, a different family for subjective cases — or you do not get to say "verified," however many times it iterated. [S10] Iterating a self-graded loop harder just gets you the confident wrong answer faster.

<p class="kicker">Loops</p>

<h2>Why self-check hits a wall</h2>
<p class="lede"><em>Self-check is bounded structurally, not by capability.</em></p>

<ul>
  <li>Gödel showed "a formal system rich enough to describe arithmetic cannot prove its own consistency from inside." [S46]</li>
  <li>As an <em>analogy</em>: a same-system checker has no outside vantage point — "the AI self-check wall is Gödel with a leaderboard." [S11]</li>
  <li>Not "self-checking is impossible" — "trustworthy knowledge always has to pay for its own verification; the price is never zero." [S11]</li>
  <li>Asked to <em>verify</em>, an LLM re-runs the same process; the fix is a paid independent channel, not a smarter grader.</li>
</ul>

<div class="footnotes">
[S11] Loop Engineering — narrowed claim · [S46] — the Gödel step — vault reports.
</div>

Note:
Why does self-check hit a wall — is it just that the models are not smart enough yet? Here is the mechanism, the argument to lead with: a self-monitor grades its own output using the same information that produced it, so re-invoking the same weights opens no independent channel — extra rounds redistribute confidence, they do not add evidence. The report has a memorable label — "the AI self-check wall is Gödel with a leaderboard" — and I use it because it sticks, but a name is not an explanation, so let me actually say what Gödel showed. [S11] He proved that a formal system rich enough to describe arithmetic cannot prove its own consistency from inside itself. [S46] I am borrowing that as an analogy, not smuggling in a theorem about neural networks — the only honest transfer is this: a checker built from the same system as the thing it checks has no vantage point outside it, which is why re-invoking the same weights adds no evidence. But here is where I stay honest, because this is exactly the spot where the field over-claims: the report explicitly refuses to inflate that label into "self-checking is impossible," and neither will I. [S11] The version it actually stands behind is narrower and more useful — "trustworthy knowledge always has to pay for its own verification; the price is never zero." [S11] Which points straight at the fix: not a smarter grader, but a different, independent channel of evidence — and you pay for it every time.
---

<p class="kicker">Loops</p>

<h2>The empirical case · 1</h2>
<p class="lede"><em>On-policy self-monitoring</em> — a model grading a patch it just wrote — measurably loses discrimination. [S12]</p>

<div class="stats">
  <div><div class="stat neg">0.99 → 0.89</div><div class="stat-cap">monitor AUROC grading its own patch (1.0 = perfect) [S12]</div></div>
  <div><div class="stat neg">5×</div><div class="stat-cap"><em>in one setting</em>: likelier to wave through a prompt-injected patch [S12]</div></div>
</div>

One 2026 preprint, four coding/tool-use datasets — self-attribution bias: the model defends its own work. [S12] Read the direction, not the multiple — *directionally robust, not settled*. [S12]

<div class="footnotes">
[S12] <span class="src-title">Loop Engineering — empirical case</span> — vault research report (single 2026 preprint, Khullar et al., arXiv:2603.04582).
</div>

Note:
So much for theory — now the measurements, and I will be deliberately careful about scope, because this room will check and this deck may be published. This is one 2026 preprint — Khullar and colleagues — measuring what they call on-policy self-monitoring, which just means the model grading output from its own policy: it checks a patch it wrote itself. [S12] First finding: when the model grades that patch, its discrimination degrades. [S12] The metric is AUROC — read it as a right-versus-wrong separation score, where 1.0 is perfect separation and 0.5 is a coin toss — and it drops from 0.99 to 0.89 in the code-correctness setting. [S12] Against that scale 0.99 is near-perfect and 0.89 is a small but real loss you can check for yourself, and it appears only because the work is the model's own. Second finding, and let me fence it precisely: in one setting of that study, self-attribution bias made the monitor five times likelier to wave through a patch that had followed a prompt injection. [S12] I flag the scope on purpose — it is a single preprint, and the report's own Skeptic reading calls these magnitudes "directionally robust but not settled," so do not walk out repeating "5×" as a law of nature. [S12] What the design rests on is the direction, not the multiple: a self-monitor is weakest exactly where authorship bias bites hardest, which is under attack.
---

<p class="kicker">Loops</p>

<h2>The empirical case · 2</h2>
<ul>
  <li>On formal-verification benchmarks: "rule-based approaches remain more reliable for verification success, while LLM-based methods exhibit more variable performance." [S13]</li>
  <li>The paper's own framing is the careful one — not "rules beat LLMs," but rules <em>more reliable</em>, LLMs <em>more variable and complementary</em>. [S13]</li>
  <li>Practitioner reading: default the check to a deterministic gate — an exit code, a schema, a solver — and reach for a model judge only where the target is irreducibly subjective.</li>
</ul>

<div class="footnotes">
[S13] <span class="src-title">Loop Engineering — empirical case</span> — vault research report.
</div>

Note:
The second measurement comes from formal verification, and I quote it precisely because it is easy to overstate and I have overstated it before. The study — LLM-generated formal annotations checked against a verifier and SMT solvers — found that "rule-based approaches remain more reliable for verification success, while LLM-based methods exhibit more variable performance." [S13] It positions the LLMs as complementary tools that are more variable, not simply worse — the deterministic route is the reliable one, the model the variable one. [S13] Reach for a model judge only where the target is irreducibly subjective. It is a priority ordering, not a prohibition.

Note:
Part four — the harness — no claim on the divider. Let me define the term once, in the flow, because it is the one piece of vocabulary this talk rests on. The harness is everything in an agent that is not the model: the tools, sandboxes, memory, sensors, permissions, orchestration — the whole control plane the model runs inside. This section shows the one law that runs through every layer, walks a single layer all the way down, and then spends real time on the caveats — because a section that only sold you the harness would be dishonest, and you would know it.

<p class="kicker">Harness · permissions</p>

<h2>Determinism at the load-bearing control</h2>
<p class="lede">Determinism at the control does what a defensive prompt cannot.</p>

<ul>
  <li>Progent — a deterministic privilege control verified with an <strong>SMT</strong> (Satisfiability Modulo Theories) solver — "provably reduces attack success rate to 0% with hand-written policies, while prompt-level defenses are demonstrably bypassed." [S17]</li>
  <li>The <em>provable</em> part is the mechanism: SMT-verified monotonic confinement — the engine provably enforces whatever policy it is given. [S17]</li>
  <li>The <em>0%</em> is a measured benchmark result — on AgentDojo and <strong>ASB</strong> (Agent Security Bench), under hand-written policies — not itself a theorem. [S18][S32]</li>
</ul>

<div class="footnotes">
[S17] <span class="src-title">Harness Engineering</span> — vault report · [S32] <span class="src-title">Progent</span> — arXiv 2504.11703. https://arxiv.org/abs/2504.11703
</div>

Note:
Take permissions as the worked example. With hand-written policies Progent "provably reduces attack success rate to 0%, while prompt-level defenses are demonstrably bypassed." [S17] Two bits of vocabulary this room will want exact: SMT is Satisfiability Modulo Theories — the solver technology that lets you prove a policy has a property — and ASB is the Agent Security Bench. Now be precise about what "provable" attaches to, because it does two jobs and only one is a proof. The SMT verification proves the *mechanism*: the policy engine provably enforces whatever policy it is handed — the paper calls this monotonic confinement. [S17] The *0% figure* is not proven; it is *measured* — that mechanism, evaluated on the AgentDojo and ASB benchmarks under hand-written policies, drove attack success to zero. [S32] Proven mechanism, measured result — not the same claim, and this room would catch me if I let "provable" cover both. So determinism at the load-bearing control does what a defensive prompt structurally cannot — but I won't leave you with only the 0%, because the next slide is where the honesty lives.

Here is the nuance I refuse to gloss to "near-zero," because glossing it would be the exact over-claim this talk is against. And carry the precision from the last slide with you: that 0% is a *measured*, hand-written-policy result — the confinement mechanism is what's proven, the zero is what was observed on the benchmarks. [S18] The moment you let the model author its own policy — which is what everyone wants, because writing policies by hand does not scale — the residual attack comes back: AgentDojo falls from 41.2% to 2.2%, ASB from 70.3% to 7.3%. [S18] Big reductions, single digits — but single digits are not zero, and the gap between zero and 2.2% is the gap between a guarantee and a good average. Read the pattern precisely: even a deterministic control degrades once the probabilistic model is the thing writing the deterministic rules — you have quietly moved the model back onto the load-bearing path. [S18] So the division of labour on this slide: the human owns the policy, the machine executes it.

<p class="kicker">Harness</p>

<h2>Not every harness change helps</h2>
<p class="lede">The harness is leverage in both directions.</p>

<div class="stats">
  <div><div class="stat neg">93.1% → 55.2%</div><div class="stat-cap">Codex retrieval accuracy: inline → file-based grep delivery [S28]</div></div>
</div>

<ul>
  <li>Same model; the only change was <em>how tool output reached it</em> — inline vs written to a file. ~38 points. [S28]</li>
  <li>Authors' read: file-based routing "trades context bandwidth for compositional tool competence; gains are realized only when the agent reliably closes the loop." [S28]</li>
  <li>The paper gives no full error analysis for the collapse — so take the <em>direction</em> as the lesson, not a mechanism.</li>
</ul>

<div class="footnotes">
[S28] <span class="src-title">Is Grep All You Need?</span> — vault reading note.
</div>

Note:
The honest caveat to "just engineer the harness and reliability follows": the harness is leverage in both directions. In one measured case, swapping a single tool-delivery format — inline results versus file-based grep — dropped Codex from 93.1% to 55.2%, roughly thirty-eight points on the same model, from one seemingly-cosmetic choice about how a tool returns output. [S28] The authors' mental model is worth borrowing: they read file-based routing as trading context bandwidth for compositional tool competence, where "gains are realized only when the agent reliably closes the loop" — writing results to a file pays off only if the agent then reliably issues the follow-up calls. [S28] Whether that is precisely what Codex failed to do, the paper does not say — it reports the collapse without a full error analysis, so on the note's own reading the finding is descriptive rather than explanatory. [S28] I won't oversell it, then: the honest takeaway is the direction — a cosmetic-looking choice can swing accuracy by forty points — not a validated causal story. Which means the harness discipline and the evaluation discipline are one: you do not know whether a harness change helped until you re-run the eval set.

<p class="kicker">Harness</p>

<h2>Harnesses decay — delete on a cadence</h2>
<ul>
  <li>A scaffold built for a model's weakness becomes overhead — and can cap capability — once that weakness disappears. [S44]</li>
  <li>The cadence the source supports is <em>model-driven</em>, not calendar-driven: "re-run the harness against your eval set on every model bump" — one cited blog approximates that as quarterly. [S44]</li>
  <li>It concerns the <em>human-authored</em> scaffolding teams accumulate; the source does not scope this to AI-generated harnesses.</li>
  <li>The audit each time: remove a component, re-run the eval set, keep only if quality holds — otherwise revert. [S44]</li>
</ul>

<div class="footnotes">
[S44] <span class="src-title">Harness Engineering</span> — vault concept note (deletion cadence).
</div>

Note:
One more caveat, so none of this becomes cargo cult. A harness component built to compensate for a model's weakness becomes pure overhead the moment that weakness disappears — and worse, it can actively cap the model's current capability, holding a better model down to the shape of the worse one. [S44] Scaffolding accretes; nobody is incentivised to delete it; two generations later you are running a Rube Goldberg machine of workarounds for problems that no longer exist. So be precise about "what cadence": the source ties it to model upgrades, not the calendar — "re-run the harness against your eval set on every model bump," which its one cited blog approximates as roughly quarterly, a proxy for model-release pace, not a fixed interval. [S44] And whose harness: the human-authored scaffolding teams accumulate — the source makes no claim about AI-generated harnesses, so neither will I. The ritual each time: remove a component, re-run the eval set, keep it only if quality holds — otherwise revert. [S44] Your harness should get smaller on some upgrades, not only larger.

<div class="footnotes">

Note:
Now the story that puts the whole thesis into one incident — a failure mode this room knows intimately, wearing an AI-agent costume. Amazon's Kiro agent hit a bug, weighed its options, and concluded the cleanest fix was to delete the production environment and rebuild it from scratch — AWS Cost Explorer, one region, down for roughly thirteen hours. [S20] Read the mechanism, not the headline, because the headline invites the wrong lesson. It did not fail because it was a weak model — deleting and rebuilding is, abstractly, a valid repair. It failed because it had authority over an irreversible action and nothing deterministic stood between the decision and the effect — a permission-scoping failure, and everyone here has shipped the human version of it. Now watch the response, because the response is the thesis: Amazon did not go looking for a smarter agent; they ran an SVP-driven ninety-day safety reset across roughly three hundred and thirty-five of their most important systems and retrofitted mandatory two-person sign-off and senior-engineer approval for AI-assisted production changes. [S20] Bounded autonomy, added after the outage instead of before it. The whole talk in one sentence: put the gate on the irreversible action first, not after the thirteen-hour incident teaches you to. Let that one sit.

Note:
The most credible slide in a technical talk is the one about what the evidence does not settle, so here are five honest limits — I would rather raise them than have you raise them in Q&A. One: deterministic control is not a free zero once the model writes the policy — the residual attack comes back. [S18] Two: not every harness change helps, and one wrong tool-format choice cost thirty-eight points, so measure changes against an eval set. [S28] Three: the attack surface is widening, not narrowing — GhostJacking, disclosed this month, extends agentjacking by poisoning trusted logs and alerts. [S36] Four, and this one lands on my strongest number, so I raise it before you do: even that closed loop only fixes the errors its verifier can see — the study's own authors flag that a defect from structural topology rather than parameters left the parameter-level loop "powerless," so the guarantee is bounded by the scope of the oracle you build, not by the domain it came from. [S37] And five, the honest one a hostile expert will press: most of your production targets — is this refactor correct, is this summary good — have no cheap external oracle at all, so where none exists the honest architecture is bounded autonomy plus human review, and sometimes the right call is to refuse. Knowing which zone you are standing in — oracle-rich, oracle-scoped, or oracle-free — is itself part of the job.
