<p class="kicker">Part I · The gap</p>

<h2>You can define a system call. You have not seen one.</h2>

<div class="boxes">
<div class="box">

<div class="footnotes">

That combination is strange. You can define the thing and you have never watched it happen. This is the normal output of a computer science curriculum. The reason is historical. It goes back to a licence change in nineteen seventy nine. [S5]

<p class="kicker">Part I · History</p>

<h2>Operating systems went back to theory in 1979</h2>

<p class="lede">In 1977 John Lions wrote a line-by-line commentary on the UNIX version 6 kernel. Hundreds of universities taught from it. [S5]</p>

The 1979 AT&T release changed the licence and forbade teaching the source. Courses <span class="neg">went back to theory-only mode</span> or moved to toy simulators. [S5]

<p class="closing">The teaching stayed theoretical [S5]. This course puts you in front of a tracer, attached to a running program.</p>

<div class="footnotes">
[S5] <span class="src-title">Lessons Learned from 30 Years of MINIX</span> — Tanenbaum, CACM (2016). https://www.cs.vu.nl/~ast/Publications/Papers/cacm-2016.pdf
</div>

Note:
Andrew Tanenbaum tells this story in his retrospective on MINIX. John Lions wrote a commentary on the sixth edition UNIX kernel in nineteen seventy seven, and it became the textbook of hundreds of universities. Then the nineteen seventy nine release shipped with a licence that forbade writing about the source or teaching it.

Tanenbaum writes that operating systems courses went back to theory-only mode, or had to use toy simulators. He wrote MINIX to fix exactly that. Now, the interesting part is what happened next. The teaching stayed theoretical. [S5]

This course puts you in front of a tracer, attached to a running program. Topic three is where you meet the tools themselves, and what they cost. You have the theory already. What you do not have is the habit of looking.

<p class="kicker">Part I · Thesis</p>

<h2>Looking and reciting are different skills</h2>

<div class="kv">
<div class="pair">
<div class="k">
Reciting
</div>
<div class="v">
You answer a question somebody already wrote down. A monitoring dashboard does this: "it answers questions you already knew to ask" [V2]
</div>
</div>
<div class="pair">
<div class="k">
Looking
</div>
<div class="v">
You ask a question nobody wrote down in advance, and the running system answers it. The field calls this observability: "the ability to investigate a system by asking any question about its behavior without needing to predict those questions in advance" [V1]
</div>
</div>
</div>

<p class="closing">This course grades the second one [T1]. You can already recite more than you can predict.</p>

Note:
Here is the thesis of the course, in technical terms rather than as a slogan. The two words for this already exist. The first is monitoring. Monitoring answers questions somebody already knew to ask. Somebody chose the metric, set the threshold, wrote the alert.

A written theory test is monitoring. The second word is observability. The standard definition is the ability to investigate a system by asking any question about its behaviour, without needing to predict those questions in advance. That is what this course grades. The slide claims you can recite more than you can predict. [V1] [V2]

The next thirty seconds test that claim. Nobody has to answer aloud.

<p class="kicker">Part I · Test it</p>

<h2>Thirty seconds, silently, to yourself</h2>

<p class="lede">In your head, say the steps between a Python <code>f.write()</code> returning and the bytes being on the disk.</p>

Rozenblit and Keil measured what happens next. People rate their own understanding <span class="neg">lower after they try to explain</span> the thing than before. [S1]

<p class="closing">If your explanation had a gap, that gap is the course. This course does not grade this test, and nobody has to say it aloud.</p>

<div class="footnotes">
[S1] <span class="src-title">The misunderstood limits of folk science: an illusion of explanatory depth</span> — Rozenblit and Keil, Cognitive Science 26 (2002). cogdevlab.yale.edu
</div>

Note:
Take thirty seconds. Do not say anything aloud. In your own head, state the steps between a Python write call returning and your bytes reaching the disk. Name each layer. Wait thirty seconds in silence.

If you got two steps and stopped, that result has a name and a measurement. Rozenblit and Keil called it the illusion of explanatory depth. They asked people to rate their understanding, then to explain the thing, then to rate themselves again. The second rating was consistently lower. [S1]

The effect is strongest for explanations and weakest for plain facts. That is the shape of a theory-only education. Trying to explain reveals the gap. Hearing about it does not. [S1]

<p class="kicker">Part I · Practicum</p>

<h2>What a practicum asks of you</h2>

<p class="lede">A lecture course asks you to reproduce an explanation. A practicum asks you to produce an observation and defend it.</p>

Crouch and Mazur measured the difference in a physics classroom. Students who only watched a demonstration gained little understanding of the concept it showed. Students who <span class="pos">predicted the outcome first</span> understood that concept measurably better. [S2]

<p class="closing">So I will not prove the thesis in this lecture. The next lecture opens with a three-line program whose output disappears.</p>

<div class="footnotes">
[S2] <span class="src-title">Classroom demonstrations: learning tools or entertainment?</span> — Crouch, Fagen, Callan and Mazur, Am. J. Phys. 72 (2004). https://works.swarthmore.edu/fac-physics/203/
</div>

Note:
A practicum is not a lecture course with exercises attached. The difference is what it asks you to produce. A lecture course asks you to reproduce somebody else's explanation. A practicum asks you to produce an observation and then defend it.

Crouch, Fagen, Callan and Mazur measured this in a physics classroom. Passive watching produced very little understanding of the concept demonstrated. Predicting the outcome first produced a measurable gain in that understanding. Predict, then look. That is the method. [S2]

This lecture asserts the thesis of this course and proves nothing. That is deliberate. The next lecture opens with three lines of Python whose output vanishes. The proof arrives there.

<p class="kicker">Part II · The idea</p>

<h2>One idea carries all eight topics</h2>

<p class="lede">Every operating-system interface keeps its promise only under conditions nobody wrote down.</p>

<div class="kv">
<div class="pair">
<div class="k">
The contract
</div>
<div class="v">
The written half says what the call does. The scope clause says when it does that. [V4]
</div>
</div>
<div class="pair">
<div class="k">
The method
</div>
<div class="v">
You cannot deduce which layer departs from its documentation. Record the boundary crossings. Then count them. [V5]
</div>
</div>
</div>

<p class="closing">A leak is your program leaving the scope, not the abstraction failing [V4]. A library's documentation is a claim. The system call it issues is a fact [V21]. Trust the trace when they disagree.</p>

<div class="footnotes">
[V4] [V5] <span class="src-title">Where the Abstraction Leaks</span> · [V21] <span class="src-title">AI Agents as Debugging Operators</span>
</div>

Note:
Here is the idea. Every abstraction the operating system gives you is a contract with a silent scope clause. The contract is written down. Open a file, write bytes, close it. You have read that part.

The scope clause is the part nobody writes down. It says under which conditions the contract holds. Step outside those conditions and you get a leak. The leak is not a bug. It is your program leaving the scope. [V4]

And here is why this course is built on tools. You cannot deduce which layer departs from its documentation. You have to make the boundary crossings visible and count them. [V5]

One sentence states the rule for the whole term. A library's documentation is a claim. The system call it issues is a fact. [V21] When the two disagree, trust the trace, and read the documentation as the wrong one.

<p class="kicker">Part II · Topic 1</p>

<h2>Topic 1 — I/O: files and the network</h2>

<div class="kv">
<div class="pair">
<div class="k">
What it covers

<div class="v">
One file write and one network request.
</div>
</div>
<div class="pair">
<div class="k">
The general rule
</div>
<div class="v">
Nearly every fast call returns before the work happens: "Almost every fast OS interface returns when the kernel has taken responsibility for the work, not when the work has happened." [V6]
</div>
</div>
<div class="pair">
<div class="k">
The divergence
</div>
<div class="v">

</div>
</div>

<p class="closing">The course starts here. Following one write down makes a tracer necessary [T2].</p>

<div class="footnotes">
[V6] <span class="src-title">Where the Abstraction Leaks</span>
[V7] <span class="src-title">Sockets and Network I/O</span>
</div>

Note:
Topic one is input and output, files and the network together. Everyone here has written a file, so the topic is already familiar. Here is the rule you meet. Almost every fast operating system interface returns when the kernel takes responsibility for the work. It does not return when the work happens. [V6]

Those are different moments. The gap between them is where the interesting failures live. Files and sockets share a slide because read and write operate on both. The platforms disagree sharply here. On Linux a socket is a file descriptor. On Windows, in Microsoft's own words, it is not. [V7]

Why start here? Following one write call down is what forces the boundary into view, and what makes a tracer necessary rather than decorative. The order rests on that argument alone.

<p class="kicker">Part II · Topic 2</p>

<h2>Topic 2 — The system call boundary</h2>

<div class="kv">
<div class="pair">
<div class="k">
What it covers
</div>
<div class="v">
Where your program stops and the operating system begins.
</div>
</div>
<div class="pair">
<div class="k">
The divergence
</div>
<div class="v">
Linux publishes the system call interface. Windows publishes Win32 and reserves the layer below it. [V8]
</div>
</div>
<div class="pair">
<div class="k">
The correction
</div>
<div class="v">
Neither platform is less stable than the other. Each names a different layer as its contract: "Both are stable at the layer they nominate. The disagreement is about which layer is nominated" [V8]
</div>
</div>
</div>

<p class="closing">You will be able to name where the boundary sits on each platform, and say why they chose differently.</p>

<div class="footnotes">
[V8] <span class="src-title">Windows and Linux place the stable syscall boundary at different layers</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic two takes what topic one showed you in one case and makes it general. Where does your program stop and the operating system begin? Linux publishes the system call interface itself as the stable contract. You may issue a system call directly and the kernel promises it will keep working.

Windows does not do that. Windows publishes Win32 as the contract and treats the layer below as an implementation detail it reserves the right to change. Now, the easy mistake here is to read that as Linux doing it right.

Neither platform is less stable than the other. Each one names a different layer as the thing it promises to keep. The disagreement is about which layer gets nominated, and each choice buys something and costs something. The course works through both. [V8]

<p class="kicker">Part II · Topic 3</p>

<h2>Topic 3 — Observing a running system</h2>

<div class="kv">
<div class="pair">
<div class="k">
What it covers
</div>
<div class="v">
<code>strace</code> on Linux, NtTrace on Windows, and how to read what they print.
</div>
</div>
<div class="pair">
<div class="k">
The honest limit
</div>
<div class="v">
A tracer adds code, so it changes the timing it reports: "A tracer is not a window onto a running program. It is an edit to that program." [V22]
</div>
</div>
<div class="pair">
<div class="k">
The precedent
</div>
<div class="v">
A published graduate course "teaches kernel behaviour through DTrace and hardware performance counters" [V9] [S3]
</div>
</div>
</div>

<p class="closing">You will be able to state a tracer's cost and its blind spot.</p>

<div class="footnotes">
[S3] <span class="src-title">Teaching OS with FreeBSD</span> — Neville-Neil and colleagues (2017). https://www.usenix.org/system/files/login/articles/login_spring17_03_neville-neil.pdf · [V22] [V25] <span class="src-title">Tracing cost and blind spot</span>
</div>

Note:
Topic three is the tools. On Linux that is strace. On Windows it is NtTrace, which attaches at a different boundary for the reason given a moment ago. The limit matters most here. A tracer is not a window onto a running program. It is an edit to that program. [V22]

Three consequences follow:

<ul>
  <li>The tracer changes the timing it reports.</li>
  <li>The tracer costs real performance. [V22]</li>
  <li>Every tracing mechanism has a blind spot. [V25]</li>
</ul>

A tracer at the system call boundary sees only the work that crosses that boundary. Linux has an interface called `io_uring` that passes requests through shared memory instead, and `strace` never sees those. [V25]

You must leave this course able to run your platform's tracer, and able to state its blind spot. With only the first, the course has taught a command rather than a skill. The design follows a published precedent. Neville-Neil and colleagues published a graduate course taught this way. [V9] [S3]

<p class="kicker">Part II · Topic 4</p>

<h2>Topic 4 — Virtual memory and the page cache</h2>

<div class="kv">
<div class="pair">
<div class="k">
What it covers
</div>
<div class="v">
Where the bytes you wrote went, and why freed memory is still held.
</div>
</div>
<div class="pair">
<div class="k">
The mechanism
</div>
<div class="v">
An allocation gives you address space, not memory: "A mapping can exist with no physical page behind it. The page is materialized on first touch, by a fault." [V17]
</div>
</div>
<div class="pair">
<div class="k">
The consequence
</div>
<div class="v">
One process yields several memory figures, each measuring a different thing. "How much memory does this process use" turns out to be a badly posed question [V17]
</div>
</div>
</div>

<p class="closing">You will be able to read a memory figure and say which question it answers.</p>

<div class="footnotes">
[V17] <span class="src-title">Virtual Memory and the Page Cache</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic four. You allocate memory and you think you now have memory. You do not. You have address space. A mapping can exist with no physical page behind it, and the page arrives on first touch, by a fault. [V17]

A page fault is not an error. It is the normal mechanism by which memory starts existing. Once you know that, several confusing things stop being confusing. Why a program that re-reads the same file is faster on its second run. Why your process monitor disagrees with your program.

Why free memory is mostly a bookkeeping category. The skill from this topic is reading a memory number and knowing which question it answers. [V17]

<p class="kicker">Part II · Topic 5</p>

<h2>Topic 5 — Protection, shared memory and IPC</h2>

<div class="kv">
<div class="pair">
<div class="k">
What it covers
</div>
<div class="v">
How one address space is isolated, and every way you deliberately cross that line.
</div>
</div>
<div class="pair">
<div class="k">
The mechanism
</div>
<div class="v">
The hardware checks every memory access before it completes: "Every load, store, and instruction fetch a process performs is checked before it completes." [V18].
</div>
</div>
<div class="pair">
<div class="k">
Where it is checked
</div>
<div class="v">
In the memory management unit, against the permission bits the kernel wrote. [V18]
</div>
</div>
</div>

<p class="closing">You will be able to say why a segmentation fault is the protection working rather than failing.</p>

<div class="footnotes">
[V18] <span class="src-title">Memory Protection</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic five. The hardware checks every memory access before it completes. Every load, every store and every instruction fetch your process performs is checked. The compiler plays no part in it. The language runtime plays no part in it. The kernel code plays no part in it. [V18]

The memory management unit does it, on every access, against the permission bits the kernel wrote. That is why isolation is cheap enough to be unconditional. It also reframes something you all saw before. A segmentation fault is the protection working, and telling you so. [V18]

The second half of the topic covers the deliberate crossing. Shared memory, pipes, message queues and signals. Isolation is the default, and IPC is how you open one door in it.

<p class="kicker">Part II · Topic 6</p>

<h2>Topic 6 — Processes, threads and scheduling</h2>

<div class="kv">
<div class="pair">
<div class="k">
What it covers
</div>
<div class="v">
What the operating system schedules, and how a runtime redefines your thread.
</div>
</div>
<div class="pair">
<div class="k">
The finding
</div>
<div class="v">
A runtime creates and switches its units inside the process, so nothing crosses the boundary: "A userspace-scheduled unit of concurrency produces no system call when it is created and no system call when it yields" [V19].
</div>
</div>
<div class="pair">
<div class="k">
Why that matters
</div>
<div class="v">
The trace of a concurrent program can be empty: "a syscall tracer shows nothing at all where the student expects to see concurrency" [V19]
</div>
</div>
</div>

<p class="closing">Here the absence is the finding. You will read an empty trace as evidence.</p>

<div class="footnotes">
[V19] <span class="src-title">Processes, Threads and Scheduling</span> — author's working notes.
</div>

Note:
Topic six contains a result that looks like a broken tool. You write a program using Python's async tasks, or goroutines, or green threads. You attach a tracer, expecting concurrency. You see nothing.

The runtime creates each unit inside your process, and switches between them inside your process. Both events stay on your side of the boundary, so the tracer has nothing to report. The trace looks like a serial program. [V19]

Students meet this and assume the tool is broken. It is not. The absence is the finding. It tells you the language runtime takes scheduling away from the kernel. Your thread is not what the operating system calls a task. Reading an absence as evidence is a genuinely hard skill, and this is where the course teaches it.

<h2>Topic 7 — Post-mortem analysis, with and without an agent</h2>

<div class="kv">
<div class="pair">
<div class="k">

<div class="v">

</div>

</div>

<p class="closing">You will be able to say which half of a session a model can take.</p>

<div class="footnotes">
[V20] <span class="src-title">Crash Dump Analysis</span> · [V26] [V27] <span class="src-title">AI Agents as Debugging Operators</span>
</div>

Note:
Topic seven is failure analysis, in two halves. The first is the crash dump. Every tool in topics one to six needs the process to be alive when you look. Post-mortem work begins where that stops being true. Tracing shows you a running system. A dump is all you get once it is dead. [V20]

It is a photograph, not a recording, and you reason backward from it. The second half is what an agent changes. That effect is tool-specific. Reading a forty thousand line trace is breadth-shaped work, and a model is good at it. [V26]

Reasoning about one optimised-away local is depth-shaped, and a model is unremarkable. Knowing which is which is the skill. An agent reads the evidence a tool already produced. It acquires none of its own. [V27] [V21]

<p class="kicker">Part III · Shape</p>

<h2>The homework is a loop, not a test</h2>

<p class="lede">Resubmit as often as you like until the deadline. A fail costs time and nothing else.</p>

<div class="kv">
<div class="pair">
<div class="k">
What the checker returns
</div>
<div class="v">
Defects, not remedies. It names what is wrong, never the fix.
</div>
</div>
<div class="pair">
<div class="k">
Why not remedies
</div>
<div class="v">
A critic is normally told to "suggest concrete revisions" [V15]. We drop that half on purpose.
</div>
</div>
</div>

<p class="closing">Push your failures. A passing commit is by construction the one with nothing left that the checker can catch.</p>

<div class="footnotes">
[V15] <span class="src-title">Generative Actor Critic</span> — author's notes.
</div>

Note:
Now the shape of the homework, because it changes how you should work. You may resubmit as often as you like until the deadline. A fail before the deadline costs time and nothing else. So this is not a test with retries. It is a loop.

The loop has four steps. You submit. Something tells you what is wrong. You fix it. You submit again.

One deliberate choice inside it. The checker returns defects, never remedies. It will say your program loses its output when the output is redirected. It will not say change line forty two. In the engineering version of this pattern the critic does both. [V15] This course drops the second half, because a checker that hands you the fix does the assignment for you.

And one consequence. A team that iterates to green has, by the deadline, removed every defect the checker tests for. So the teaching material is the sequence of attempts, not the pass.

Note:

<p class="kicker">Part III · Failure</p>

<h2>How this arrangement fails</h2>

<div class="kv">
<div class="pair">
<div class="k">
Vigilance decays
</div>
<div class="v">
Mackworth's watchers hunted rare double jumps in a pointer stepping once a second, for two hours [V24]. Detection fell from about 85% to about 75% in 30 minutes. [V11]
</div>
</div>
<div class="pair">
<div class="k">
Review becomes ritual
</div>
<div class="v">
A reviewer who must gate everything clicks through: "a rubber stamp with an audit trail" [V12]
</div>
</div>
<div class="pair">
<div class="k">
A critic invents faults
</div>
<div class="v">
Where models started at ≥75% task accuracy, "The critic, primed to find errors, invented them." [V14]
</div>
</div>
</div>

<p class="closing">So tell us when a result is wrong. "the human's job is to adjudicate a raised alarm" [V13]</p>

<div class="footnotes">
[V11] [V12] [V13] [V24] <span class="src-title">Human on the Loop</span> · [V14] <span class="src-title">Generative Actor Critic</span>
</div>

Note:
This is the first system the course asks you to look at rather than trust, and it is the one grading you. So here is how it fails. Bainbridge named the general problem in nineteen eighty three. The better the automation, the worse the monitor's job becomes. [S8]

Mackworth measured it. His observers watched a pointer step once a second for two hours, and had to catch its rare double jumps. Detection fell from about eighty five percent to about seventy five within thirty minutes. [V24] [V11]

Second. Make a human sign off everything and you train them to click through. That is a rubber stamp with an audit trail. [V12] Third, and this one bites good work. On the tasks where the models started at seventy five percent accuracy or better, a critic primed to find errors invented them. [V14]

The repair is structural. Report a wrong result to the course staff. A human adjudicates a raised alarm far better than they spot one. [V13]

<p class="kicker">Part III · Honesty</p>

<h2>What this course is betting</h2>

<p class="lede">The bet: unlimited retries, held by two counterweights — a checker naming defects, and an unaided exam core. Three published results argue against it.</p>

<div class="kv">
<div class="pair">
<div class="k">
Trial and error [S6]
</div>
<div class="v">
Repeated submission instead of improving the program. Limits and regression penalties cut its rate by up to 85%. PB158 imposes neither.
</div>
</div>
<div class="pair">
<div class="k">
Rapid feedback [S18]
</div>
<div class="v">
Some students aim at the tests, not at improving the program.
</div>
</div>
<div class="pair">
<div class="k">
Guidance [S22]
</div>
<div class="v">
A learner with low prior knowledge learns less under minimal than under strong guidance.
</div>
</div>
</div>

<p class="closing">Edwards' counterweight was student-written tests [S17]. Ours are the two above.</p>

<div class="footnotes">
[S6] Lawrence · [S18] Luxton-Reilly · [S22] Kirschner · [S17] Edwards
</div>

Note:
Here is the bet, and it invites attack. The course keeps unlimited retries. Two counterweights carry the risk. The first is a checker that names defects and never remedies. The second is an exam core that every one of you sits unaided.

Now the evidence against it. Lawrence and colleagues measured trial and error, which is repeated submission instead of improving the program. Submission limits and regression penalties cut its rate by up to eighty five percent. Students also prefer the limits. [S6] This course imposes neither.

Luxton-Reilly and colleagues name the behaviour. With rapid feedback, some students aim at passing the test cases rather than improving the program. [S18] Kirschner, Sweller and Clark compared minimal guidance with strong guidance. Under minimal guidance a learner with low prior knowledge learns less of the material than under strong guidance. [S22]

Their finding is about learners with low prior knowledge of the material in hand. Nobody here used a tracer before. Reading their finding as this course's starting point is an interpretation, not their claim. Edwards built unlimited submission in two thousand three with a counterweight of his own. He assessed a student's program only by the tests the student had written. [S17]

The course keeps the unlimited half and substitutes the two counterweights above. If the bet is wrong, it is wrong here.

Note:
The two takeaways again, and then two things that follow from them. First, this course grades looking rather than reciting. It never grades recall. The exam core measures what you can do unaided, and the homework is a loop you iterate against.

Second, the course works downward, from the code you write to the operating system under it. That is why topic one is a single file write rather than a chapter on kernel architecture.

Then submit the attempt you are unsure about. Your failed attempts are what the review lectures are made of, and a repository of clean passing commits teaches nothing.

And check the grading arrangement. It has named failure modes, and part three showed three of them. Raising one is your job as much as the staff's. [V11] [V12] [V13] That is the orientation. Short break, then the actual subject, with three lines of Python whose output vanishes.
