<p class="kicker">Part I · The gap</p>

<h2>You can define a system call. You have not seen one.</h2>
<div class="boxes">
<div class="box"><div class="box-head">What you have</div>You can write Python. You can write C. You can define a process, a system call and virtual memory.</div>

<div class="footnotes">

Note:
Let me describe the room as I understand it. You write Python and you write C. You have had operating systems as theory. You can define a system call, a process, virtual memory, a page. None of you has ever attached a debugger or a tracer to a running program. That is a strange combination if you think about it. You can define the thing and you have never watched it happen. I want to be clear that this is not a criticism, and it is not an accident either. It is the normal output of a computer science curriculum. The reason is historical. It goes back to a licence change in nineteen seventy nine. [S5]

<p class="kicker">Part I · History</p>

<h2>Operating systems went back to theory in 1979</h2>
<p class="lede">In 1977 John Lions wrote a line-by-line commentary on the UNIX version 6 kernel. Hundreds of universities taught from it. [S5]</p>

The 1979 AT&amp;T release changed the licence and forbade teaching the source. Courses <span class="neg">went back to theory-only mode</span> or moved to toy simulators. [S5]

<p class="closing">The teaching stayed theoretical [S5]. A disabled DTrace probe costs nothing, which is "what made DTrace safe to ship enabled on production systems" [V23]. You will attach one to a running program.</p>

<div class="footnotes">
[S5] <span class="src-title">Lessons Learned from 30 Years of MINIX</span> — Tanenbaum, CACM (2016). https://www.cs.vu.nl/~ast/Publications/Papers/cacm-2016.pdf · [V23] <span class="src-title">Observing a Running System</span>
</div>

Note:
Andrew Tanenbaum tells this story in his retrospective on MINIX. John Lions wrote a commentary on the sixth edition UNIX kernel in nineteen seventy seven, and it became the textbook of hundreds of universities. Then the nineteen seventy nine release shipped with a licence that forbade writing about the source or teaching it. Tanenbaum writes that operating systems courses went back to theory-only mode, or had to use toy simulators. He wrote MINIX to fix exactly that. Now, the interesting part is what happened next. The teaching stayed theoretical. DTrace patches the running system only when you enable a probe. A disabled probe costs nothing. That is what made DTrace safe to ship enabled on production machines. DTrace is one example, and topic three gives the cost of the others. This course puts you in front of a tracer of that kind, attached to a running program. You have the theory already. What you do not have is the habit of looking. [S5] [V23]

<p class="kicker">Part I · Thesis</p>

<h2>Looking and reciting are different skills</h2>
<div class="kv">
<div class="pair"><div class="k">Reciting</div><div class="v">You answer a question somebody already wrote down. A monitoring dashboard does this: "it answers questions you already knew to ask" [V2]</div></div>
<div class="pair"><div class="k">Looking</div><div class="v">You ask a question nobody wrote down in advance, and the running system answers it. The field calls this observability: "the ability to investigate a system by asking any question about its behavior without needing to predict those questions in advance" [V1]</div></div>
</div>

<p class="closing">This course grades the second one. You can already recite more than you can predict.</p>

Note:
Here is the thesis of the course. I want to give you the technical version rather than a slogan. The two words for this already exist. The first is monitoring. Monitoring answers questions somebody already knew to ask. Somebody chose the metric, set the threshold, wrote the alert. A written theory test is monitoring. The second word is observability. The standard definition is the ability to investigate a system by asking any question about its behaviour, without needing to predict those questions in advance. That is what this course grades. And I claim you can recite more than you can predict. Here is a thirty second exercise to test that claim. Nobody has to answer aloud. [V1] [V2]

---

<p class="kicker">Part I · Test it</p>

<h2>Thirty seconds, silently, to yourself</h2>
<p class="lede">In your head, say the steps between a Python `f.write()` returning and the bytes being on the disk.</p>

Rozenblit and Keil measured what happens next. People rate their own understanding <span class="neg">lower after they try to explain</span> the thing than before. [S1]

<p class="closing">If your explanation had a gap, that gap is the course. Nobody is graded on this, and nobody has to say it aloud.</p>

<div class="footnotes">
[S1] <span class="src-title">The misunderstood limits of folk science: an illusion of explanatory depth</span> — Rozenblit &amp; Keil, Cognitive Science 26 (2002). cogdevlab.yale.edu
</div>

Note:
Take thirty seconds. Do not say anything aloud. In your own head, state the steps between a Python write call returning and your bytes reaching the disk. Name each layer. I will wait. Right. Some of you got two steps and stopped. That result has a name and a measurement. Rozenblit and Keil called it the illusion of explanatory depth. They asked people to rate their understanding, then to explain the thing, then to rate themselves again. The second rating was consistently lower. The effect is strongest for explanations and weakest for plain facts. That is the shape of a theory-only education. Trying to explain reveals the gap. Hearing about it does not. [S1]

<p class="kicker">Part I · Practicum</p>

<h2>What a practicum asks of you</h2>
<p class="lede">A lecture course asks you to reproduce an explanation. A practicum asks you to produce an observation and defend it.</p>

Crouch and Mazur measured the difference in a physics classroom. Students who only watched a demonstration gained little understanding of the concept it showed. Students who <span class="pos">predicted the outcome first</span> understood that concept measurably better. [S2]

<p class="closing">So I will not prove the thesis in this lecture. The next lecture opens with a three-line program whose output disappears.</p>

<div class="footnotes">
[S2] <span class="src-title">Classroom demonstrations: learning tools or entertainment?</span> — Crouch, Fagen, Callan &amp; Mazur, Am. J. Phys. 72 (2004). https://works.swarthmore.edu/fac-physics/203/
</div>

Note:
A practicum is not a lecture course with exercises attached. The difference is what it asks you to produce. A lecture course asks you to reproduce somebody else's explanation. A practicum asks you to produce an observation and then defend it. Crouch, Fagen, Callan and Mazur measured this in a physics classroom. Passive watching produced very little understanding of the concept demonstrated. Predicting the outcome first produced a measurable gain in that understanding. Predict, then look. That is the method. Now notice what I have just done. I asserted the thesis of this course and proved nothing. That is deliberate. The next lecture opens with three lines of Python whose output vanishes. Hold me to it. [S2]

<p class="kicker">Part II · The idea</p>

<h2>One idea carries all eight topics</h2>
<p class="lede">Every operating-system interface keeps its promise only under conditions nobody wrote down.</p>

| | |
|---|---|
| **The contract** | The written half says what the call does. The scope clause says when it does that. [V4] |
| **The method** | You cannot reason out which layer lies. Record the boundary crossings. Then count them. [V5] |

<p class="closing">A leak is your program leaving the scope, not the abstraction failing [V4]. A library's documentation is a claim. The system call it issues is a fact [V21]. Trust the trace when they disagree.</p>

<div class="footnotes">
[V4] [V5] <span class="src-title">Where the Abstraction Leaks</span> · [V21] <span class="src-title">AI Agents as Debugging Operators</span>
</div>
Note:
Here is the idea. Every abstraction the operating system gives you is a contract with a silent scope clause. The contract is written down. Open a file, write bytes, close it. You have read that part. The scope clause is the part nobody writes down. It says under which conditions the contract holds. Step outside those conditions and you get a leak. The leak is not a bug. It is your program leaving the scope. And here is why this course is built on tools. You cannot deduce which layer is lying. You have to make the boundary crossings visible and count them. One more sentence, and I would put it on the wall. A library's documentation is a claim. The system call it issues is a fact. [V21] When the two disagree, trust the trace, and read the documentation as the wrong one. [V4] [V5]

<p class="kicker">Part II · Topic 1</p>

<h2>Topic 1 — I/O: files and the network</h2>
| | |
|---|---|
| **What it covers** | One file write and one network request, to the device |
| **The general rule** | Nearly every fast call returns before the work happens. "Almost every fast OS interface returns when the kernel has taken responsibility for the work, not when the work has happened." [V6] |
| **The divergence** | On Linux a socket is a file descriptor. On Windows it is not: "In Winsock applications, a socket descriptor is not a file descriptor and must be used with the Winsock functions." [V7] |

<p class="closing">The course starts here: following one write down makes a tracer necessary.</p>

<div class="footnotes">
[V6] <span class="src-title">Where the Abstraction Leaks</span> · [V7] <span class="src-title">Sockets and Network I/O</span>
</div>
Note:
Topic one is input and output, files and the network together. Everyone here has written a file, so this needs no motivating. Here is the rule you meet. Almost every fast operating system interface returns when the kernel has taken responsibility for the work. It does not return when the work has happened. Those are different moments. The gap between them is where the interesting failures live. Files and sockets share a slide because read and write operate on both. The platforms disagree sharply here. On Linux a socket is a file descriptor. On Windows, in Microsoft's own words, it is not. Why start here? Following one write call down is what forces the boundary into view, and what makes a tracer necessary rather than decorative. That is my own reason for the order. [V6] [V7]

---

<p class="kicker">Part II · Topic 2</p>

<h2>Topic 2 — The system-call boundary</h2>
| | |
|---|---|
| **What it covers** | Where your program stops and the operating system begins, and how you cross that line |
| **The divergence** | Linux publishes the system call interface. Windows publishes Win32 and reserves the layer below it [V8] |
| **The correction** | "Both are stable at the layer they nominate. The disagreement is about which layer is nominated" [V8] |

<p class="closing">You will be able to name where the boundary sits on each platform, and say why they chose differently.</p>

<div class="footnotes">
[V8] <span class="src-title">Windows and Linux place the stable syscall boundary at different layers</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic two takes what topic one showed you in one case and makes it general. Where does your program stop and the operating system begin? Linux publishes the system call interface itself as the stable contract. You may issue a system call directly and the kernel promises it will keep working. Windows does not do that. Windows publishes Win32 as the contract and treats the layer below as an implementation detail it reserves the right to change. Now, the easy mistake here is to read that as Linux doing it right. It is not. Both systems are stable at the layer they nominate. The disagreement is about which layer gets nominated, and each choice buys something and costs something. We will work through both. [V8]

---

<p class="kicker">Part II · Topic 3</p>

<h2>Topic 3 — Observing a running system</h2>
| | |
|---|---|
| **What it covers** | `strace` on Linux, NtTrace on Windows, and how to read what they print |
| **The honest limit** | A tracer adds code, so it changes the timing it reports. "A tracer is not a window onto a running program. It is an edit to that program." [V22] |
| **The precedent** | A published graduate course "teaches kernel behaviour through DTrace and hardware performance counters" [V9] [S3] |

<p class="closing">You will be able to state a tracer's cost and its blind spot.</p>

<div class="footnotes">
[S3] <span class="src-title">Teaching OS with FreeBSD through Tracing</span> — Neville-Neil et al. (2017). https://www.usenix.org/system/files/login/articles/login_spring17_03_neville-neil.pdf · [V22] [V25] <span class="src-title">Tracing cost and blind spot</span>
</div>
Note:
Topic three is the tools. On Linux that is strace. On Windows it is NtTrace, which attaches at a different boundary for the reason we just covered. The part I care most about is the limit. A tracer is not a window onto a running program. It is an edit to that program. [V22] Three consequences follow:

<ul>
  <li>The tracer changes the timing it reports.</li>
  <li>The tracer costs real performance. [V22]</li>
  <li>Every tracing mechanism has a blind spot. [V22]</li>
</ul>

A syscall tracer sees only the work that crosses the boundary. Linux has an interface called `io_uring` that passes requests through shared memory instead, and `strace` never sees those. [V25] You must leave this course able to run your platform's tracer — strace on Linux, NtTrace on Windows — and able to state its blind spot. With only the first, I have taught you a command rather than a skill. This design is not mine. Neville-Neil and colleagues published a graduate course taught this way. [V9] [S3]

<p class="kicker">Part II · Topic 4</p>

<h2>Topic 4 — Virtual memory and the page cache</h2>
| | |
|---|---|
| **What it covers** | Where the bytes you wrote went, and why freed memory is still held |
| **The mechanism** | An allocation gives you address space, not memory. "A mapping can exist with no physical page behind it. The page is materialized on first touch, by a fault." [V17] |
| **The consequence** | One process yields several memory figures, each measuring a different thing. "How much memory does this process use" turns out to be a badly posed question [V17] |

<p class="closing">You will be able to read a memory figure and say which question it answers.</p>

<div class="footnotes">
[V17] <span class="src-title">Virtual Memory and the Page Cache</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic four. You allocate memory and you think you now have memory. You do not. You have address space. A mapping can exist with no physical page behind it, and the page arrives on first touch, by a fault. A page fault is not an error. It is the normal mechanism by which memory starts existing. Once you know that, several confusing things stop being confusing. Why a program that re-reads the same file is faster on its second run. Why your process monitor disagrees with your program. Why free memory is mostly a bookkeeping category. The skill from this topic is reading a memory number and knowing which question it answers. [V17]

---

<p class="kicker">Part II · Topic 5</p>

<h2>Topic 5 — Protection, shared memory and IPC</h2>
| | |
|---|---|
| **What it covers** | How one address space is isolated from another, and every way you deliberately cross that line |
| **The mechanism** | "Every load, store, and instruction fetch a process performs is checked before it completes." [V18] |
| **Where it is checked** | In hardware, by the memory management unit, against permission bits the kernel wrote [V18] |

<p class="closing">You will be able to say why a segmentation fault is the protection working rather than failing.</p>

<div class="footnotes">
[V18] <span class="src-title">Memory Protection</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic five. Every load, every store and every instruction fetch your process performs is checked before it completes. Not by the compiler. Not by the language runtime. Not by the kernel code. It is checked in hardware, by the memory management unit, on every access, against permission bits the kernel wrote. That is why isolation is cheap enough to be unconditional. It also reframes something you have all seen. A segmentation fault is not the system breaking. It is the protection working, and telling you so. The second half of the topic covers the deliberate crossing: shared memory, pipes, message queues, signals. Isolation is the default, and IPC is how you open one door in it. [V18]

---

<p class="kicker">Part II · Topic 6</p>

<h2>Topic 6 — Processes, threads and scheduling</h2>
| | |
|---|---|
| **What it covers** | What the operating system actually schedules, and how language runtimes redefine the thread you think you have |
| **The finding** | "A userspace-scheduled unit of concurrency produces no system call when it is created and no system call when it yields" [V19] |
| **Why that matters** | "a syscall tracer shows nothing at all where the student expects to see concurrency" [V19] |

<p class="closing">Here the absence is the finding. You will be able to read an empty trace as evidence.</p>

<div class="footnotes">
[V19] <span class="src-title">Processes, Threads and Scheduling</span> — author's working notes, summarised in the handout appendix.
</div>

Note:
Topic six contains my favourite result in the course. You write a program using green threads, or goroutines, or async tasks. You attach a tracer, expecting concurrency. You see nothing. No system call when the unit is created, none when it yields. The trace looks like a serial program. Students meet this and assume the tool is broken. It is not. The absence is the finding. It tells you the language runtime has taken scheduling away from the kernel. Your thread is not what the operating system calls a task. Reading an absence as evidence is a genuinely hard skill, and this is where the course teaches it. [V19]

---

<p class="kicker">Part II · Topic 7</p>

<h2>Topic 7 — Post-mortem analysis, with and without an agent</h2>
| | |
|---|---|
| **What it covers** | Reading what a process left behind, and driving the tools with an AI agent |
| **Why it is separate** | Every earlier topic needs a live process. Here it is dead: "A dump is all you get once it is already dead." [V20] |
| **The agent question** | An agent adds breadth over a large trace, and little on one stack frame [V26]. It reads only what the trace and the dump captured [V27] |

<p class="closing">You will be able to say which half of a session a model can take.</p>

<div class="footnotes">
[V20] <span class="src-title">Crash Dump Analysis</span> · [V26] [V27] <span class="src-title">AI Agents as Debugging Operators</span>
</div>
Note:
Topic seven is failure analysis, in two halves. The first is the crash dump. Every tool in topics one to six needs the process to be alive when you look. Post-mortem work begins where that stops being true. Tracing shows you a running system. A dump is all you get once it is dead. It is a photograph, not a recording, and you reason backward from it. The second half is what an agent changes. My honest position is that it is tool-specific. Reading a forty thousand line trace is breadth-shaped work, and a model is good at it. Reasoning about one optimised-away local is depth-shaped, and a model is unremarkable. [V26] Knowing which is which is the skill. An agent reads the evidence a tool already produced. It acquires none of its own. [V27] [V20] [V21]

<p class="kicker">Part II · Topic 8</p>

<h2>Topic 8 — Leaks in the abstraction</h2>
<div class="kv">
<div class="pair"><div class="k">The stance</div><div class="v">Your program steps outside the conditions the abstraction covers. "The leak is not the abstraction failing; it is the program leaving the scope." [V4]</div></div>
<div class="pair"><div class="k">What you take away</div><div class="v">Your own list of scope clauses a program stepped outside of</div></div>
<div class="pair"><div class="k">The pace</div><div class="v">No fixed week per topic. Three weeks are reviews built from your submissions</div></div>
</div>

<p class="closing">By then your list has entries like a write that returned before the data was safe.</p>

<div class="footnotes">

<p class="kicker">Part III · Shape</p>

<h2>The homework is a loop, not a test</h2>
<p class="lede">Resubmit as often as you like until the deadline. A fail costs time and nothing else.</p>

<div class="kv">
<div class="pair"><div class="k">What the checker returns</div><div class="v">Defects, not remedies. It names what is wrong, never the fix</div></div>
<div class="pair"><div class="k">Why not remedies</div><div class="v">A critic is normally told to "suggest concrete revisions" [V15]. We drop that half on purpose</div></div>
</div>

<p class="closing">Push your failures. A passing commit is by construction the one with nothing left that the checker can catch.</p>

<div class="footnotes">
[V15] <span class="src-title">Generative Actor Critic</span> — author's notes.
</div>
Note:
Now the shape of the homework, because it changes how you should work. You may resubmit as often as you like until the deadline. A fail before the deadline costs time and nothing else. So this is not a test with retries. It is a loop. You submit, something tells you what is wrong, you fix it, you submit again. One deliberate choice inside it. The checker returns defects, never remedies. It will say your program loses its output when the output is redirected. It will not say change line forty two. In the engineering version of this pattern the critic does both. [V15] We drop the second half, because a checker that hands you the fix has done the assignment for you. And one consequence. A team that iterates to green has, by the deadline, removed every defect the checker tests for. So the teaching material is the sequence of attempts, not the pass.

<p class="kicker">Part III · Reward</p>

<h2>What passing an assignment buys you</h2>
| | | |
|---|---|---|
| 1 | **The zkouška has two parts** | An irreducible core every student sits unaided, and a removable part |
| 2 | **A pass removes its subject** | Passing an assignment removes that subject from your zkouška. Fixed, not chosen by you |
| 3 | **The whole team gets it** | The submission is the team's, and the reduction applies to every member |

<p class="closing">A checker you may retry without limit is a target by construction, so it stops measuring you. "When a measure becomes a target, it ceases to be a good measure" [V16]. That is why the unaided core stays.</p>

<div class="footnotes">
[V16] <span class="src-title">Goodhart's Law</span> — author's notes.
</div>
Note:
This is the part that pays you. The zkouška has two parts. An irreducible core that every one of you sits, and a removable part. Passing an assignment removes that assignment's subject matter from your zkouška. It is fixed, not chosen by you, and you know on the day it is set exactly what passing buys. So it is a smaller syllabus, not merely a shorter paper. Pass all three and only the core is left. The submission is the team's, so the reduction applies to every member. Yes, your zkouška depends on your teammates. Hear that on day one rather than in January. Why keep a core? Goodhart's law. When a measure becomes a target it stops measuring, and an unlimited retry checker is a target. The core is unaided, and everybody sits it. [V16]

<div class="pair"><div class="k">The asymmetry</div><div class="v">You may not use AI in the zkouška, and an AI grades you. Named here rather than found later</div></div>
</div>

[V10] <span class="src-title">Human on the Loop</span> — author's notes.
</div>

<p class="kicker">Part III · Failure</p>

<h2>How this arrangement fails</h2>
| | |
|---|---|
| **Vigilance decays** | Mackworth's watchers hunted rare double jumps in a pointer stepping once a second, for two hours [V24]. Detection fell from about 85% to about 75% in 30 minutes [V11] |
| **Review becomes ritual** | Gate everything and the reviewer clicks through: "a rubber stamp with an audit trail" [V12] |
| **A critic invents faults** | Where models started at ≥75% task accuracy, "The critic, primed to find errors, invented them." [V14] |

<p class="closing">So tell us when a result is wrong. "the human's job is to adjudicate a raised alarm" [V13]</p>

<div class="footnotes">
[V11] [V12] [V13] [V24] <span class="src-title">Human on the Loop</span> · [V14] <span class="src-title">Generative Actor Critic</span>
</div>
Note:
This is the first system the course asks you to look at rather than trust, and it is the one grading you. So here is how it fails. Bainbridge named the general problem in nineteen eighty three. The better the automation, the worse the monitor's job becomes. Mackworth measured it. His observers watched a pointer step once a second for two hours, and had to catch its rare double jumps. Detection fell from about eighty five percent to about seventy five within thirty minutes. Second. Make a human sign off everything and you train them to click through. That is a rubber stamp with an audit trail. Third, and this one bites good work. On the tasks where the models started at seventy five percent accuracy or better, a critic primed to find errors invented them. The repair is structural. Tell us when a result is wrong. A human adjudicates a raised alarm far better than they spot one. [S8] [V11] [V24] [V12] [V14] [V13]

<p class="kicker">Part III · Honesty</p>

<h2>What this course is betting</h2>
<p class="lede">The bet: unlimited retries, with two counterweights — a checker that names defects, never remedies, and an unaided zkouška core.</p>

Three published results argue against it.

| | |
|---|---|
| **Retries** [S6] | A team pushes one-line edits to see which test flips. Limits and regression penalties cut that by up to 85% |
| **Feedback** [S18] | Rapid feedback leads some students to aim at the tests, not the program |
| **Guidance** [S22] | Under minimal guidance a learner with low prior knowledge learns less than under strong guidance |

<p class="closing">Edwards' counterweight was student-written tests [S17]. Ours are the two above.</p>

<div class="footnotes">
[S6] https://dl.acm.org/doi/10.1145/3591210
[S17] https://web-cat.org/publications/pos27-Edwards.pdf
[S18] https://valerio-terragni.github.io/assets/pdf/luxton-ace-2023.pdf
[S22] https://itgs.ict.usc.edu/papers/Constructivism_KirschnerEtAl_EP_06.pdf
</div>
Note:
Here is the bet, and this is the slide I would most want a colleague to attack. We keep unlimited retries. Two counterweights carry the risk. The first is a checker that names defects and never remedies. The second is a zkouška core that every one of you sits unaided. Now the evidence against it. Lawrence and colleagues measured the case against us. A team pushes a one line edit every few minutes to see which test flips. Submission limits and regression penalties together cut that behaviour by up to eighty five percent. Students also prefer the limits. Luxton-Reilly and colleagues name the behaviour. With rapid feedback, some students aim at passing the test cases rather than improving the program. Kirschner, Sweller and Clark compared minimal guidance with strong guidance. Under minimal guidance a learner with low prior knowledge learns less of the material than under strong guidance. Their finding is about learners with low prior knowledge. Reading this room as that case is my judgement, not theirs. Edwards built unlimited submission in two thousand three with a counterweight of his own. He assessed a student's program only by the tests the student had written. We keep the unlimited half and substitute our two. If the bet is wrong, it is wrong here. [S6] [S18] [S22] [S17]
