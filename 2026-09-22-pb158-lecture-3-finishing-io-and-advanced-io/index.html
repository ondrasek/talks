Note:
Four levels. Read them from the top.

Level one is your program's own buffer, owned by the language runtime. Level two is the C library's buffer. Level three is the operating system's own memory for file data. Level four is the cache inside the storage device. Then, at the bottom, the medium.

Notice that levels one and two sit side by side. They are alternative routes, not a pile. A Python program uses the buffer at level one and calls the kernel directly. A C program uses the buffer at level two. I come back to this in four slides, because it is the detail people get wrong [V6].

Now read the arrows. Each one is a different call, and each one moves your bytes down exactly one step. No single call takes data from the top to the bottom.

<h2>Explain: what dies with the process, what dies with the machine</h2>

<p class="lede">Two different failures. Part 2's demonstration tests one. Your recap question asked about the other.</p>

<div class="boxes">
<div class="box">
<p class="kicker">The process dies</p>
Levels 1 and 2 go with it. Anything already handed to the kernel survives, because the kernel writes it back on its own [V14].
</div>
<div class="box filled">
<p class="kicker">The machine loses power</p>
Levels 1, 2 and 3 are gone. Level 4 goes too, unless the device has power-loss protection.
</div>
</div>

My own note is blunt: "the honest classroom demo is a power-cut, not a `kill -9`" [V14]. Part 2 opens with a `kill -9`. Hold the distinction. <span class="neu">Part 6 measures the level-3 window.</span>

Note:
Here is the answer to the third question, and it is the bridge into the rest of the hour.

Two failures, and they are not the same failure.

Kill the process. Levels one and two are that process's memory, so they die with it. Level three is the kernel's memory and the kernel is still running. Those bytes get written back [V14]. Your process does not need to exist.

Pull the power. Now level three dies too, because it was RAM. Level four is the cache inside the drive. Whether that survives depends on power-loss protection, which is capacitors inside the drive. Most consumer drives do not have it, and that is my reading rather than a figure I can cite.

I am saying this now, before part two, for one reason. Part two opens with a kill demonstration. Students watch that demonstration, see the file survive, and conclude that flush was enough. It was enough against that test. My own note says the honest classroom demo is a power cut, not a kill [V14].

Nobody is pulling the plug in this room today. Instead, in part six, I measure how long level three holds your bytes. That is the window a power cut would have caught.

<p class="kicker">Part 2</p>

<h2>Why the file is empty</h2>

<p class="lede">The rule sits in the C standard, not in the kernel.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Mode follows destination</div><div class="desc">Output is "fully buffered if and only if the stream can be determined not to refer to an interactive device" [S5].</div></div>
<div class="row"><div class="num">2</div><div class="term">A terminal is interactive</div><div class="desc">Bytes go out per line.</div></div>
<div class="row"><div class="num">3</div><div class="term">A file is not</div><div class="desc">Bytes wait.</div></div>
<div class="row"><div class="num">4</div><div class="term">The exit skips cleanup</div><div class="desc">No <code>write</code> reaches the kernel.</div></div>
</div>

<div class="footnotes">
[S5] C99 draft §7.19.3. https://busybox.net/~landley/c99-draft.html
</div>

Note:
Here is the explanation, and notice where it comes from [S5].

The rule is in the C language standard. It is not an operating system behaviour and it is not a Python quirk. The standard says that standard output is fully buffered if and only if the stream can be determined not to refer to an interactive device.

Then the third line ends the process without running any cleanup. The standard explicitly permits termination paths that do not close files properly. The buffer is process memory. The process is gone. The bytes went with it.

Now the sentence that connects this back to section two. A trace of this program holds no write call at all. Not a failed one. Not a short one. None. The bytes never got as far as the operating system.

That is the top of the stack, proved to exist by removing it.

Note:
I have to bound that demonstration immediately, because it is easy to over-read.

Killing a process destroys that process's memory, and that is level one. Bytes the program gave to the operating system earlier sit in the page cache, and the operating system writes them back in its own time [V14]. Your process does not need to exist.

So this proves that level one exists and can lose your data. It proves nothing about levels three and four.

The honest test for the lower levels is a power cut, not a kill [V14]. Pull the plug and you find out what the page cache was holding. Nobody is doing that in this room today.

Why so careful? Because students test with a kill, watch the file survive, and conclude that the program flushed everything it needed to. That conclusion holds against a kill and not against a power failure. Same demonstration, correct conclusion — the difference is which level you claim it tested.

<p class="kicker">Part 2</p>

<h2><code>ltrace</code>: the same idea, one layer up</h2>

<p class="lede"><code>strace</code> stops at system calls. <code>ltrace</code> stops at calls into shared libraries.</p>

<div class="kv">
  <div class="pair"><div class="k">What it does</div><div class="v">It "intercepts and records the dynamic library calls" a process makes [S31]. It can also print "the system calls executed by the program" [S31].</div></div>
  <div class="pair"><div class="k">Where it comes from</div><div class="v">Juan Cespedes wrote it originally [S32]. The manual page names Petr Machata too [S31]. On Debian and Ubuntu you run <code>apt-get install ltrace</code> [S32].</div></div>
</div>

<p class="kicker">How to use it</p>

```text
ltrace ./iodemo       # the C library calls: fopen, fwrite, fclose
ltrace -S ./iodemo    # "system calls as well as library calls" [S31]
ltrace -c ./iodemo    # a count for each library call [S31]
```

<span class="neu">It runs on Linux only</span>.

<div class="footnotes">
[S31] ltrace(1). https://man7.org/linux/man-pages/man1/ltrace.1.html
[S32] ltrace. https://ltrace.org/
</div>

Note:
Here is the second tracer. It makes the next slide checkable.

<h1>The same write, at three levels</h1>

<div class="rule"></div>

<p class="lede">Now that the levels have a reason to exist, walk down them with one small program.</p>

Eight minutes. In section three I said the levels exist, and why. This section walks down them with a program you can compile yourself.

<p class="kicker">Part 3</p>

<h2>The same write, at three levels</h2>

| level | Python | C | buffered? |
|---|---|---|---|
| Application | `f.write(b"x")` [S6] | — | yes [S6] |
| C library | — | `fwrite(...)` [S3] | yes [S3] |
| System call | `os.write(...)` [S20] | `write(...)` [S2] | no |

The bottom row takes a **file descriptor** — the small integer naming an open file. You saw one already: the `= 3` in the trace line was a file descriptor [S1].

<div class="footnotes">
[S1] strace(1) — Linux man-pages. https://man7.org/linux/man-pages/man1/strace.1.html
[S2] write(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/write.2.html
[S3] fflush(3) — Linux man-pages. [S6] Python documentation, open().
[S20] os — Miscellaneous operating system interfaces, os.write(). https://docs.python.org/3/library/os.html#os.write
</div>

Note:
Read the table by column first, then by row.

The Python column and the C column are two routes to the same bottom row. Python's file objects hold a buffer at level one. C's fwrite fills a buffer at level two. Both call write in the end, and write is the system call.

Now read the last column, because it carries the point. Each level holds a buffer, or it passes the bytes straight down. A Python file object holds one. The os.write function does not, because it wraps the system call directly [S20]. The levels are not decoration. They are the mechanism you measured in part one.

The bottom row introduces a term I deferred until now. A file descriptor is the small integer a Linux program uses to name an open file in system calls. You have seen one: the open call returned three [S1]. It appears as the first argument of every write to that file.

Remember the word. In section five it is the first thing that differs.

<p class="kicker">Part 3</p>

<h2>Meet the program: <code>iodemo.c</code></h2>

<p class="lede">Nine lines of C. The first open fails on purpose, so the trace shows an error path.</p>

```c
f = fopen("no-such-file.txt", "rb");   /* 1. deliberate failure */
if (f != NULL) { fclose(f); return 2; }

f = fopen(path, "wb");                 /* 2. the real file */
if (f == NULL) { return 1; }

fwrite("one\n",   1, 4, f);            /* 3. three writes */
fwrite("two\n",   1, 4, f);            /*    fourteen bytes */
fwrite("three\n", 1, 6, f);

if (fclose(f) != 0) { return 3; }      /* 4. flush, then close */
```

It prints nothing, on purpose. A program that prints nothing adds no `write` lines of its own to the trace.

Note:
Nine lines on the screen. The full file adds comments and error returns.

Step one opens a file that does not exist, and that failure is deliberate. If every call succeeds, the trace is success all the way down, and the most interesting difference between the two platforms never appears. I show you that difference in section five.

Step two opens the file we mean to write.

Step three writes fourteen bytes in three calls. The C library collects them in its own user-space buffer before any of them crosses into the kernel [S3] [S5]. Watch that number.

Step four closes the file and checks the return value of the close. Almost none of the C I have read does that. I come back to why in section six.

The program prints nothing at all. My reason is the plain one. Every `write` line in the trace then comes from the three `fwrite` calls, and not from a print statement. A silent program also makes a trace that is easier to read.

I am compiling it now, with warnings on, and running it.

<p class="kicker">Part 3</p>

<h2>Three calls in the source. One in the trace.</h2>

<div class="stats">
  <div><div class="stat">3</div><div class="stat-cap"><code>fwrite</code> calls in the source</div></div>
  <div><div class="stat">14</div><div class="stat-cap">bytes written in total</div></div>
  <div><div class="stat">1</div><div class="stat-cap"><span class="pos">write</span> call in the trace</div></div>
</div>

The three `fwrite` calls go into one C library buffer. The manual calls that level "the user-space buffers provided by the C library" [S3]. The line to look for in the live trace, predicted from the source:

```text
write(3, "one\ntwo\nthree\n", 14) = 14
```

The `3` is the file descriptor. The `14` is all three `fwrite` calls, in one crossing.

<div class="footnotes">
[S3] fflush(3) — Linux man-pages. https://man7.org/linux/man-pages/man3/fflush.3.html
</div>

Note:
This is where takeaway two stops being a claim and becomes something on a screen.

Three fwrite calls in the source. Fourteen bytes. One write in the trace.

Point at the source. Point at the trace. There is no line-by-line correspondence between them, and there never was. What you write is a library call. What the operating system sees is a system call. Your source did not say how many system calls to make — the buffering policy in the library fixed that number.

The line on the slide is a prediction. I wrote it from the source before I ran anything. Now watch the real trace. Check it against the prediction. If they differ, the prediction was wrong and the machine was not.

And notice when the write happens. Not at the third fwrite. It happens when fclose runs, because fclose hands the buffer down to the kernel. The call in your source and the call in the trace are not even at the same point in time.

<p class="kicker">Part 3</p>

<h2><code>fwrite</code> takes a size and a count</h2>

<p class="lede">Four arguments, and two of them multiply.</p>

```c
fwrite("three\n", 1, 6, f);
/*      data      ^  ^   stream
                  |  +-- number of items
                  +----- size of one item, in bytes  */
```

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">It returns a count</div><div class="desc">Items written, not bytes. The count equals bytes only when the item size is 1 [S21].</div></div>
<div class="row"><div class="num">2</div><div class="term">Fewer is legal</div><div class="desc">Below it, "a successful write() may transfer fewer than count bytes" [S2].</div></div>
</div>

<div class="footnotes">
[S2] write(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/write.2.html
[S21] fread(3), which documents fwrite(3) — Linux man-pages. https://man7.org/linux/man-pages/man3/fwrite.3.html
</div>

Note:
A small thing that trips people. It costs thirty seconds now or twenty minutes when you try it yourself.

The call takes four arguments: a pointer to the data, the size of one item in bytes, the number of items, and the stream. In our program I passed one and six, meaning six items of one byte each. Six and one would have written the same bytes.

Why does it matter? Two reasons.

First, the return value counts items, not bytes. The manual says the count equals the number of bytes only when the item size is one [S21]. Write six items of one byte. You get four back, and you wrote four bytes. Write one item of six bytes. You get zero back, and you wrote nothing.

Second, fewer is legal. The system call underneath may transfer fewer bytes than you asked for [S2], and the library call may report fewer items than you asked for [S21]. Two different contracts, one habit. Read the return value.

The native API is the layer below Win32. It lives in a library called ntdll, and it is the last user-mode code before the kernel. Microsoft's own documentation calls it internal to the operating system [S9]. NtTrace attaches at this layer, which is why its lines start with Nt [S10].

The object manager is the kernel component that names open things — files, processes, events. Its paths look different from the paths you type. You see one later in this section, in a trace of the Windows command shell [S34].

<h2>A handle is not a file descriptor</h2>

<p class="lede">First difference, visible in the first argument of almost every line.</p>

<div class="boxes">
<div class="box">
<p class="kicker">Linux</p>
A file descriptor. A small integer indexing a per-process table. Our trace shows <code>= 3</code> [S37].
</div>
<div class="box filled">
<p class="kicker">Windows</p>
A handle. An opaque value naming an open object. Our trace shows <code>FileHandle=0x124</code> [S36].
</div>
</div>

Same job in a trace, different mechanism in the system. Do not use one word for the other.

<div class="footnotes">
[S36] Our NtTrace64 capture of iodemo.exe, 2026-09-15 — demo/iodemo-c/NtTrace64-IODEMO-Output.txt

</div>

Note:
First difference, and it sits in the first argument of nearly every line on both systems [S36] [S37].

One program, one file, two systems. Linux answered `3`, and Windows answered `0x124` [S36] [S37].

On Linux you get a file descriptor. A small integer indexing a table that belongs to your process. Three, four, five. You can reason about the numbers.

On Windows you get a handle. An opaque value that names an open object, and the object need not be a file. It might be a process, an event or a registry key.

In a trace they occupy the same position and do the same job, which is why it is tempting to use one word for both. Do not. In this course I hold the two words apart. If you write handle in a Linux assignment, I will ask which system you meant.

This is a small thing. I spend a slide on it because it is the cheapest instance of today's platform lesson: the same job, two mechanisms, visible in one argument.

On Linux the opposite holds. The system call interface is the public contract. You may write a system call number down and rely on it.

Now the careful sentence, and it is the takeaway. By nominate I mean one thing: the vendor documents that layer as the one it will not break. Both systems are stable at the layer they nominate, and the disagreement is about which layer that is. Everything else follows from that single placement, including where a tracer can attach.

</div>

Note:
I said the placement was a decision. Let me be more careful, because the evidence supports two readings and I would be overstating if I gave you only one [S15] [S19].

Reading A is design. NT had three operating environments: POSIX, OS/2 and Win32 [S19]. Each one served its own clients through its own interface. Each one reached NT through the native API [S19]. The source does not say where those environments ran, so neither do I. On that reading the split is deliberate. An unstable lower layer then follows from it.

Reading B is vestige. A POSIX subsystem did exist, and one practitioner account says it was built to satisfy United States government procurement rules and never finished [S15]. On that reading the split is what remained after the plan was abandoned.

Both accounts are in the literature, and I am not going to settle it in a practicum. The mechanism is settled. The intent is not.

Linux is the clearer case. It was a kernel built against a separately developed userland it did not control [V38]. It could not update the C library in lockstep, so it had to make the kernel boundary itself the stable one [V38].

Note:
Now the correction to the conclusion you were probably forming.

After the last two slides it is tempting to think Windows is the odd one out. It is not. My source names the list: FreeBSD, OpenBSD, NetBSD, Solaris/illumos and macOS all behave like Windows here [V43]. None of them promises that the raw system call interface stays the same. Linux does. Linux is the exception [V9].

Do not read that list as five broken systems [V36]. FreeBSD keeps old programs running through compatibility layers. It holds the interface in practice. It just does not write the promise down [V36].

Why can Windows and macOS skip the promise? Because each ships its own C library. Programs call the library, the library is the stable surface, and the kernel boundary below it is free to move [V38]. Linux could not do that, because its C library was built by somebody else.

In this course you say the platforms are different. You do not say one is worse. If you write that, I will ask which property you are ranking them on.

Saltzer, Reed and Clark gave the general form in 1984. A lower level may offer "an incomplete version of the function… useful as a performance enhancement" [S11].

Note:
Read the first quote again. It comes from the manual page for the most basic write call there is. It says a successful return guarantees nothing about a disk [S2].

The second quote is there so you do not think this is a bug someone will fix. Saltzer, Reed and Clark wrote it in 1984. A lower level may offer an incomplete version of a function as a performance improvement. The complete version needs the application at the end points. Every level in our diagram is an instance of that.

<p class="kicker">Part 5</p>

<h2>Buffering moves your errors</h2>

<p class="lede">The error arrives somewhere other than where you caused it.</p>

<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Why it moves</div><div class="desc">The bytes only reached a buffer.</div></div>
<div class="row"><div class="num">2</div><div class="term">Where it arrives</div><div class="desc">Where the library flushes, so at <code>fclose</code>.</div></div>
<div class="row"><div class="num">3</div><div class="term">The rule</div><div class="desc">Check the return value of the call that flushes.</div></div>
<div class="row"><div class="num">4</div><div class="term">The idiom hides it</div><div class="desc">"the most common durability idiom in every mainstream language… contains no durability step anywhere" [V4].</div></div>
</div>

Note:
Here is the practical consequence, and it will cost you a debugging afternoon at some point.

Your fwrite returned success because the bytes reached a buffer. A full disk, an unplugged device, an exceeded quota — no error from any of those has reached the library yet, and none can.

That is why the demo program checks the return value of fclose. Almost none of the C I have read does. That single check is the difference between having written fourteen bytes and believing you did.

The last row is worth saying slowly. The most common way to write a file in every mainstream language contains no durability step anywhere [V4].

Python differs here. A Python with block does raise if the close fails. The two languages differ in what they force you to notice, which is the property I am ranking them on.

This is error reporting, not error recovery. Recovery belongs to the durability lecture.

Under a debugger `CloseHandle` "will throw an exception if it receives … a handle value that is not valid … This can happen if you close a handle twice" [S38]. NtTrace *is* a debugger, so the second close raises [S39].

Note:
Now the second answer, and this one we can watch. A ten-line program opens a file, writes, closes, and closes the same descriptor number again. That second close is exactly what a retry would do.

<p class="kicker">Part 5</p>

<h2>Never retry a failed close</h2>

<p class="lede">The obvious repair is wrong, and the manual page says so [S4].</p>

"Retrying the close() after a failure return is the wrong thing to do, since this may cause a reused file descriptor from another thread to be closed" [S4].

A retry closes whatever now sits at that number, which may be another thread's file [S4].

<span class="neu">Report the error and stop.</span> Part 6 shows the same rule one level down, at `fsync`, and the data loss that taught it [V40].

<div class="footnotes">
[S4] close(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/close.2.html
</div>

Note:
Now you check the return value of close. You will want to do the obvious thing with it, and the obvious thing is wrong [S4].

Do not retry. The manual page says why, and the reason is specific. After a failed close the descriptor may already be gone. If another thread has opened a file meanwhile it may have been given that same number. Your retry closes somebody else's file.

The transferable rule: when a failure leaves you unable to tell what state you are in, stop the program and report it. Continuing hides the damage and does not repair it.

The databases learned this the hard way, one level down, at fsync. That story has its own slides in Part 6, after you have seen what fsync promises [V40].

Note:
This demonstration uses no tracer at all, and that is deliberate.

Last week you learned that a tracer changes the program it watches. So for this measurement I am not watching the program. I am watching the kernel, and the kernel publishes the number itself in a file called proc meminfo.

Two fields matter. Dirty is file data the kernel is holding and has not written to the device. Writeback is data on its way out right now [V78].

The word for a page in that state is a dirty page. It is the kernel's own word, and you will see it in the output.

<div class="box filled">

Note:
Somebody in this room is thinking: but I can open the file and read it back, so it must be saved.

You are right that you can read it back. POSIX guarantees it. After a successful write, a later read returns the bytes, and a read from a different process returns them too [V45].

That property has a name. It is visibility, and it is a coherence property of the page cache. Of course you can read the bytes back. They are sitting in the kernel's memory and the kernel serves your read from there.

Durability is a different property. It means the bytes survive a power loss, and it is a property of the medium [V45].

My note on this says confusing the two is the single most common error in this whole area, and I have made it myself [V45].

So here is the test that does not work. Running cat on the file proves visibility. It tells you nothing at all about whether the disk has your data. During those five seconds, cat would have shown you every byte.

Two words, held apart. Visibility. Durability.

Note:
Now the call itself, in the manual's own words.

Fsync transfers the file's modified data to the disk device [S67]. The page says this includes writing through or flushing a disk cache, if the device has one [S67]. Good. That is level three to level four, and it is what you want.

It blocks until the device reports that the transfer has completed [S67]. Also good. It waits.

Read the last four words again. The device reports. The whole guarantee rests on that report being accurate, and last week I told you that no software in this course can check it [V5].

The sentence at the bottom is from my own note, and I want you to keep it [V44]. Durability is not a property of a write. It is a property of a sequence of flushes. Each flush crosses exactly one boundary. Each one can fail on its own.

And this is not a theoretical worry about the last step. SQLite's documentation records that "often the IDE disk control lies and says that data has reached oxide while it is still held only in the volatile control cache" [V86].

So fsync is not the fix. Fsync is one crossing in a chain, and it is the last one you can see.

<p class="kicker">Part 6 · Durability</p>

<h2>Explain: the retry does not retry</h2>

<p class="lede">Mechanical, not sloppy code: <span class="neg">the retry does not re-attempt the failed I/O</span> [V54].</p>

<ol>
  <li><strong>Reported once.</strong> The kernel marks the page failed, reports it to the first <code>fsync()</code>, and clears the mark [S41].</li>
  <li><strong>Already gone.</strong> A failed writeback drops the data and marks the page clean, so a retry has nothing to write [V54].</li>
  <li><strong>So the retry lies.</strong> "It reads a status register that the previous read destroyed, over a page cache the data has already left" [V89].</li>
</ol>

The result: "how PostgreSQL lost data silently for twenty years" [V90].

Note:
Now why. And the reason is not that somebody wrote sloppy code. The retry does not re-attempt the I O at all [V54].

Step one. The kernel tried to write the page, the device said no, and the kernel marked the page as failed. The first fsync call collected that mark and reported the error. Collecting it cleared it [S41].

Step two. The kernel also dropped the page. A failed writeback discards the data and marks the page clean, because the kernel will not keep unwritable memory around forever [V54]. So the bytes left the page cache when the first call failed.

Step three. The second fsync finds a clean page and no error mark. It returns zero. It is telling the truth about the state it can see, and that state has no memory of the failure. "It reads a status register that the previous read destroyed, over a page cache the data has already left" [V89].

So the obvious repair makes the failure silent. A failure that is both silent and cleared by the retry is the hardest kind to find. This one is "how PostgreSQL lost data silently for twenty years" [V90].

Notice the shape. In Part 5 you saw the slide "Never retry a failed close". This is the same rule, one level further down. Next: what the databases did about it.

So what do you do when a call can report success over lost data?

Three shipped storage engines answered in 2018, and they answered the same way [V40]. You crash.

PostgreSQL replaced the retry with a panic and back-patched it to every supported release [V93]. InnoDB deleted a sleep-and-retry loop and substituted a fatal error [V84]. WiredTiger converted its sync paths to panic, and wrote the reason into the source comment [V24].

The argument is worth a sentence, because crash on error sounds like giving up. It is not. A database writes every change to a log first, then later writes the data files and deletes the old log. That second step is a checkpoint, and it is the moment the database throws away its own last copy. The fsync return code is the only evidence that lets it do that. Once that evidence may be false, the safe move is to discard the in-memory model and rebuild it from the log. Crashing is what preserves the log.

Two honesty notes. These are not three independent discoveries. WiredTiger's comment quotes the same LWN report the other two were reading [V24].

And this was a stopgap. My reading note says it has now lasted eight years [V56], which is a polite way of saying nobody found anything better.

Linux documents a hostile contract: one error report, then the data is gone. That is actionable. "For a system that must not lose data, an unspecified contract is the worse of the two positions" [V91].

Note:
Now the Windows half of fsync-gate, and it is the clearest case I have of reading what a specification does not say.

Eight years after this was found on Linux, the PostgreSQL project maintains a table of how each operating system behaves after a failed fsync. Linux, four kernel ranges. FreeBSD. NetBSD. macOS. Illumos. DragonflyBSD.

There is no Windows row [V47]. Not a row saying unknown. No row.

Why has nobody filled it in? On Linux the logic lives in shared kernel code that anyone can read. On Windows, FlushFileBuffers is a thin wrapper that dispatches to whichever filesystem driver owns the volume [V83]. The answer can therefore differ per driver, and my note says the Windows contract cannot be settled by reading [V55].

So the correct sentence for an exam is neither "Windows is safe" nor "Windows has the same bug". It is: Linux documents a hostile contract, and the Windows one has never been settled [V55].

And for a system that must not lose data, an unspecified contract is the worse of the two [V91]. Learning to read what a specification does not say is a professional skill, and this is the clearest case I have.

<p class="kicker">Part 6 · Durability</p>

<h2>Sync the directory too</h2>

<p class="lede">This part is yours, and the classic recipe is incomplete [V51].</p>

A file is two pieces of data in two places: its **bytes**, and its **name**, which lives in the directory. `fsync()` on the file flushes the bytes. The manual: "Calling fsync() does not necessarily ensure that the entry in the directory containing the file has also reached disk" [S67].

So "create-write-fsync-close on a new file is the classic incomplete recipe" [V51]: after a crash the bytes are safe and the file may have no name.

The fix costs one line: open the directory, and `fsync()` that descriptor too [S67].

Note:
I have spent five slides on things you cannot control. Here is the part you can, and it is the part real code gets wrong.

Think of a file as two things. The bytes, and the name. They are stored in different places. The bytes belong to the file. The name is an entry in another file, the directory. When you call fsync on your file, you flush the bytes. The directory has not been touched by that call. The manual page says so plainly, and almost nobody reads that far [S67].

So the recipe everybody writes, create the file, write, fsync, close, is incomplete [V51]. After a crash you can have a file whose bytes are all there and whose name never made it. It is unfindable.

The fix is one more call. Open the directory itself, you get a descriptor, and fsync that too [S67]. Now the name is on the device as well.

---

<p class="kicker">Part 6 · Durability</p>

<h2>Write-then-rename, and why it needs a sync</h2>

<p class="lede">How every editor saves, and how ext4 made it lose files in 2009 [S44].</p>

```text
write a temporary file  →  close it  →  rename(temp, original)
```

**Why the pattern.** `rename()` swaps the name atomically: "there is no point at which another process attempting to access newpath will find it missing" [S70].

**The trap.** The rename is a small piece of metadata. The temporary file's bytes are still dirty in the page cache. ext4 wrote the rename first, so a crash meant "that existing file gets replaced with a zero-length file" [S44].

**The fix.** `fsync()` the temporary file *before* the rename [S44]. Then the name can only point at bytes already on the device.

Note:
Third, and this is the one that hit real users. Write a temporary file, close it, rename it over the original. That is how every editor saves, and there is a good reason for it.

The reason is rename. Rename replaces the name in one step. The manual promises there is no moment at which somebody opening the file finds it missing [S70]. So a reader gets either the whole old file or the whole new file. Never a half-written one. That is what the pattern buys you.

Now the trap. Rename changes a directory entry. That is a tiny piece of metadata, and filesystems write metadata eagerly. The bytes of the temporary file are a different matter. They are sitting in the page cache, level three on your drawing, waiting for the writeback you measured in this part. ext4 in 2009 wrote the rename to disk before the bytes. If the machine crashed in between, the original file was already replaced, by a file with a name and no bytes. Ts'o wrote that up himself, about a filesystem he maintains [S44].

The fix is the same call as before. fsync the temporary file, then rename [S44]. After that, the name can only point at bytes that already reached the device.

So the summary of this whole part is not give up. The device you cannot check. The directory you can, and it costs you one line.

<p class="kicker">Part 6 · Durability</p>

<h2>Log first — and what if the log write fails?</h2>

<p class="lede">The write-ahead log protects you because of an <em>order</em>, and the order covers its own failure.</p>

<ol>
  <li><strong>Order.</strong> Log first, <code>fsync</code>ed; only then <em>committed</em> [V85]. The data file follows later, at a checkpoint [S71].</li>
  <li><strong>Log <code>fsync</code> fails:</strong> nothing was promised yet. PostgreSQL panics here too: "we already did the same for WAL data" [S71].</li>
  <li><strong>Data-file <code>fsync</code> fails later:</strong> "the only remaining copy of the data is in the WAL" [S71]. Crash, replay.</li>
</ol>

The log wins only because it is made durable *first*, one `fsync` per commit — the 67 ms you saw [S52].

Note:
A fair question, and one you should ask of every log-based design: the log only helps if it wins over the file. So what if the log write fails and the file write does not?

The answer is an order, and the order is the whole trick. Nothing is written to the data file until the same change is in the log and the log has been fsynced. And nothing is told to the client until that fsync returns. Committed means the log is on the device [V85].

Now run the failure through that order. The log's fsync fails. At that moment no client has been told committed. PostgreSQL treats that exactly like the data-file case, it panics, and the 2018 commit says so in one sentence: they already did the same for WAL data [S71]. When it comes back up, the transaction simply never happened, and no one was promised otherwise.

The other way round, the data file fails later, at a checkpoint. The log still has the change. The commit message says it: the only remaining copy of the data is in the WAL [S71]. Crash, replay, done.

So the log is not magically more durable than the file. It is made durable first, and paid for with one fsync per commit. That is the sixty-seven milliseconds you measured earlier in this part [S52]. Databases pay it. Your editor does not, and Part 6 is the reason.

  </div>

  </div>
</div>

Note:
So. When is it safe.

In software, never completely. Every done in the stack is a handoff to the next layer. The last handoff you can watch is fsync, and fsync trusts the device [S67] [V5].

In hardware, the honest answer is the one I gave you last week without a slide. The only real answer to durability, and it is still best effort, is a well-tested uninterruptible power supply. Keep the power on long enough for the last handoff to finish.

I owe you one correction to my own sentence, and it comes from the diagram you drew this morning. A UPS keeps the host running. Level four is the cache inside the drive. A drive can lose power while the host still has some. So a battery upstairs does not defend it. What defends level four is capacitors in the drive — power-loss protection — which is the thing to check on a datasheet rather than assume. So the honest pair is a tested UPS above and a checked drive below. Durability is the conjunction of every crossing succeeding, and each crossing can fail on its own [V44].

Then the part neither of them covers. Fsync-gate lost data with the power on and the machine running [V53]. A battery is no defence against a failure the kernel reports once and cannot report again [V54].

So the full answer has two halves. Keep the power on. And write every change to a log before you write the data. PostgreSQL's own documentation puts it plainly: "the only way to avoid data loss is to recover from the WAL after any failure is reported" [V85].

SQLite says it most plainly of anyone. It calls both flush primitives and trusts neither, because it has "received reports that neither of these interfaces works as advertised on many systems" [V49]. Its correctness rests on journalling and checksums instead.

That is the state of the art. Not a better call. A design that survives the call being wrong.

<p class="kicker">Part 7 · Waiting</p>

<h2>What a pipe is</h2>

<p class="lede">The thing we are about to wait on, a hundred times over.</p>

"Pipes and FIFOs (also known as named pipes) provide a unidirectional interprocess communication channel. A pipe has a *read end* and a *write end*" [S59].

<ul>
  <li>A pipe is a 64 KiB buffer inside the kernel [S59]. One process writes into one end, another reads from the other.</li>
  <li>Both ends are file descriptors, so <code>read()</code> and <code>write()</code> work on them unchanged [S59].</li>
  <li>"If a process attempts to read from an empty pipe, then read(2) will block until data is available" [S59]. That word, <em>block</em>, is the next slide.</li>
</ul>

Note:
Before the prediction, two words you need, because the whole of Part 7 is built on them. First word: pipe.

A pipe is a buffer that lives inside the kernel. It has two ends. One process writes into the write end, another process reads from the read end, and the bytes pass through the kernel's buffer in between. On Linux that buffer is sixteen pages, sixty-four kibibytes [S59]. When you type ls, a vertical bar, wc in a shell, the shell creates a pipe and connects the two programs to its two ends.

Both ends are ordinary file descriptors. That is why read and write work on a pipe without any change in your program [S59]. Part 8 makes that the whole point of the lecture's second half.

And one sentence from the manual that sets up everything that follows. If a process attempts to read from an empty pipe, read will block until data is available [S59]. Block. That is the second word.

<p class="kicker">Part 7 · Waiting</p>

<h2>Blocking, non-blocking, and letting the kernel wait for you</h2>

<p class="lede">Three ways to ask a pipe "is there anything to read?"</p>

<ol>
  <li><strong>Blocking.</strong> <code>read()</code> on an empty pipe parks your thread until data arrives [S59]. Fine for one pipe, hopeless for a hundred.</li>
  <li><strong>Non-blocking.</strong> Set <code>O_NONBLOCK</code>; now <code>read()</code> returns at once, with <code>EAGAIN</code>, when there is nothing [S59]. Ask all hundred, again and again: <em>polling</em>.</li>
  <li><strong>Let the kernel wait.</strong> <code>select()</code> and <code>poll()</code> take a list of descriptors and sleep until one is "ready", meaning a read "without blocking" is possible [S47]. One sleeping call instead of thousands of asks. <code>epoll</code> is Linux's faster form of the same idea [S46].</li>
</ol>

Note:
Second word: blocking. And the two things people built to avoid it.

Blocking is the default. You call read on an empty pipe and the kernel parks your thread. It does not run again until data arrives [S59]. For one pipe that is perfect, you use no processor while you wait. For a hundred pipes it is a problem. You asked pipe number one first, so you are asleep on pipe number one while pipe fifty has data waiting.

The first way out is non-blocking mode. You set a flag on the descriptor, O_NONBLOCK, and read stops waiting. If there is nothing, it returns immediately with an error called EAGAIN, try again [S59]. Now you can ask all hundred pipes in a loop. And then loop again. That is polling, and Program A in a moment does exactly this.

The second way out is to let the kernel do the waiting. select and poll are calls that take a whole list of descriptors and sleep until at least one of them is ready. Ready has a precise meaning in the manual, a read on it would not block [S47]. One call, one sleep, instead of thousands of questions. epoll is Linux's newer and faster version of that idea, with the list kept inside the kernel [S46]. Program B uses it.

Hold those three. Ask and wait. Ask and return. Let the kernel wake you. Now the prediction.

That design has a name: thread-per-connection. It failed on two bills.

Note:
Three things about those numbers before you carry them anywhere.

First, the twenty-eight thousand is a rate, not a total. Run the program for twenty seconds instead of two and it makes ten times as many calls, and every one of them learns nothing [S53]. That is the shape of the cost: it grows with time, not with data.

Second, the epoll program's one wait call is a constant. Run it for twenty seconds, or twenty minutes, and it still makes one. The hundred registrations were paid once. Two different curves, and that is the entire content of part seven.

Third, and this is the uncomfortable one. Twenty-eight thousand is a floor, not the real rate. The tracer slowed the loop down. Without the tracer, the same laptop asked one point three million times in one second [S53]. So the rule you take into the assignment: count under the tracer, and time without it [S1]. Brendan Gregg's measurement of a loop that does nothing but system calls came out four hundred and forty-two times slower under strace [S66] [V17]. The tracer is not free, and it is least free exactly where you most want to count.

<h2><code>epoll</code> is three calls</h2>

<ol>
  <li><strong><code>epoll_create1</code></strong> makes an <strong>interest set</strong> that lives in the kernel between calls [S46].</li>
  <li><strong><code>epoll_ctl</code></strong> adds or removes one descriptor. Our hundred registrations [S53].</li>
  <li><strong><code>epoll_wait</code></strong> sleeps until a registered descriptor is readable. Our one call [S53].</li>
</ol>

`select` and `poll` hand the kernel the whole list on every call [S46]. `epoll` states it once, which is why Program B's count was a constant.

*Readable* has a precise meaning: a read "without blocking" is possible, because at least one byte is waiting or the writer has closed its end [S47]. It does not say how many bytes.

Note:
You have just read a trace of an API I have not named yet. Here it is, because I want you to be able to say what the three calls are rather than only recognise the shape.

Call one creates the interest set. The set lives in the kernel, and you get a descriptor that names it. That is the structural move: the set survives between calls, so nobody has to re-state it [S46].

Call two adds one descriptor to that set. In our program it ran a hundred times, once per pipe, and then never again [S53]. Registration is paid once however long you then wait.

Call three sleeps. It returns when one of the registered descriptors is readable, or when the timeout expires. In our program it ran once and slept for two seconds [S53].

The difference from select and poll is where the list lives. Those two take the whole list as an argument, every call, and the kernel walks it every time [S46]. epoll keeps the list.

One more word, because it is used loosely. Readable. The manual defines ready precisely: an operation, here a read, could be performed without blocking [S47]. On a pipe that means at least one byte is there, or the writer has closed and a read would return end of file at once. Readable says nothing about how many bytes. That matters on the next slide.

<h2>Level-triggered and edge-triggered</h2>

<p class="lede">One flag. Get it wrong and a connection goes quiet.</p>

<div class="boxes">
<div class="box">
<p class="kicker">Level-triggered — the default</p>
Unread data is reported on every wait. The manual: "a faster <code>poll(2)</code>" [S46].
</div>
<div class="box filled">
<p class="kicker">Edge-triggered — <code>EPOLLET</code></p>
Reports only when something <em>new</em> arrives [S46]. Read 1 kB of a 2 kB arrival and the next wait "will probably hang" [S46].
</div>
</div>

**The rule for `EPOLLET`: every time you are woken, read everything — until `EAGAIN` — because the kernel will not mention the rest again** [S46]. Non-blocking descriptors, or that loop never ends [S46].

Note:
One design choice inside epoll, because you will meet the flag and the wrong guess is expensive.

Level-triggered is the default and it is what our program used. While a descriptor still has unread data, every wait reports it again. The manual's own summary of that mode is reassuring. It calls level-triggered epoll a faster poll, usable wherever poll is used [S46].

Edge-triggered is the other mode, and the man page's own worked example is the bug in miniature. A writer puts two kibibytes in a pipe. Your wait reports the pipe. You read one kibibyte. You wait again, and it probably hangs, with the other kibibyte still sitting there [S46]. The mode reports changes, and nothing changed.

So the rule, and I want you to be able to say it in one sentence. In edge-triggered mode, every time you are woken, you read all of the unread data. You keep calling read until it says EAGAIN, nothing left. Only then do you wait again [S46]. And for that loop to end, the descriptor has to be non-blocking, otherwise the last read blocks instead of returning EAGAIN [S46]. Break the rule and nothing errors. The connection just goes quiet.

<div class="rows">

<div class="row">
<div class="num">1</div>
<div class="term">Polling</div>
<div class="desc">The program asks each descriptor. Our 28,000 failed reads [S53].</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Readiness</div>
<div class="desc">The kernel says "you may read now" [S46]. Our one <code>epoll_pwait</code> [S53].</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Completion</div>
<div class="desc">The program hands over a buffer. The kernel says "I have read for you" [V74].</div>
</div>
</div>

In a trace: many failed reads means **polling**, one sleeping call means **readiness**, no reads at all during the wait means **completion**.

<div class="footnotes">
[S46] epoll(7) — Linux man-pages. https://man7.org/linux/man-pages/man7/epoll.7.html
</div>

Note:
Three ways, and both of our programs were on the first two rungs.

Polling. The program asks. Every descriptor, every round, for as long as it waits. That was twenty-eight thousand reads [S53].

Readiness. The program registers its interest once and then makes one call that sleeps. The kernel wakes it and says you may read now. The program still does the read itself [S46]. That was the epoll program.

Completion. The program hands the kernel a buffer and says read into this. The kernel does the read and reports that it is done. On Windows this is overlapped I O and I O completion ports, and it is the native model there. We run it later in this part, on Windows, traced [S53].

My note frames all three as one question rather than a feature list, and it is the best sentence I have for this. Who gets parked, and where [V69].

Now the practical part, and this is what I want you to be able to do. Look at a trace and tell me the model. Many failed reads means polling. One sleeping call means readiness. No reads at all during the wait, with a completion dequeue instead, means completion. You will see all three today.

And notice when each cost is paid. All of it is paid while nothing is happening.

<h2>Readiness is permission to try, not a promise</h2>

<p class="lede">The word <em>ready</em> sounds like a guarantee. It is not one.</p>

`select(2)`, BUGS: it "may report a socket file descriptor as "ready for reading", while nevertheless a subsequent read blocks" [S47].

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">So use non-blocking mode</div>
<div class="desc">It is "safer to use O_NONBLOCK on sockets when blocking is undesirable" [S47].</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">The model</div>
<div class="desc">"permission to try, not a promise of success" [V58].</div>
</div>
</div>

Ready reports a moment that has passed, on `select` and on `epoll` alike [V92]. A *done*, one rung up.

<div class="footnotes">
[S47] select(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/select.2.html
</div>

Note:
One caveat that catches students and production code equally.

Ready does not mean the read will succeed. The manual page for select says so about itself, in its own bugs section. It may report a socket as ready for reading, and a later read still blocks [S47].

How? Data arrives, the kernel marks the descriptor ready, and then the data is discarded for a checksum error. The report was correct about a moment that has passed.

The consequence is a rule you follow without thinking about it. Put the descriptor in non-blocking mode even in code that has just been told it is ready. The page recommends exactly that, calling it safer when blocking is undesirable [S47]. The same holds for epoll [V92].

My note has the sentence I want you to keep. A readiness notification is permission to try, not a promise of success [V58].

And notice what that is. It is today's thesis again, one rung up the ladder. The kernel said done about its own state at the instant of the call. You read it as done about your next call.

Same word. Different subject. Third time today.

<p class="kicker">Part 7 · Waiting</p>

<h2>The real difference is who owns the buffer</h2>

<p class="lede">Not the API shape. The ownership, and it is why porting between the models is a rewrite.</p>

| | Readiness | Completion |
|---|---|---|
| when you supply the buffer | after you learn the descriptor is ready [V75] | at submission, before any data exists [V74] |
| who owns it while waiting | you — the kernel holds no pointer [V75] | the kernel — you must not touch or free it [V74] |
| one buffer can | be shared across ten thousand connections [V75] | serve one outstanding operation [V74] |

My note calls ownership "the load-bearing row" [V57]. Microsoft's contract: clients "agree not to disturb the buffers in any way until the network has consumed the buffer's contents" [V74].

Note:
If you remember one structural fact from part seven, make it this one.

The two models differ in where the copy happens relative to the notification. Everything else follows from that.

In a readiness model, you supply the buffer after the kernel tells you data is waiting. The kernel holds no pointer into your address space between notifications, so one scratch buffer may be shared across ten thousand connections [V75].

In a completion model, the buffer must exist before the data does [V74]. You need one buffer per outstanding operation [V74]. It belongs to the kernel until the completion packet arrives [V74]. Microsoft's own wording is that clients agree not to disturb the buffers until the network has consumed the contents [V74].

My note calls this the load-bearing row [V57], and I agree with it. Count the consequences. One buffer per outstanding operation, held for the whole wait. Multiply by ten thousand idle connections and you have a memory bill the readiness model does not have.

What completion buys is a genuinely zero-copy path and many reads in flight on one socket.

This is why you cannot port an event loop between the models by changing function names. My note puts it exactly: code written for one model and mechanically ported to the other "is not slow — it is wrong" [V76].

The useful question is not which system a program runs on. It is <span class="neu">which <em>done</em> it is handed</span>.

Note:
I have been saying readiness on Linux and completion on Windows, and I need to correct myself before you write it in an exam.

My own note says it plainly. The readiness and completion split is not a Linux and Windows split [V59]. It is a split in the design space, and the two platforms entered it from different sides.

The control case is BSD and macOS. They classify with epoll: readiness notification, and the application does the I O [V81]. So readiness is not a Linux quirk. It is the Unix family's answer [V59].

And both platforms have since crossed. Linux, which had readiness for thirty years, built a completion interface. Windows has had completion since Windows NT. It built a shared-memory ring instead [V68]. That is a different thing, and I come back to it at the end of this part.

So what should you actually say? Not "Linux does readiness". Say that each platform's native model is the one its libraries and its documentation assume, and that both models exist on both systems now.

The useful question about a program is not which system it runs on. It is which done it is handed. That is the question we started the hour with.

<p class="kicker">Part 7 · Waiting</p>

<h2>Four Windows words before the Windows pair</h2>

<p class="lede">The same two programs, in Windows vocabulary [S53].</p>

<ol>
  <li><strong>Named pipe.</strong> "a named, one-way or duplex pipe for communication between the pipe server and one or more pipe clients" [S72]. A pipe with a name, openable by unrelated processes.</li>
  <li><strong><code>PeekNamedPipe</code>.</strong> Looks without reading: it copies data "without removing it from the pipe" and "always returns immediately" [S73].</li>
  <li><strong>Overlapped <code>ReadFile</code>.</strong> A read that returns before the data exists; the kernel fills your buffer later [V74].</li>
  <li><strong>Completion port, <code>GetQueuedCompletionStatus</code>.</strong> A queue of finished operations; the call takes one, and "If there is no completion packet queued, the function waits" [S74].</li>
</ol>

Note:
Four words, and then the Windows pair reads like the Linux pair.

A named pipe is the Windows pipe you will actually meet. Microsoft defines it as a named, one-way or duplex pipe between a pipe server and one or more clients [S72]. The name is the point: two unrelated processes can both open it by name, where a Linux pipe has to be inherited from a parent. Ours are local and nobody ever writes into them.

PeekNamedPipe is the polling call. It looks into the pipe without taking anything out, and the documentation says it always returns immediately, even when the pipe is empty [S73]. That is the exact counterpart of the non-blocking read on the last slide.

Overlapped ReadFile is a read that does not wait for the data. You give the kernel a buffer and a place to report back, and the call returns at once. The kernel fills the buffer when data arrives, later, while your program does other things. My note puts it precisely: the buffer must exist before the data does, and it belongs to the kernel until the completion arrives [V74].

The completion port is where the kernel reports back. It is a queue of finished operations. GetQueuedCompletionStatus takes one entry off that queue, and if the queue is empty, it waits [S74]. That is the one sleeping call, the twin of epoll_wait.

<h2>What a ring is</h2>

<p class="lede">One word before the last slide of Part 7.</p>

A ring is two queues in memory that your program and the kernel both see: "ring buffers which are shared between user space and kernel space" [S75]. "You place I/O requests you want to make on the SQ, while the kernel places the results of those operations on the CQ" [S75].

Why it matters here: every wait we counted today was a system call. With a ring you queue many requests and cross the boundary once [S75], or, with a kernel-side polling thread, "steady-state I/O submission needs **no syscalls at all**" [V11].

Note:
One more word, because the last slide of this part uses it and I do not want it to sound like magic.

A ring is two queues, sitting in a piece of memory that both your program and the kernel can read and write [S75]. One queue is for requests. You write into it: read this, write that. The other queue is for results. The kernel writes into it: done, here is how many bytes [S75]. Neither side has to make a system call to put something in its queue, because the memory is shared.

Why does that matter after the hour you have just had? Because every wait we counted today was a system call. Twenty-eight thousand of them in one program, one in the other. With a ring you put many requests into the queue and cross into the kernel once to say go [S75]. And in one configuration, with a kernel thread watching the queue, you do not cross at all: my note says steady-state submission needs no syscalls at all [V11].

Keep the two ideas apart. The ring is how requests and results travel. Whether what travels is a readiness report or a completed operation is a separate question, and the next slide is about which platform took which.

Now read the sentence carefully, because the tempting summary is wrong. This is not two platforms converging on the same thing. Linux adopted completion semantics. Windows adopted the shared memory transport [V68]. The ring and the completion model are two separate ideas. They happened to ship together on Linux. Each platform took the half it was missing.

One instruction for this course, and it is in my own note. Teach I O completion ports as current Windows practice, and mention the ring as the direction of travel [V60]. On Linux, epoll is the equivalent present tense.

Note:
Here is the rule, and it is the C library's rule, not the kernel's. Attached to a terminal, standard output is line-buffered. Attached to a pipe or a regular file, it is fully buffered, in blocks [V71].

The library asks the kernel once, at the first write, what kind of thing sits behind the descriptor. If it is a terminal, it switches to line buffering, and from then on every newline pushes a write out. Three lines, three writes [V71].

<p class="kicker">Part 8 · Three destinations</p>

<h2>The same interface is not the same contract</h2>

<p class="lede">Three boundaries on the result.</p>

<div class="gaps">
<div class="gap">
<div class="dot">•</div>
<div class="gap-term">One send is not one receive</div>
<div class="ref">[V70]</div>
<div class="gap-desc">TCP is a byte stream. Marking where a message ends is your job — "the single most common practical bug in student socket code".</div>
</div>
<div class="gap">
<div class="dot">•</div>
<div class="gap-term">A size effect</div>
<div class="ref">[V82]</div>
<div class="gap-desc">"writes of less than <code>PIPE_BUF</code> bytes must be atomic" — 4 KiB here [V67] [V82].</div>
</div>
<div class="gap">
<div class="dot">•</div>
<div class="gap-term">The default is not total</div>
<div class="ref">[V87]</div>
<div class="gap-desc">"a strong default, not a total function" [V65]. <code>lseek</code> on a socket means nothing.</div>
</div>
</div>

Note:
Before you leave with "it is all the same", three ways it is not.

First, and this is the one I expect to cost you a night at some point. One send is not one receive. TCP is a byte stream. You write fourteen bytes and the reader may get four then ten, or may get yours glued to the next message. Marking where one message ends is called framing. It is your job rather than the kernel's. My note calls it the single most common practical bug in student socket code [V70].

Which means our beautiful one-write-one-read result is partly a size effect. Fourteen bytes fits in anything.

Second, the same is true of the pipe. POSIX says writes below PIPE BUF must be atomic [V67], and that threshold is four kibibytes on Linux [V82]. Above it, two writers' records can be shredded into each other [V82]. Our fourteen bytes were never going to show that.

Third. Everything is a file is a strong default, not a total function [V65]. Seek on a socket is meaningless, and the kernel marks sockets to skip the file-position locking they cannot use [V87].

So the accurate takeaway is the interface is shared and the contract behind it is not. The calls transfer. The assumptions do not.

Here is the situation, and you have all met it. You are writing a record to a log, or a frame to a socket. In your program it is three separate things: a header you built, a body you were given, and a trailer. In the file it has to be one message, in that order, and nobody else's line may land in the middle of it.

The obvious way is three write calls. The other obvious way is to glue the three into one buffer first and make one write call.

Question one: how many system calls. Three, one, or zero.

Question two, and this is the one I actually want. How many times does anything copy those three buffers to make it happen? Count the copies you would have to do in your own program, and the copies the kernel would have to do.

Write both numbers. I am asking separately because crossings and copies are two different costs, and almost every explanation of this topic runs them together.

Thirty seconds.

<p class="kicker">Part 9 · Zero-copy</p>

<h2>Observe: three lines become one</h2>

```text
== three write() calls
write(3, "HEADER  ", 8)                         = 8
write(3, "body body body body body body bo"..., 40) = 40
write(3, " TRAILER\n", 9)                       = 9

== one writev() call  (wrapped to fit)
writev(3, [{iov_base="HEADER  ", iov_len=8},
           {iov_base="body body body body body body bo"..., iov_len=40},
           {iov_base=" TRAILER\n", iov_len=9}], 3) = 57
```

Three crossings became <span class="pos">one</span>, and the return value is the whole message: 57 bytes [S56]. The three buffers never moved in the program.

[S56] demo/scatter/README.md — <code>strace -e trace=write,writev</code>, 2026-09-20. https://ondrasek.github.io/talks/2026-09-22-pb158-lecture-3-finishing-io-and-advanced-io/demo/scatter/README.md

Note:
Read the top block first. Three write calls, three crossings, and you have read lines exactly like these for two lectures now.

Now the bottom block. One call. The array inside the brackets is the argument: three entries, each with a base address and a length. That structure has a name, iovec, and its two fields are iov_base and iov_len — you are reading them on the screen. Three entries, and the count three after the closing bracket.

The return value is fifty-seven. Not eight. The call reports the whole message.

So question one is answered: one call, not three. The kernel gathered the three buffers for you, in order, in one crossing.

Now question two, and this is where I want you to check your own answer. How many copies did the program do to make that happen? None. The three buffers stayed exactly where they were and the kernel read them in order [S56].

But be careful with the word none, because the three-write version also copied nothing in the program. Writev did not save you a copy. It saved you two crossings. That is the next slide.

<p class="kicker">Part 9 · Zero-copy</p>

<h2>Gather buys crossings, not copies</h2>

<p class="lede">The distinction the name hides, and your second answer.</p>

<div class="boxes">
<div class="box">
<p class="kicker">What <code>writev</code> removes</p>
Two of the three user-to-kernel crossings, plus the staging buffer you would glue the pieces into [S58].
</div>
<div class="box filled">
<p class="kicker">What it does not remove</p>
Any copy the kernel makes further down. The four levels underneath are unchanged [S56].
</div>
</div>

`readv` is the mirror: one crossing *scatters* into several buffers [S58]. Valkey's reply path gathers framing, a stored string and a terminator into three `iovec` entries, then sends them with one `writev` [S65].

<div class="footnotes">
[S58] writev(2) — Linux man-pages. https://man7.org/linux/man-pages/man2/writev.2.html
[S56] demo/scatter/README.md, 2026-09-20. https://ondrasek.github.io/talks/2026-09-22-pb158-lecture-3-finishing-io-and-advanced-io/demo/scatter/README.md

</div>

Note:
This is the slide that separates the two answers, and it is the reason I asked for two numbers.

Writev removes crossings. Three became one. That is a real saving and it is the whole of what the call buys you.

Writev does not remove a copy. If you had written three write calls, nothing in your program would have copied either. What writev spares you is the other design: glue the header, body and trailer into one new buffer and write that. That version really does copy, and it copies for no reason except the shape of write. Removing that staging buffer is the honest way to state the win.

Below the crossing, nothing changes. The same four levels you drew this morning sit underneath a writev exactly as they sit under a write.

Readv is the same idea on the read side. One crossing, and the kernel scatters the bytes into several of your buffers instead of one [S58].

And the use I want you to remember is the boring one. Valkey's source reserves exactly three iovec entries for one reply element [S65]. They are the length prefix, the stored string itself, and the two-byte terminator. The comment in the code says why: use writev to save system calls and TCP packets [S65]. Not a headline optimisation. The removal of a buffer that only existed to satisfy the shape of an API.

<p class="kicker">Part 9 · Zero-copy</p>

<h2>Two promises, and only one of them is unconditional</h2>

<p class="lede"><em>Atomic</em> means one thing: your bytes land as one unbroken block, with nobody else's write in the middle [S58].</p>

<ol>
  <li><strong>On a regular file</strong> the promise is unconditional: "written as a single block that is not intermingled with output from writes in other processes" [S58]. A log line written with one <code>writev</code> stays whole.</li>
  <li><strong>On a pipe</strong> it holds only below <code>PIPE_BUF</code>, 4096 bytes. Above that the kernel "may interleave the data" with another writer's [S59].</li>
  <li><strong>The trap:</strong> the limit applies to the <em>sum</em> of your buffers, not the largest. Eight 1 KiB pieces are 8 KiB, and may interleave.</li>
</ol>

Note:
I nearly put "writev is atomic" on the previous slide, and it would have been half right in the half that matters least to you. First the word, because it is used loosely. Atomic here means your bytes arrive as one unbroken block. Nobody else's write can land in the middle of yours.

On a regular file that promise is unconditional. The data goes in as a single block, not intermingled with writes from other processes [S58]. That is why a log line written with one writev stays whole, however many processes write to the same log.

On a pipe or a socket the rule is different, and it is the rule you met in part eight. Writes below PIPE_BUF must be atomic. Above it the kernel may interleave your data with another writer's [S59]. On Linux PIPE_BUF is four thousand and ninety-six bytes.

And the trap. The limit is on the total, not on the largest piece. Eight one-kibibyte buffers in one writev are eight kibibytes, twice the limit. Two processes doing that into the same pipe can interleave, and each of them checked its own biggest piece and thought it was safe.

The copies are the number I care about. In the loop, every chunk crosses into your process, sits in a buffer you never read, and crosses back out. Two copies, four mebibytes each way, to move bytes you never inspected. Sendfile hands the kernel a source, a destination and a length, and the bytes go from the page cache into the pipe [S56].

The tell in the trace is what is not there. No read lines. Part seven had the same shape on the completion side: the evidence for a mechanism that removes work is an absence, not a presence.

And the number I am deliberately not selling you. Two point six milliseconds against two point zero, on one machine, once. That difference would not survive a second run's noise and I am not claiming it [S56]. The claim is the copies avoided and the calls halved. Those are counted, not timed.

<p class="kicker">Part 9 · Zero-copy</p>

<h2>What the name does not cover</h2>

<p class="lede">It counts the copies it removes at one boundary. No others.</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Direct memory access stays</div>
<div class="desc">The bytes still move. The CPU no longer carries them [S60].</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">It needs the page cache</div>
<div class="desc">Level 3 is not bypassed. Handing out its pages <em>is</em> the mechanism.</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">It buys no durability</div>
<div class="desc">The same four levels sit below [S67].</div>
</div>
<div class="row">
<div class="num">4</div>
<div class="term">It cannot help you look</div>
<div class="desc">Encrypt them and the process must hold them [S60].</div>
</div>
</div>

<div class="footnotes">
[S60] sendfile(2). https://man7.org/linux/man-pages/man2/sendfile.2.html
[S67] fsync(2). https://man7.org/linux/man-pages/man2/fsync.2.html
</div>

Note:
Today's thesis applied to a word rather than to a return value. That is the reason this part is in the lecture at all.

Zero-copy counts copies across one boundary: into and out of your address space. It says nothing about the others.

The two transfers at the ends remain. The disk still moves bytes into memory and the device still takes them out. What the call removed is the CPU carrying them through your program in between.

The page cache is not bypassed. It is required. Sendfile works precisely by handing the destination references to pages the kernel already has. A file with no cached pages has nothing to reference. Here is the part worth carrying. The two most famous ways to make file I/O fast, sendfile and direct I/O, cancel each other. nginx encodes exactly that in its configuration — enabling directio automatically disables sendfile for that request [S61].

It does nothing for durability. The four levels are unchanged and a sendfile that returned is a handoff like every other done today.

And the precondition, which is the honest limit. Zero-copy moves bytes the kernel already has to somewhere else the kernel controls. The moment your program has to compress, encrypt or template the bytes, it must hold them, and there is nothing left to remove [S60].

<p class="kicker">Part 9 · Zero-copy</p>

<h2>Zero-copy moves bytes faster. It does not make them safer.</h2>

<p class="lede">Fewer copies changes <em>who</em> copies, not <em>when the bytes are safe</em>.</p>

<ol>
  <li><strong>To a file.</strong> <code>sendfile</code> copies "within the kernel" [S60], into the page cache. Nothing is on the device until <code>fsync()</code> [S67].</li>
  <li><strong>To a socket.</strong> The return counts bytes the kernel accepted, not delivered: "No indication of failure to deliver is implicit in a send()" [S50].</li>
  <li><strong>One new duty.</strong> The kernel may still be reading <em>your</em> pages after the call returns: keep the file "unmodified until the reader on the other end of out_fd has consumed the transferred data" [S60].</li>
</ol>

*Done* still means *accepted* [V44].

Note:
Before you leave this part thinking zero-copy is a free upgrade, one slide on what it does not change: durability.

Zero-copy changes who does the copying, and how many times. It does not move the point at which the bytes are safe. Run it against the stack you drew this morning.

To a file. sendfile copies inside the kernel [S60], and where do the bytes land? In the page cache. Level three. Everything Part 6 told you still applies. The kernel's done is not the device's done, and nothing is on the medium until you fsync [S67].

To a socket. The return value counts the bytes the kernel accepted into its send buffer. It does not count bytes that reached the other machine. The manual for send says it flatly: no indication of failure to deliver is implicit in a send [S50].

And one thing zero-copy adds rather than removes. Because the kernel did not copy your data, it may still be reading your pages after the call has returned. The manual tells you to leave the transferred part of the file unmodified until the reader on the other end has consumed it [S60]. A copy would have freed you from that. Zero-copy does not.

So the sentence to take away is the one this whole lecture has been saying. Done means accepted by the next layer [V44]. Zero-copy makes the acceptance cheaper. It does not make it mean more.

<div class="footnotes">
[S62] WriteFileGather — Microsoft Learn. https://learn.microsoft.com/en-us/windows/win32/api/fileapi/nf-fileapi-writefilegather
[S63] TransmitFile — Microsoft Learn. https://learn.microsoft.com/en-us/windows/win32/api/mswsock/nf-mswsock-transmitfile

Note:
No Windows capture in this part, and I say so plainly: for part nine, Windows is documentation. Parts six, seven and eight each had a traced Windows pair. This one does not, and you should weigh it accordingly.

The names first. For sockets the true counterpart of writev is WSASend. It takes an array of WSABUF structures, each one a pointer and a length. The page says it allows multiple send buffers, which makes it applicable to the scatter gather type of I O [S69]. For files there is WriteFileGather. It is not the same tool wearing another name. Every buffer must be at least a system page, and page-aligned. The handle needs the flags FILE_FLAG_OVERLAPPED and FILE_FLAG_NO_BUFFERING, so it is an overlapped handle with no cache behind it [S62]. That is a database primitive, not a general one. If you take away only one comparison, take WSASend.

TransmitFile is the zero-copy call, a file onto a socket without the round trip through your program [S63].

Now the part I most want the Windows users in the room to have, because it is a trap with your name on it. Python's socket.sendfile uses the real system call where it exists. Where it does not — Windows — it quietly uses send instead, and the documentation says so in those words: a less efficient fallback [S64]. No error. No warning. The same line of Python.

So a student who runs sock.sendfile on Windows, measures it, and concludes that zero-copy does nothing has measured the fallback. That is the abstraction being honest about its interface and silent about its mechanism, which is the whole subject of this course. If you do that experiment this week, check which call you actually made before you believe the number.

Note:
Last slide, and it is a question rather than an answer. Same as last week.

Today you watched your bytes sit somewhere for five seconds [S52]. I called it the page cache and you accepted it, because you had to.

And if we reached part nine, you watched the kernel move four mebibytes out of that same place into a pipe [S56]. Your program never held them. Sendfile works by handing out references to those pages. So the thing you have now met twice, from two directions, is still a name rather than an object.

So. What is that memory? Whose is it? If I ask the operating system how much free memory this machine has, does the page cache count as free or as used?

That question is harder than it sounds, and the reason is one sentence from my own note. Physical memory is a cache, not a container [V72]. So free RAM is mostly a bookkeeping category rather than a resource going to waste.

Lecture 4 is that, and memory mapping with it.

And if the clock beat us today, Lecture 4 opens on the slide that said Lecture 4 starts here. We do waiting and sockets first. Nothing is lost.
