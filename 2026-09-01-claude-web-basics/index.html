Note:

Conclusions before the argument. If you catch one slide, this one.

One: before every prompt, ask whether you are short of wording or short of facts. Wording you fix in the prompt. Facts you fix by giving Claude the document — that is what a project is for.

Two: telling Claude it is an expert does not make it more correct. Wharton tested that across six models on two benchmarks: no significant positive difference on accuracy [S1].

Three: let Claude ask questions, then put every answer in one message. Two hundred thousand simulated conversations measured a thirty-nine percent drop in average performance when the same information arrived spread across turns instead of in one message [S2].

Four: one check between the draft and the send button, every time, because Claude gives no signal when it is wrong [S10].

<p class="kicker">Part I · Habits</p>

<h2>One question before every prompt: short of wording, or short of facts?</h2>
<div class="compare">
<div class="side-a">
<div class="k">Short of wording</div>
<div class="v">True, but reads wrong — too long, too formal, wrong reader. Fix it in the prompt.</div>
</div>
<div class="side-b">
<div class="k">Short of facts</div>
<div class="v">Fluent and wrong, because Claude never had our pricing, our positioning, our customer. Fix it with a document.</div>
</div>
</div>

No wording adds a fact Claude was never given — my framing, not a measurement. Anthropic's own guidance is "the smallest possible set of high-signal tokens" [S8] — the fewest words that carry the most information. So when the answer is wrong on facts, the fix is a document you upload, not a better-worded prompt.

<div class="footnotes">
[S8] <span class="src-title">Effective context engineering</span> — Anthropic. https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
</div>

Note:

Every disappointing answer is one of two failures. Either the content is right and the writing is wrong — too long, too stiff, wrong reader. That is wording, and you fix it by changing how you ask.

Or the writing is lovely and the content is wrong, because Claude was never given our price list or our positioning. No amount of rewording touches that. Claude cannot select a fact it was never given — my framing of the two failures, not something a source here measured.

Anthropic's guidance is the smallest set of high-signal information that gets the outcome [S8]. Smallest matters.

So: wording, or facts. The habits are the wording half. Projects are the facts half.

<p class="kicker">Part I · Habits</p>

<h2>Habit 1 — brief Claude the way you brief a new colleague</h2>
<p class="lede">Anthropic: "a brilliant but new employee who lacks context on your norms and workflows" [S3] — capable, and holding no facts about us.</p>

Anthropic's test costs nothing: give the prompt to a colleague who does not know the task [S3]. Whatever they would have to ask you is what the prompt is missing.

<div class="kv">
<div class="pair">
<div class="k">Who reads it</div>
<div class="v">A procurement manager who has never bought from us</div>
</div>
<div class="pair">
<div class="k">What it is for</div>
<div class="v">A reply that wins a meeting, not a sale</div>
</div>
<div class="pair">
<div class="k">What to avoid</div>
<div class="v">No pricing, no dates</div>
</div>
</div>

<div class="footnotes">
[S3] <span class="src-title">Be clear and direct</span> — Anthropic. https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/be-clear-and-direct
</div>

Note:

Habit one needs no new vocabulary, because you already do it. You brief people all the time.

Anthropic's own words: a brilliant but new employee who lacks context on your norms and workflows [S3].

Their test costs nothing. Give the prompt to a colleague who does not know the task and ask them to follow it [S3]. Whatever that person has to ask you is exactly what the prompt left out.

So three things go into almost every prompt: who reads it, what it must achieve, and what must not be in it. Everybody skips the third, and it is the one that keeps a delivery date out of a draft.

<p class="kicker">Part I · Habits</p>

<h2>Habit 2 — "act as an expert" does not make Claude more correct</h2>
<p class="lede">Role prompting is naming a role in the prompt — "act as a senior engineer", or in Wharton's words an "expert persona" [S1].</p>

<div class="stats">
<div>
<div class="stat"><span class="neu">no significant</span></div>
<div class="stat-cap">accuracy gain from role prompting — six models, two standard exams (GPQA Diamond, MMLU-Pro) [S1]</div>
</div>
</div>

Wharton fixed its analysis in advance and reported "no significant positive differences" against prompts carrying no role at all [S1]. So telling Claude it is a senior engineer does not make it more correct about engineering. What it moves is the wording — measured on the next slide.

<div class="footnotes">
[S1] <span class="src-title">Playing Pretend</span> — Wharton GAIL (2025). https://gail.wharton.upenn.edu/research-and-insights/playing-pretend-expert-personas/
</div>

Note:

This is the habit most of you have, and I want to correct it rather than remove it.

Wharton tested six models on two standard knowledge tests, role prompting against none — expert personas is their word for it — with the analysis fixed in advance, so the result could not be chosen after the fact. No significant positive difference in accuracy [S1] — significant meaning the difference could not be told apart from chance. Telling Claude it is a senior engineer does not make it right about engineering.

<p class="kicker">Part I · Habits</p>

<h2>What adding a role changed: rated depth up, rated clarity down, no overall gain</h2>
<p class="lede">Another AI model scored the answers to 1,140 questions [V1].</p>

<div class="stats">
<div>
<div class="stat"><span class="pos">sounds more expert</span></div>
<div class="stat-cap">expertise depth 3.638 → 3.923, Cohen's d = 0.54 [V1]</div>
</div>
<div>
<div class="stat"><span class="neg">reads less clearly</span></div>
<div class="stat-cap">clarity 4.896 → 4.550, p &lt; 0.001 [V1]</div>
</div>
</div>

No overall gain: the two effects roughly cancelled [V1]. My note gives no rating scale: read direction, not size. The study picked the role automatically; you type yours [V1]. That the trade survives typing is my judgement. Use role prompting for wording, never for accuracy.

<div class="footnotes">
[V1] <span class="src-title">Role Prompting</span> — author's notes.
</div>

Note:

Role prompting does move something, and here I have to be careful about what was actually measured. In a study of eleven hundred and forty questions across thirty-eight expert roles, another AI model did the scoring: rated expertise depth rose from three point six four to three point nine two, an effect size of nought point five four, which is moderate; rated clarity fell from four point nine oh to four point five five. Both differences at p below nought point nought nought one [V1]. And the limit, which my own appendix carries: in aggregate the two effects roughly cancelled, with no significant overall difference from answers written with no role at all [V1].

The technique it tested was hybrid role retrieval — the study picked a role for each question automatically — not you typing act as an expert [V1]. That the same trade survives when you type the role is my judgement.

I am not going to tell you the clarity loss outweighs the depth gain, because the two ratings sit on different scales and the study reports an effect size for only one of them. What I will say is that the one measured style effect includes a clarity cost, and for most of you clarity is the product.

<p class="kicker">Part I · Habits</p>

<h2>Habit 3 — let Claude ask, then restate everything in one message</h2>
<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Ask for the questions</div>
<div class="desc">"Before you write anything, ask me the five questions you need answered."</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Answer in one message</div>
<div class="desc">Not five replies across five turns</div>
</div>
</div>

Why the second move matters: across more than 200,000 simulated conversations, the same information delivered across turns rather than in one prompt cost an "average performance drop of 39%", and an early wrong turn was not recovered from later in the conversation [S2].

<div class="footnotes">
[S2] <span class="src-title">LLMs Get Lost In Multi-Turn Conversation</span> — Laban et al. (2025), arXiv:2505.06120. https://arxiv.org/abs/2505.06120
</div>

Note:

You do not need a perfect prompt from a standing start. Ask for the questions: before you write anything, ask me the five questions you need answered.

But there is a second move, and dropping it makes the habit worse than not using it. Once you have the questions, answer them in a single message. Not one reply per question over five turns.

Laban and colleagues simulated over two hundred thousand conversations. Spread across turns, average performance dropped thirty-nine percent, and an early wrong turn was not recovered from later [S2].

That is a preprint with simulated conversations, so treat the number as a direction.

<p class="kicker">Part I · Habits</p>

<h2>Habit 4 — one deliberate check between the draft and the send button</h2>
<p class="lede">Claude produces a true sentence and a hallucination by the same mechanism [S10] — nothing signals a wrong answer. Check the costliest fact.</p>

<ul>
  <li>Read the number off the source page, not from Claude.</li>
  <li>Ask the person who owns the fact, not Claude.</li>
  <li>Delete any sentence you cannot trace to a page or person.</li>
</ul>

MIT Sloan, 140 Accenture professionals: the heaviest colour-coding of the output caught more errors and omissions but took longer; medium balanced the two [S11]. One check, not a review board.

<div class="footnotes">
[S10] <span class="src-title">AI hallucinations</span> — IBM. https://www.ibm.com/think/topics/ai-hallucinations
[S11] <span class="src-title">Add speed bumps</span> — MIT Sloan. https://mitsloan.mit.edu/ideas-made-to-matter/to-help-improve-accuracy-generative-ai-add-speed-bumps
</div>

Note:

This is the habit I would keep if I had to cut the other three.

The mechanism, in one sentence. IBM: a language model has no way to distinguish a hallucination from the correct answer, because in both cases, in their words, it "makes up" the answer by guessing the next word [S10]. A confident tone tells you nothing.

So the check comes from outside, and it has to be small enough that you do it. Take the fact that would cost most if wrong — the price, the certification, the deadline — and confirm it from the source. Not from Claude in a fresh chat, which is the same mechanism twice.

MIT Sloan ran a field experiment with a hundred and forty Accenture research professionals. The friction was highlighting that colour-codes the output, so you have to process it rather than accept it. The heaviest highlighting caught more errors and omissions but took longer to finish, and the medium condition is the one they report as balancing detection against time [S11]. So one check, on one fact — not a review board.

So I am handing you a risk I can only half evidence. The overconfidence half is measured [S13]; that your output rises this month is my expectation, not a finding. That is not a reason to skip the training — it is why habit four is a takeaway rather than a footnote.

In a 7,000-person rollout, "people were working inside a Claude Project when what they actually needed was a Skill" [S22]. Read from inside, the wrong surface looks like a tool that cannot do the job.

[S4] <span class="src-title">What are Projects?</span> — Anthropic. https://support.claude.com/en/articles/9517075-what-are-projects

The first shared project is a prompt helper. Describe the job in ordinary language and it writes the structured prompt habit one asks for. What comes back is a draft prompt you paste into a fresh chat, not the finished piece of work.

The important thing is knowing when to reach for it. Reach for it when you know what you want and cannot get Claude to produce it. Not when the answer comes back factually wrong, because better wording does not supply a missing fact.

That distinction is worth labouring — a Skill, in that quote, is the third personalization place, and we get to it two slides from now. Deel rolled Claude out to seven thousand people and reported staff sitting inside one feature trying to make it do another's job [S22]. From where you sit it feels like Claude cannot do the thing. It can — you are in the wrong place.

<p class="kicker">Part II · Projects</p>

<h2>Personalization is three separate places, not one switch</h2>
<p class="lede">Anthropic's page names three, differing by how far each reaches: Instructions for Claude, Project instructions, Skills [S5].</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Instructions for Claude</div>
<div class="desc">Account-wide: "applied to all of your conversations" [S5]</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Project instructions</div>
<div class="desc">Only "apply to chats within that project" [S5]</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Skills</div>
<div class="desc">Format and tone: "how Claude formats and delivers" [S5]</div>
</div>
</div>

Put a preference at the widest place where it is always true, never wider. A tone rule for one campaign, set account-wide, follows you into unrelated chats.

<div class="footnotes">
[S5] <span class="src-title">Personalization features</span> — Anthropic Help Center. https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features
</div>

Note:

If you go looking for a switch labelled personalization, you will not find one. Let me save you the ten minutes.

Anthropic's page has three sections, and they differ by how far each one reaches. Instructions for Claude you set once: click your initials in the lower left, then Settings — and anything you put there is applied to all of your conversations [S5]. Project instructions sit inside one project and only apply to chats within it [S5]. Skills are the third, and the page describes them by what they do rather than by where they live: they "add specific behaviors or capabilities to your conversations with Claude", and the page tells you to use them when you want to customize how Claude formats and delivers its responses [S5]. Formatting and tone, in other words — for most of you the first two are the ones that matter today.

One naming trap, and it is the vendor's rather than yours: the same page's summary calls the first one profile instructions, while its heading and the settings screen both say Instructions for Claude [S5]. Same setting, two names — go by the label on the screen, and do not spend five minutes hunting for a section called profile.

The rule is the one you use for company policy versus team norm versus today's brief. Put a preference at the widest place where it is always true, never wider. Always write in plain English — that is you, so Instructions for Claude. Never mention pricing in this campaign — that is one project. Put the second one account-wide and it follows you into a chat about holiday planning.

<h2>Shared project 2 — Personalization: set one preference, prove it changed something</h2>
<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Open Personalization</div>
<div class="desc">All three places: Instructions for Claude, Project instructions, Skills [S5]</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Write one line</div>
<div class="desc">"Plain English, under 150 words, no bullets unless I ask."</div>
</div>

<div class="desc">Re-ask yesterday's question and read the difference</div>
</div>

If the answer does not change, check scope [S5]: Instructions for Claude applies to all your conversations, Project instructions only to chats in that project, Skills to how a reply is formatted and delivered. Thirty seconds, instead of assuming it works.

<div class="footnotes">
[S5] <span class="src-title">Personalization features</span> — Anthropic Help Center. https://support.claude.com/en/articles/10185728-understanding-claude-s-personalization-features
</div>

Note:

The second shared project walks you through all three places — Instructions for Claude, Project instructions, Skills — so you do not have to remember which is which.

Do one thing today, not five. Write one line. Mine would be: plain English, under a hundred and fifty words, no bullet points unless I ask — my own line, not one any source recommends. Yours will differ and it does not matter what it is.

Then test it within thirty seconds. Take a question you asked yesterday, ask it again, read the difference. If the answer looks identical, the likeliest cause is scope: the line went into Project instructions or Skills when the chat needed it in Instructions for Claude, or the other way round [S5]. Pick a question whose answer would visibly change, or you will not be able to tell either way.

<p class="kicker">Part II · Projects</p>

<h2>What not to put in a shared project</h2>
<p class="lede">A shared project's instructions and documents are "visible to everyone with access" [S19].</p>

<div class="compare">
<div class="side-a">
<div class="k">Fine to upload</div>
<div class="v">Published material, product pages, the tone-of-voice guide, an approved case study.</div>
</div>
<div class="side-b">
<div class="k">Not in a shared project</div>
<div class="v">A customer contract, a quotation, a named complaint.</div>
</div>
</div>

Two more hazards: two people editing one project "will overwrite each other" [S19], and stale files never announce themselves [S20]. If you are not certain your organisation's data policy covers customer material in Claude, ask before the exercise.

<div class="footnotes">
[S19] <span class="src-title">Claude Projects tutorial</span> — EnterpriseDNA. https://enterprisedna.co/resources/guides/guide-claude-projects-tutorial
[S20] <span class="src-title">Claude Projects for teams</span> — OpenClawReady. https://openclawready.com/blog/claude-projects-for-teams
</div>

Note:

This slide before anybody opens a keyboard, because the first thing that happens after a session like this is somebody dropping a customer contract into a shared project.

Here is the distinction nobody asks out loud. Your conversations stay yours. The files and instructions do not — they are visible to everyone the project is shared with [S19]. The chat is private and the knowledge is not, which is the wrong way round from how it feels.

My test: would I send this file to everyone on that distribution list? If not, it does not go in.

Two more. Two people editing the same project overwrite each other — there is no merge [S19]. And stale files never announce themselves [S20].

Check your own plan before promising a colleague access [S4].

<div class="footnotes">
[S4] <span class="src-title">What are Projects?</span> — Anthropic Help Center. https://support.claude.com/en/articles/9517075-what-are-projects
[S6] <span class="src-title">Upload files to Claude</span> — Anthropic Help Center. https://support.claude.com/en/articles/8241126-upload-files-to-claude
</div>

Note:

Four steps, three minutes.

Create the project and name it after a job you do repeatedly rather than a topic: replies to inbound enquiries, not sales. Nothing in the documentation says to do that — it is my practice, because one set of instructions and files can only be right for one repeating job.

Paste that background paragraph in as the instructions. You already wrote it several times this week.

Upload two or three documents, not twenty — next slide is why. The project-file limit is thirty megabytes, different from the chat upload limit on the same page [S6]. If a file bounces, check that first.

Then share it. One caution: Anthropic says sharing is Team and Enterprise plans only, with two permission levels [S4]. Check what your account has before you promise anyone access.

<p class="kicker">Part III · Your own</p>

<h2>Instructions describe behaviour; documents carry the content</h2>
<p class="lede">"Write instructions that describe behavior, not content" — a Q3 strategy summary is content, so it is a document [S19].</p>

Why that is not cosmetic: as your project knowledge approaches how much text Claude can read at one go, the project stops loading everything and starts searching instead [S7]. Nothing on screen announces the switch.

Anthropic's guidance is the smallest possible set of high-signal information [S8]. So more documents is not more accurate answers: replace a superseded document rather than leaving it beside the new one.

<div class="footnotes">
[S7] <span class="src-title">RAG for projects</span> — Anthropic Help Center. https://support.claude.com/en/articles/11473015-retrieval-augmented-generation-rag-for-projects
[S19] <span class="src-title">Claude Projects tutorial</span> — EnterpriseDNA. https://enterprisedna.co/resources/guides/guide-claude-projects-tutorial
</div>

Note:

The rule: instructions describe behaviour, documents carry content [S19]. Never quote a delivery date — behaviour, so instructions. Here is our Q3 positioning — content, so a document. People invert this constantly, because pasting content into an instructions box feels like configuring.

Now the reason. There is a limit to how much text Claude can read at one go. As your uploaded files get close to it, Anthropic changes what the project does: instead of reading everything you uploaded, it searches your files and reads back the parts it finds. Their name for that is RAG mode — retrieval-augmented generation — and their docs say it expands capacity by up to ten times and needs no setup from you [S7]. That is the problem: I have seen nothing on screen that says it happened.

So resist uploading everything. Anthropic's own guidance is the smallest set of high-signal material that gets the outcome [S8]. More documents is therefore not more accurate answers: when a document is superseded, replace it rather than leaving both in.

<p class="kicker">Part III · Your own</p>

<h2>Starting from a slide template — and the file type that will stop you</h2>
<div class="kv">
<div class="pair">
<div class="k">Accepted</div>
<div class="v">"PDF, DOCX, CSV, TXT, HTML, ODT, RTF, EPUB, JSON, XLSX" [S6]</div>
</div>
<div class="pair">
<div class="k">Not on that list</div>
<div class="v">PPTX. The template file itself will not upload</div>
</div>
<div class="pair">
<div class="k">Instead</div>
<div class="v">Export the template to PDF, or type the slide structure into the instructions</div>
</div>
</div>

What comes back is the words for each slide against your standing structure. You still assemble the branded file in PowerPoint, which is fine: the writing is the part that took the time.

<div class="footnotes">
[S6] <span class="src-title">Upload files to Claude</span> — Anthropic Help Center. https://support.claude.com/en/articles/8241126-upload-files-to-claude
</div>

Note:

This is the one I would have got wrong live, so let me save you two minutes.

The idea is good. You have a template you use for every customer presentation. Turn it into a project and slide prep stops starting from nothing.

The obvious first move is to upload the PowerPoint file. Anthropic's supported list is PDF, DOCX, CSV, text, HTML, ODT, RTF, EPUB, JSON and XLSX [S6]. PPTX is not on it, so that upload fails, and it fails in front of you.

Two ways round. Export the template to PDF. Or type the structure into the instructions — slide one the problem, slide two our approach, slide three the evidence. The second is often better: a fixed sequence is behaviour.

Use your own work, not mine: employees "can't transfer a generic demo onto their actual Tuesday" [S18]. For novices, van Gog and colleagues predicted worked examples produce lower cognitive load and better learning than problem-solving alone [S21].

<div class="footnotes">
[S18] <span class="src-title">Enterprise Claude adoption</span> — Correlation One. https://www.correlation-one.com/blog/enterprise-claude-adoption-7-real-problems-and-the-solutions-that-worked
[S21] <span class="src-title">Worked examples</span> — van Gog et al. https://www.sciencedirect.com/science/article/abs/pii/S0361476X1000055X
</div>

Note:

Eight minutes. One of these three, not all of them.

Rewrite a real prompt you sent this week, adding the reader, the purpose and what to avoid. Or set one preference and test it against yesterday's question. Or create one project and paste that paragraph into it.

One condition, and it is why this block exists: use your own work. Correlation One found people could not transfer a generic demo onto their actual Tuesday [S18]. If your own Tuesday is a customer email, strip the customer out of it first — the previous slide is why.

And the order matters, which is why I demonstrated before asking. For novices, the research predicts that studying a worked example first leads to better outcomes than attempting first [S21]. You have seen four. Go.

<p class="kicker">Part IV</p>

<h2>Takeaways — what survives to next Tuesday</h2>
<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Wording or facts</div>
<div class="desc">Before every prompt</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Role prompting</div>
<div class="desc">No accuracy gain [S1]; wording only</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Ask, then one message</div>
<div class="desc">Consolidate; do not dribble [S2]</div>
</div>
<div class="row">
<div class="num">4</div>
<div class="term">One check step, every draft</div>
<div class="desc">Nothing signals a wrong answer [S10]</div>
</div>
<div class="row">
<div class="num">5</div>
<div class="term">An owner and a review date</div>
<div class="desc">In the project instructions</div>
</div>
</div>

One practitioner: unowned projects answer from stale files [S20].

<div class="footnotes">
[S10] <span class="src-title">AI hallucinations</span> — IBM. https://www.ibm.com/think/topics/ai-hallucinations
[S20] <span class="src-title">Claude Projects for teams</span> — OpenClawReady. https://openclawready.com/blog/claude-projects-for-teams
</div>

Note:

Five things, and the fifth decides whether any of this still works in six months.

Wording or facts, before every prompt. No significant accuracy gain from role prompting, across six models [S1] — so role prompting for wording, never for accuracy. Let Claude ask, then answer in one message [S2]. One check step on every draft, on the fact that would cost most [S10].

And if you build a project anyone else will use, put your name and a review date in it [S20]. One quarter is my default, because a price list or a certification can go stale inside one. Three million custom assistants were built on the last generation of this idea, and about a hundred and fifty-nine thousand are still listed publicly. Nothing measured why. The one thing a practitioner write-up points at is whether somebody owned it [S20].

If you want to read further, the field calls this prompt engineering — the systematic survey of it reviewed 1,565 papers and catalogues 58 text-based techniques [S23]. That is the phrase to search.

        (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Offline caching unavailable:', err);
        });
      });
    }
  </script>
</body>
