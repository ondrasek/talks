<p class="kicker">The claim</p>

<h2>Reliability is engineered, not prompted</h2>
<p class="lede">Two mechanisms, and neither is a prompt.</p>

<ul>
  <li><strong>External grounding</strong> — a check that can still fail the work when the generator is wrong. A model approving its own output cannot: its errors correlate with the ones that produced the answer — the shared blind spot. [V3]</li>
  <li><strong>Bounded autonomy</strong> — a prompt is advisory: tool output can override it. A credential or gateway rule runs after the model and refuses the emitted call, so deny irreversible actions there. [V32]</li>
</ul>

<div class="footnotes">
[V3] <span class="src-title">Loop Engineering and Self-Verification</span> — vault report (2026).
[V32] <span class="src-title">Harness Engineering — Tool Permissions</span> — vault report (2026).
</div>

Note:
Here is the whole argument, so you know what you came to disagree with. First mechanism: external grounding. A check tells you something only if it can fail the work when the generator is wrong, and a model asked to approve its own output cannot — it shares every blind spot that produced the answer. [V3] So the load-bearing variable is not iteration count; it is whether the check can come back negative. [V3] Second mechanism: bounded autonomy. A prompt instruction is advisory — for an agent reading tool output, almost any turn brings text that overrides it. A credential scope or an API gateway rule is evaluated after the model, so it refuses the emitted call whatever the model produced. Deny irreversible actions there, not in the prompt. [V32] If by the end you think these are the wrong two variables, come and tell me which ones are.

<h2>The thing you already run</h2>
<h3>harness, workflow, agent, oracle</h3>

Note:

<p class="kicker">Part I · Harness</p>

<h2>You already operate a harness</h2>
<p class="lede">A harness is "everything in an AI agent except the model itself" — system prompts, tools, MCP servers, sandboxes, persistent memory, custom linters, structural tests. [V21]</p>

<ul>
  <li>The coding assistants most engineers now open daily are harnesses; the model is one component inside them.</li>
  <li>Karpathy's picture: "the LLM is the CPU and its context window is the RAM" [V50] — the harness is the operating system above both.</li>
  <li>So the question "should we build an agent?" is usually really "whose harness are we adopting?"</li>
</ul>

<div class="footnotes">
[V21] <span class="src-title">Harness Engineering</span> · [V50] <span class="src-title">Context Engineering</span> — vault concept notes.
</div>

Note:
Start with the word the other three definitions hang off. A harness is everything in an AI agent except the model itself: system prompts, tools, the MCP servers that hand it those tools, sandboxes, persistent memory, custom linters, structural tests. [V21] If you write code, the assistant most of you opened this morning is a harness with a model inside it, rather than a model with a chat window. If you do not, the systems you are asked to judge or fund have the same shape: a model wrapped in code that assembles its context and enumerates the tools it may call. The picture that works across a mixed room is Karpathy's: the model is the CPU, the context window is the RAM, and context engineering is memory management. [V50] The harness is the operating system above both — the code that loads context, dispatches tool calls, and checks permissions. Which reframes the buying question you are actually facing: not which model, but whose harness.

<p class="kicker">Part I · Vocabulary</p>

<h2>Workflow or agent — almost everything is a workflow</h2>
<p class="lede">Who writes the control flow: your code, or the model's own output.</p>

<div class="boxes">
<div class="box">

<strong>Workflow</strong>

Orchestrated "through predefined code paths" [S1].

</div>
<div class="box filled">

<strong>Agent</strong>

The model "dynamically direct[s] their own processes" [S1].

</div>
</div>

<ul>
  <li>Across a hand-coded corpus of fifty production loops, the most common configuration is a manually-triggered single agent with a deterministic check, not a swarm [V19].</li>
  <li>A workflow does not make failures predictable — your code fixes the tool calls, so you can list every place model output enters the system; an agent picks its path at run time.</li>
</ul>

<div class="footnotes">
[S1] <span class="src-title">Building Effective Agents</span> — Anthropic. https://www.anthropic.com/engineering/building-effective-agents
[V19] <span class="src-title">Loop Engineering</span>.
</div>

Note:
Anthropic's definitions: a workflow runs through predefined code paths you wrote; an agent directs its own process. [S1] In a hand-coded corpus of fifty production loops, the most common configuration is a manually triggered single agent with a deterministic check. [V19] The source says median loop; most common is my wording, because a category has no median. Why prefer the workflow? Not because it makes failures predictable — it does not. This deck is built by a workflow of fixed steps calling a model at each one, and its content failures were not predictable. What it makes is the failure surface enumerable: the tool calls are fixed when you write the code, so you can list every place model output enters the system. An agent chooses its path at run time, so that list cannot be written in advance. The variance of a single call is identical in both; what changes is what the output can reach.

<p class="kicker">Part I · Vocabulary</p>

<h2>A model grading a model is an evaluator, not a verifier</h2>
<p class="lede">Evaluator, verifier and oracle get used interchangeably; only the last two gate.</p>

<div class="rows">
<div class="row">
<div class="num">1</div>
<div class="term">Generator</div>
<div class="desc">Produces the work: the model.</div>
</div>
<div class="row">
<div class="num">2</div>
<div class="term">Evaluator</div>
<div class="desc">Examines the output: a program, a model, a person — the checker in Microsoft's maker-checker loop [S14].</div>
</div>
<div class="row">
<div class="num">3</div>
<div class="term">Verifier</div>
<div class="desc">Verdict is a function of (output, specification): a compiler, a schema validator.</div>
</div>
<div class="row">
<div class="num">4</div>
<div class="term">Oracle</div>
<div class="desc">Tells right from wrong: a reference implementation, a measurement, a person.</div>
</div>
</div>

<div class="footnotes">
[S14] <span class="src-title">AI Agent Orchestration Patterns</span> — Microsoft (2026). https://learn.microsoft.com/en-us/azure/architecture/ai-ml/guide/ai-agent-design-patterns
</div>

Note:
A generator produces the work — the model. An evaluator is anything that examines that output: a program, another model, a person. It says nothing about how the verdict is reached. A verifier is the strong case: its verdict is a function of the output and a specification. A compiler, a schema validator, a test run. An oracle is the other strong case: it tells right from wrong without asking the model. [V45] An oracle you can mechanise becomes a verifier, and verifiers run in CI. Which places the model judge: an evaluator and nothing more. Its verdict moves with prompt and sampling, it supplies no ground truth, and it cannot carry a gate. Evaluator is the field's word, not mine: Anthropic's evaluator-optimizer workflow names it [S1], and Microsoft lists it first among the maker-checker loop's aliases [S14]. In both it is another model; a compiler and a person count too. Ask which of those three — evaluator, verifier, oracle — someone has before you accept the word verified.

<p class="kicker">Part I · Vocabulary</p>

<h2>Reliability is not accuracy: pass^k, not pass@k</h2>
<p class="lede">Capability and reliability have come apart: solving a task once is not solving it every run.</p>

<div class="boxes">
<div class="box">

<strong>pass@k — the ceiling</strong>

"probability of success in at least one of k attempts" [V44] — what demos and benchmarks report.

</div>
<div class="box filled">

<strong>pass^k — the floor</strong>

Probability that all k attempts succeed — what production feels. [V44]

</div>
</div>

<ul>
  <li>The 2026 finding: "recent capability gains have only yielded small improvements in reliability", and "agents that can solve a task often fail to do so consistently" [S6].</li>
</ul>

<div class="footnotes">
[V44] <span class="src-title">Unit Testing</span> — vault note.
[S6] <span class="src-title">Towards a Science of AI Agent Reliability</span> — Rabanser, Kapoor et al. (ICML 2026). https://arxiv.org/abs/2602.16666
</div>

Note:
Pass-at-k is the probability of succeeding in at least one of k attempts — that is a ceiling, and it is what demos and benchmark tables report. [V44] Pass-to-the-k is the probability that all k attempts succeed — a floor, and that is what production feels every day. [V44] The two can be very far apart. A 2026 paper that decomposes agent reliability into twelve separate metrics reports that recent capability gains yielded only small improvements in reliability, and that agents able to solve a task often fail to do so consistently. [S6] Capability and reliability have come apart as axes. So when a vendor shows you a benchmark score, the follow-up question is not how high — it is how often, and out of how many runs.

<p class="kicker">Part II · Mechanism</p>

<h2>Why a model cannot check more cheaply than it generates</h2>
<p class="lede">Checking is cheaper than producing only when the check is a different procedure. [V12]</p>

<ul>
  <li>Where the intuition holds: solving a sudoku takes trial and error; checking a filled grid is scanning rows, columns and boxes for a repeat.</li>
  <li>Self-critique's premise: verification "should be easier than generation" [V12].</li>
  <li>Asked to verify, the model runs the same approximate retrieval it ran to generate: that procedure again, not a cheaper one. [V12]</li>
  <li>Scale does not help: better generation brings no "corresponding improvements in its ability to verify its own solutions" [V10].</li>
</ul>

<div class="footnotes">
[V10] [V12] <span class="src-title">Loop Engineering and Self-Verification</span> — vault report.
</div>

Note:
The intuition comes from problems where checking is a different job from doing: solving a sudoku takes trial and error, and checking a filled grid means scanning rows, columns and boxes for a repeat. The report states the assumption directly: the belief that self-critique helps rests on the assumption that verification should be easier than generation. [V12] That holds when checking is a genuinely different computation from producing. It is not here. A model asked to verify runs the same approximate retrieval over the same distribution it just ran to generate: there is no separate checking step, only the same step again. [V12] And the obvious hope does not survive either: improving generation performance does not improve the ability to verify one's own solutions, even on the same task. [V10] Which makes this a design axis rather than a model-procurement one.

<p class="kicker">Part II · Mechanism</p>

<h2>Higher agreement between a generator and its own evaluator tracks higher mistake vulnerability</h2>
<p class="lede">The more a generator and its own evaluator agree, the more vulnerable the pair is to validated mistakes — my report calls this the consistency dilemma. [V11]</p>

<ul>
  <li>Measured: "higher generator-evaluator self-consistency tracks <em>higher</em> mistake vulnerability — the consistency dilemma" [V11].</li>
  <li>And the scaling hope is empirically backwards: "self-verification capability does not improve with generation capability or scale" [V16].</li>
  <li>In a system you run: a reviewer model approves 98 of the author model's 100 outputs. That 98 says the two agree; it says nothing about whether the work is right.</li>
</ul>

<div class="footnotes">
[V11] [V16] <span class="src-title">Loop Engineering and Self-Verification Loops</span> — vault research report (2026).
</div>

Note:
The measured relationship is that higher self-consistency between a generator and its own evaluator tracks higher vulnerability to validated mistakes — the consistency dilemma. [V11] Read that operationally. If you have wired a reviewer model in front of an author model and the reviewer approves ninety-eight percent of the time, the natural reaction is that quality is high. The measurement says the opposite reading is at least as likely: the two agree because they share the failure structure, and the approval rate is telling you about correlation rather than about correctness. And the hope that the next model fixes it is backwards — self-verification capability does not improve with generation capability or scale. [V16] So a high agreement rate between two components of the same system is a diagnostic to investigate rather than a metric to report.

<p class="kicker">Part II · Limits</p>

<h2>Verification always costs something</h2>
<p class="lede">Every check has a price, paid in one of these. [V14]</p>

<ul>
  <li><strong>A second inference pass</strong> — compute and latency each request.</li>
  <li><strong>A different model</strong> — money and new failure modes.</li>
  <li><strong>A deterministic check</strong> — engineering time; covers only what you encoded.</li>
  <li><strong>A human review step</strong> — scarcest; stops scaling first.</li>
</ul>

<p class="closing">I am not claiming nothing can check itself. The 2026 information-theoretic bound is a diagnostic framework, not an impossibility theorem [V13]: it names what to measure, the failure a generator shares with its evaluator, and forbids nothing.</p>

<div class="footnotes">
[V13] [V14] <span class="src-title">Loop Engineering and Self-Verification</span> — vault report.
</div>

Note:
Trustworthy knowledge always pays for its own verification, and in a real system you can point at the currency. [V14] There are four. A second inference pass costs compute and latency on every request; a different model costs money plus a second set of failure modes somebody has to learn. A deterministic check costs engineering time up front and covers only what you thought to encode; a human review step is the scarcest of the four and the first to stop scaling. If you cannot point at one of those, you have not bought verification — you have assumed it. Now the limit, because you may have heard a stronger claim than mine. There is a 2026 information-theoretic bound on rounds of self-critique, and my own report labels it a diagnostic framework rather than an impossibility theorem: the latent failure variable it turns on still needs independent operationalisation before the bound has empirical bite. [V13] So no formal result forbids self-verification.

<p class="kicker">Part II · Counterarguments</p>

<h2>Self-critique degrades above a threshold — it is not universally broken</h2>
<p class="lede">Four results qualify "self-critique never works".</p>

<ol>
  <li><strong>Degradation measured only above a baseline-accuracy threshold</strong> — four of seven models scored lower after self-correcting; the paper evaluates none below that threshold [S10].</li>
  <li><strong>Anthropic says its own Claude Opus 5 already self-checks</strong> — its July 2026 guidance tells developers to remove the "add a final verification step" instruction [V46].</li>
  <li><strong>The verifier can move into training</strong> — training-time gains, no inference-time signal [V47].</li>
  <li><strong>Kambhampati's own framework rejects both extremes</strong> — its authors reject over-optimism about self-verification and the model-as-mere-translator view [S5].</li>
</ol>

<div class="footnotes">
[S10] https://arxiv.org/html/2604.22273v2 · [S5] https://arxiv.org/html/2402.01817v2
[V46] Anthropic guidance, vault card · [V47] Digest 2026-07-18
</div>

Note:
One: it degrades only above a baseline-accuracy threshold. A 2026 preprint treating self-correction as closed-loop feedback control finds four of its seven models degrade, including GPT-5, which loses one point eight points from a ninety-six point two percent baseline, and it evaluates nothing below its own threshold. [S10] A second preprint covers the other side: on GSM8K-Complex grade-school maths, GPT-3.5, at sixty-six percent baseline accuracy, self-corrected twenty-six point eight percent of its own errors; DeepSeek, at ninety-four, sixteen point seven. [S13] Neither places GPT-3.5 against the other's threshold, so I claim no single curve — only that the sign of the effect depends on where the generator starts. Two: Anthropic's July 2026 guidance tells developers to remove the explicit add-a-verification-step instruction for Claude Opus 5, because Opus 5 already re-reads its own output and the extra prompt makes it over-check. [V46] That self-check is an evaluator by tonight's definitions, not a verifier — which does not blunt the counterargument, only names it. Scope it: one vendor, one model — Opus 5, not Sonnet 5 or Haiku 4.5 — and no cross-lab replication. Three: the verifier can move into training — those methods report self-correction gains with no inference-time signal at all. [V47] Four, and this one stings: Kambhampati and colleagues, whose LLM-Modulo framework pairs the model with external verifiers and whose work my case rests on, reject the over-optimistic and the over-pessimistic extreme alike. [S5] I am obliged to sit between them.

<p class="kicker">Part II · Synthesis</p>

<h2>Two claims about self-critique die, two survive</h2>
<ul>
  <li><strong>Dies:</strong> "Self-critique never works." Degradation was measured only <em>above</em> an accuracy threshold [S10]; GPT-3.5 fixed <span class="pos">26.8%</span> of its own GSM8K-Complex errors: a correction share, not a net gain [S13].</li>
  <li><strong>Dies:</strong> "Only an inference-time external verifier helps." Training-time verifiers give the same signal, paid once [V47].</li>
  <li><strong>Survives:</strong> A check counts only if it can fail when the generator is wrong — fresh context, another model, outside any model. Say which [V3].</li>
  <li><strong>Survives:</strong> Verification has a price: another pass, another model, a deterministic check, someone's time. Name yours [V14].</li>
</ul>

<div class="footnotes">
[S13] <span class="src-title">Decomposing LLM Self-Correction</span> — arXiv preprint (2026). https://arxiv.org/abs/2601.00828
</div>

Note:
Two claims die. Self-critique never works fails as a universal: degradation was measured only above an accuracy threshold; nothing below it was evaluated. [S10] On GSM8K-Complex, GPT-3.5 fixed twenty-six point eight percent of its own errors: the share it fixed, not a net accuracy change, and nobody counted the errors self-correction introduced. [S13] Error Depth is the authors' explanation, not a demonstrated mechanism. [S13] And only an inference-time external verifier can help is false too: the verifier can move into training, same signal, paid for once. [V47] Two claims survive. First: a check tells you something only if it can come back negative when the generator is wrong, so buy that in a fresh context, on another model, or outside any model — and say which one you did. [V3] Second: verification has a price — a second pass, a cheaper model, a deterministic check, someone's time — and if you cannot point at which one you pay, you have not paid it. [V14] That is a weaker thesis than the one on the conference posters. It is also the one still true after the next two model releases.

<p class="kicker">Part II · Decision</p>

<h2>Relabel every self-confirmation step, and measure your reviewer's agreement rate</h2>
<p class="lede">Two changes this week, two habits to stop.</p>

<div class="compare">
<div>

<strong>Change this week</strong>

<ul>
  <li>Find every place your system asks a model to confirm its own output, and label it: not a check.</li>
  <li>Measure how often your reviewer model agrees with your author model. Above roughly 90% it is confirming, not checking — seed twenty known defects and count how many it catches. Cannot change the system? Ask for both numbers. [V11]</li>
</ul>

</div>
<div class="side-b">

<strong>Do not do this</strong>

<ul>
  <li>Do not add a second model reading the first one's transcript and call it verified. [V3]</li>
  <li>Do not wait for, or fund, a bigger model to close the gap. [V10] [V16]</li>
</ul>

</div>
</div>

Note:
Do this week: find every point where a system you shipped asks a model to confirm its own output, and relabel it honestly — a formatting step, or a self-consistency step, but not a check. Second, if you already run a reviewer model, measure how often it agrees with your author model across a sample of real outputs. Above roughly ninety percent agreement I would read it as confirming rather than checking — it shares the author's blind spots, so its approval carries almost no information, which is the consistency dilemma arriving in your logs. [V11] Then test it directly: seed twenty known defects and count how many come back. A reviewer that agrees constantly and catches few is grading style, not correctness. Do not do: adding a second model that reads the first one's transcript and then describing the system as verified — the transcript is the contamination. [V3] And do not wait for the next model, because verification capability does not track generation capability. [V10] [V16] Now, what actually works.

<p class="kicker">Part III · Independence</p>

<h2>Independence costs a fresh context, not a second vendor</h2>
<p class="lede">Run the check on the same model in a clean context: the artifact and criteria only. [V17]</p>

<ul>
  <li>"checker independence is a context-isolation boundary, not a model-weights boundary" [V17] — buy a second model family only for the subjective checks no program can make.</li>
  <li>The transcript contaminates it: an evaluator that sees the generator's reasoning is biased toward confirming it. [V17]</li>
  <li>Rule: pass the artifact and the specification, never the chain of thought.</li>
  <li>Ceiling: same-family evaluators share blind spots — "independence is <em>approximated</em>, never absolute" [V54].</li>
</ul>

<div class="footnotes">
[V17] [V54] <span class="src-title">Loop Engineering</span> — vault concept note (2026).
</div>

Note:
Independence is not what most teams assume. Evaluator independence is primarily a context-isolation boundary rather than a model-weights boundary. [V17] You do not need a second vendor for the independence that matters most of the time — the note reserves a second model family for the subjective checks no program can make, and nothing else. [V17] The same model, in a fresh context window, shown only the artifact and the acceptance criteria, is where the load is carried. [V17] What destroys it is the transcript. A verifier that can read the generator's reasoning is biased toward confirming that reasoning. [V17] So the implementation rule is one line: pass the artifact and the specification, never the chain of thought that produced it. That costs one extra inference call and some discipline. Now the ceiling: the same note records that same-family evaluators retain shared blind spots and can collude in a degeneration-of-thought mode, so independence is approximated, never absolute. [V54] Context isolation buys most of what is available; no configuration buys all of it.

<p class="kicker">Part III · Levels</p>

<h2>Five verification levels — name the one that checked your last AI-assisted decision</h2>
<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Deterministic</div><div class="desc">Exit code, assertion, known-good result. [V18]</div></div>
<div class="row"><div class="num">2</div><div class="term">Rule or constraint</div><div class="desc">Linter, schema, policy engine. [V18]</div></div>
<div class="row"><div class="num">3</div><div class="term">Field truth</div><div class="desc">Tests, a deploy, a real outcome. [V18]</div></div>
<div class="row"><div class="num">4</div><div class="term">Model as judge</div><div class="desc">Rubric scoring by a model. [V18]</div></div>
<div class="row"><div class="num">5</div><div class="term">Human checkpoint</div><div class="desc">A person with a stake. [V18]</div></div>
</div>

<p class="closing">Most production checking is a program: "70% of loops verify at levels 1–2" [V18].</p>

Note:
Five levels. One, deterministic: an exit code, an assertion, a known-good result. [V18] Two, rule or constraint: a linter, a schema, a policy engine. [V18] Three, delayed field truth: tests, a deploy, a real customer outcome you observe later. [V18] Four, model as judge: a model scoring against a rubric. [V18] Five, a human checkpoint where someone with a stake signs. [V18] Across the measured corpus, seventy percent of loops verify at levels one and two. [V18] I want that to land as good news rather than as immaturity. The boring levels are cheap, fast, auditable, and they are where measured production checking actually happens. [V18] The question to carry out of this room is exactly four words: which level verifies this?

---

<p class="kicker">Part III · Levels</p>

<h2>Verification level 4 is coverage, not certification</h2>
<p class="lede">Level 4 of the five-level verification scale is a model scoring against a rubric [V18].</p>

<div class="boxes">
<div class="box">

<strong>What level 4 gives you</strong>

Coverage of what no program can express — tone, relevance, whether an answer addressed the question.

</div>
<div class="box filled">

<strong>What level 4 cannot buy</strong>

Independence from failures it shares with the generator. The consistency dilemma: the more a generator and its own evaluator agree, the more vulnerable the pair is to mistakes both validate. [V11]

</div>
</div>

<ul>
  <li>Ordering: make the check objective, isolate the grader's context, then change model family. [V17] [V18]</li>
  <li>If a decision only reaches level 4, say so in the design review.</li>
</ul>

Note:
Level four buys coverage of things no program can express: tone, relevance, whether the answer addressed the question. What level four cannot buy is independence from the failures it shares with the generator — the consistency dilemma from part two: the more a generator and its own evaluator agree, the more vulnerable the pair is to mistakes both of them validate. [V11] So the ordering: make the check objective if you can, isolate the grader's context if you cannot, and only then change model family — each step costs more and buys less. [V17] [V18] And if a decision only reaches level four, say so in the design review rather than writing verified on the diagram.

<p class="kicker">Part III · Grounding</p>

<h2>Grounding is not the same thing as retrieval</h2>
<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Parametric</div><div class="desc">Answers from training alone. No evidence, no constraint. [V26]</div></div>
<div class="row"><div class="num">2</div><div class="term">Structural</div><div class="desc">Retrieval narrows the output distribution; it certifies nothing. [V26]</div></div>
<div class="row"><div class="num">3</div><div class="term">Deterministic</div><div class="desc">A program outside the model computes the answer — a constraint solver, a maths library, a finite-element engine. The model only formalises the input. [V26]</div></div>
</div>

<ul>
  <li>Layer three nears the "mere translator" extreme LLM-Modulo's authors decline. [S5]</li>
</ul>

<p class="closing">Most products marketed as grounded stop at layer two.</p>

<div class="footnotes">
[V26] <span class="src-title">Structural Grounding</span> — vault concept note.
</div>

Note:
Layer one: the model answers from its training weights, with no evidence and no constraint. [V26] Layer two: retrieval — you inject documents, and the output distribution narrows toward them. [V26] That is a genuine improvement, and my read — nobody has published a count — is that most products marketed as grounded stop there. Layer three: a computation outside the model determines the answer, and the model extracts, selects and translates but never performs the truth-determining computation itself. [V26] Now the attack on that third sentence, which is stronger than the field's most careful researchers will go. The LLM-Modulo authors — the group behind the Blocksworld and self-verification results in part two — name two errors, and the second is treating the model as a mere translator of the problem specification. [S5] Layer three as worded sits close to that extreme, so take it as a design target rather than a settled result. Hold the layer distinction: the gap between two and three is where the next slide lives.

<p class="kicker">Part III · Grounding</p>

<h2>A faithfulness score cannot catch a wrong source</h2>
<p class="lede">A system can quote its source perfectly and still be structurally unsafe. [V15]</p>

<ul>
  <li>Worked case: an assistant retrieves a clause and reproduces it exactly — and the clause was wrong. [V15]</li>
  <li>The scoring: "it scores 90%+ on faithfulness (it matched its retrieved source exactly) and is structurally unsafe, because no output-against-context check can catch a wrong context" [V15].</li>
  <li>Faithfulness measures agreement with the retrieved document, never with reality.</li>
  <li>The question that catches it: not "did it match the source" but "who decided that was the source?"</li>
</ul>

<div class="footnotes">
[V15] <span class="src-title">Loop Engineering — Practitioner Synthesis</span> — vault report.
</div>

Note:
Picture an assistant that retrieves a regulatory clause and reproduces it word for word — and the clause is wrong. [V15] On every faithfulness metric in common use it scores above ninety percent, because faithfulness measures whether the output matched the retrieved source, and it did, exactly. [V15] The system is also unsafe, and no output-against-context check can catch it, because the check compares the answer to the context and the context is the thing that is wrong. [V15] That gap between faithful and true is where the most expensive failures live, and they are invisible to the metric most vendors will show you. So the audit question is not did it match the source. It is who decided that was the source, and what verified that decision.

<p class="kicker">Part III · Limits</p>

<h2>Boundary one — the oracle only sees what it measures</h2>
<p class="lede">An external check supplies information about its own dimensions and nothing else. [V6]</p>

<ul>
  <li>The structural-design study behind this talk's headline number — building-code compliance 56.8% → 98.6% with an external verifier [V4] — states its own limit: "when the defect originates from the structural topology, the parameter-level closed loop is powerless" [V6].</li>
  <li>Generalised: a schema validator cannot catch a wrong schema; a test suite cannot catch a missing requirement.</li>
  <li>So the design question is coverage, not presence — "which failures does this oracle not see?"</li>
</ul>

<div class="footnotes">
[V4] [V6] <span class="src-title">Loop Engineering and Self-Verification Loops</span> — vault research report (2026).
</div>

Note:
The structural-design study behind my headline number — fifty-six point eight to ninety-eight point six percent, with an external verifier [V4] — states its own limit: when the defect originates from the structural topology, the parameter-level closed loop is powerless. [V6] In plain terms, the verifier checked whether the parameters were compliant, so it could say nothing about whether the overall shape was wrong. A schema validator cannot catch a wrong schema. A test suite cannot catch a requirement nobody wrote a test for. A citation registry can confirm a paper exists and cannot confirm it says what was claimed. So the design question is never does this have a verifier — it is which failures does this verifier structurally not see, and what covers those.

<p class="kicker">Part III · Limits</p>

<h2>Boundary two — somebody has to write the oracle</h2>
<p class="lede">The verifier may be more work than the generator, and no source I have puts a figure on it.</p>

<ul>
  <li><em>LLM-Modulo</em> is Kambhampati et al.'s architecture: the model generates candidates, external verifiers and solvers check them. Their caveat — that verifier may be substantial work, and substituting a simulator means writing the simulator. [S5]</li>
  <li>The work is formalising domain knowledge into machine-checkable form — "labor-intensive and domain-specific" [V26] — which a vendor cannot cheaply copy.</li>
  <li>Hardest where it is most needed: "no convincing public playbook yet for retrofitting a ten-year-old codebase" [V22].</li>
</ul>

<div class="footnotes">
[S5] https://arxiv.org/html/2402.01817v2 · [V22] <span class="src-title">Harness Engineering</span> · [V26] <span class="src-title">Structural Grounding</span>
</div>

Note:
I have been filing oracle construction under open problems. It is not an open problem — it is the bill. Kambhampati and colleagues propose LLM-Modulo — the model generates candidates, external verifiers and solvers check them — and they put its bill bluntly: the verifier may be more complex and involve substantial work, and substituting a simulator for a verifier means someone writes that simulator. [S5] The work is formalising domain knowledge into machine-checkable form, which my own notes call labor-intensive and domain-specific. [V26] Expensive, and defensible: whoever formalises a domain owns the check for it, and a generic vendor cannot cheaply copy that. And the hardest case arrives with an existing codebase: there is no convincing public playbook yet for retrofitting a ten-year-old codebase. [V22]

<p class="kicker">Part III · Limits</p>

<h2>Boundary three — the oracle depreciates</h2>
<p class="lede">Treat a verifier as "a maintenance liability that must be re-scoped at every model upgrade" [V25] rather than as a fixed asset.</p>

<ul>
  <li>Reported first-hand: an evaluator "became unnecessary overhead" for tasks that moved inside the generator's boundary after a model upgrade [S2].</li>
  <li>The same account deleted a whole context-reset subsystem after one upgrade [S2].</li>
  <li>Plan for it: put a re-scope of every model-judge step on the calendar for each model upgrade.</li>
  <li>The deterministic levels depreciate far more slowly, which is another reason to prefer them.</li>
</ul>

<div class="footnotes">
[V25] <span class="src-title">Verification and Checker Design</span> — vault report · [S2] https://www.anthropic.com/engineering/harness-design-long-running-apps
</div>

Note:
Everything I am telling you to build depreciates on a model-release cadence. My own notes put it precisely: a verifier is not a fixed asset but a maintenance liability that must be re-scoped at every model upgrade. [V25] There is a first-hand engineering account of exactly this — an evaluator became unnecessary overhead once the generator absorbed the check after a model version bump, and the same team deleted an entire context-reset subsystem after a later model version made it redundant. [S2] So put the re-scope on the calendar rather than discovering it in the token bill. And notice which levels survive: a compiler does not depreciate when a model ships. A model-judge step does. That is a third reason to spend your budget at verification levels one and two — an exit code, a schema — rather than on a model judge.

<h2>Bounded autonomy</h2>
<h3>deny at the gate, not in the prompt</h3>

The nine-second database deletion, the permission decisions behind it, and the five autonomy levels.

Note:
Part four, and I want to reframe the topic before I start. Autonomy gets discussed as an AI safety question, in language borrowed from alignment research, and that framing makes the problem look novel and slightly unreachable. I think it is mostly a permissions question, and permissions engineering has fifty years of results behind it — so I will state the governing principle from 1975 rather than assume anybody here already carries it. So the argument in this section is that the interesting failures are not the model doing something surprising — they are the model being able to do something nobody had bounded. I will start with the arithmetic that explains why long chains fail, then the incident that explains why authority matters more than the arithmetic.

<p class="kicker">Part IV · Arithmetic</p>

<h2>Why 95% per step still fails over twenty steps</h2>
<p class="lede">End-to-end success is the product of per-step success, so length hurts faster than a weak step. [V27]</p>

<div class="stats">
<div><div class="stat neg">0.95²⁰ ≈ 36%</div><div class="stat-cap">20 steps at 95% each [V27]</div></div>
</div>

<ul>
  <li>Only shortening the chain touches the exponent. Checking each seam is the other move: a caught step is retried, not multiplied. A better model only nudges each pᵢ.</li>
  <li>Caveat: assumes independent per-step accuracies — "the number is a slogan, not a prediction" [V28].</li>
</ul>

<div class="footnotes">
[V27] <span class="src-title">Agentic Loop Pattern</span> — vault note · [V28] <span class="src-title">Grounding in AI-Driven Systems</span> — vault podcast brief.
</div>

Note:
Ninety-five percent per step, twenty steps, and you are at thirty-six percent end to end. [V27] Ninety-five percent sounds excellent in a status meeting and is catastrophic in a chain. Shortening the chain is the only move on the exponent — it removes factors from the product. Checking each seam is different: a failed step is caught and retried there rather than multiplied downstream. A better model does neither; it nudges each p-sub-i, and twenty still multiply. Now the caveat, because the number gets quoted without it constantly. It assumes the per-step accuracies are independent. [V28] My own notes are blunt about this — "the number is a slogan, not a prediction." [V28] Use it to reason about shape, never to forecast a specific system.

<p class="kicker">Part IV · Arithmetic</p>

<h2>Real pipeline errors are not independent — they stick</h2>
<p class="lede">Errors in real pipelines are not independent — they stick and propagate. [V29]</p>

<ul>
  <li>Work on compounding errors in agentic pipelines reports failures "propagating semantically across steps rather than occurring independently" [V29].</li>
  <li>A separate study, DSAP, measured recovery per stage on 99 SWE-Bench instance-arm pairs (bug fixing): "37.5% for test generation but 0% for patch generation" [V29].</li>
  <li>So the curve is not a clean exponential: stages with different recovery, some with none at all.</li>
  <li>Practical consequence: instrument per stage. An end-to-end success rate hides which seam is leaking.</li>
</ul>

<div class="footnotes">
[V29] <span class="src-title">The 4/δ Bound — Designing Predictable LLM-Verifier Systems</span> — vault reading note.
</div>

Note:
Work on compounding errors in agentic pipelines reports failure stickiness — errors propagating semantically across steps rather than independently — so the independence assumption fails in the direction that hurts. [V29] A separate study, DSAP, measured recovery per stage on SWE-Bench, a bug-fixing benchmark: thirty-seven and a half percent for test generation, zero for patch generation. [V29] Zero. So the true picture is not a smooth exponential decay; it is a set of stages with wildly different recovery behaviour, some of which never recover once they go wrong. Measure per stage, not end to end, because an end-to-end success rate averages over exactly the difference that would tell you where to put your one check.

<p class="kicker">Part IV · Incident</p>

<h2>Ask why the agent was able to delete the database</h2>
<p class="lede">Nothing in the PocketOS deletion required the model to misbehave: an over-scoped token and an unconfirmed destructive API are enough. [V31]</p>

<ul>
  <li>The post-mortem's conclusion: "system prompts are not security controls" [V31] — prevention needs a deterministic mechanism outside the reasoning loop.</li>
  <li>The 1975 principle: every program and user runs with the least privilege needed for the job [S9].</li>
  <li>A token in an unrelated file carried authority over production volumes — a scoping defect, not a model defect.</li>
</ul>

<div class="footnotes">
[V31] <span class="src-title">PocketOS Cursor Incident</span> — vault watch note · [S9] <span class="src-title">The Protection of Information in Computer Systems</span> — Saltzer and Schroeder (1975). https://www.cs.virginia.edu/~evans/cs551/saltzer
</div>

Note:
Everyone asks why did the agent do that. The useful question is why was it able to. The most rigorous post-mortem of that incident states the conclusion I would put on a wall: system prompts are not security controls. [V31] The only thing that reliably prevents a catastrophically wrong action is a deterministic enforcement mechanism operating outside the model's reasoning loop, one that makes certain outcomes structurally impossible. [V31] Saltzer and Schroeder wrote the governing principle in 1975 — every program and every user operates with the least set of privileges necessary for the job. [S9] A token found in an unrelated file carried authority to delete production volumes. No prompt engineering fixes that, and no better model fixes that. A narrower credential fixes it.

<p class="kicker">Part IV · Design</p>

<h2>Deny at the API gate, not in the prompt</h2>
<p class="lede">A gateway rule is evaluated after the model and refuses the emitted call whatever the model produced; a prompt is input that the next tool result can override. [V32]</p>

<div class="boxes">
<div class="box">

<strong>Advisory — tool output can override it</strong>

Prompt, system message, policy document.

</div>
<div class="box filled">

<strong>Enforced — holds whatever the model emitted</strong>

The credential, the API gateway, the sandbox, the deny gate. [V32]

</div>
</div>

<ul>
  <li>Verbatim: "irreversible actions (production deploys, money movement, force-push) belong on a deterministic deny gate, never on a probabilistic reviewer" [V20].</li>
</ul>

<div class="footnotes">
[V32] <span class="src-title">Harness Engineering — Tool Permissions</span> — vault report (2026).
[V20] <span class="src-title">Loop Engineering</span> — vault note (2026).
</div>

Note:
My source states the design rule: put the control where the authority is exercised, not where the intent is expressed. [V32] A prompt instruction is advisory — anything that changes the input can override it, and for an agent reading tool output that is essentially every turn. A credential, an API gateway rule, a sandbox or a deny gate is evaluated after the model and outside it, so it holds whatever the model produced. The operational form, verbatim: irreversible actions — production deploys, money movement, force-push — belong on a deterministic deny gate, never on a probabilistic reviewer. [V20] This also separates two components people conflate: the verifier checks the work, the gate checks the action, and you need both.

<p class="kicker">Part IV · Design</p>

<h2>A guardrail checks one channel — NeMo's content rails never read a tool call's arguments</h2>
<p class="lede">A guardrail inspects a named subset of traffic; the rest is unchecked.</p>

<ul>
  <li>NVIDIA's NeMo Guardrails checks a tool call is declared and schema-valid, but its content rails read message content only: argument payloads go uninspected [V33] [S15].</li>
  <li>And "tool results bypass input rails" — tool output is trusted by default [V33].</li>
  <li>Stack layers that fail differently: input rail, argument check, deterministic deny gate on irreversible actions. [V33] [V20]</li>
</ul>

Guardrail frameworks are useful and I run them, but read the documentation: it says where they stop. A rail is one check on one channel: the incoming message, the model's output, or a tool call. NVIDIA's guide for NeMo Guardrails discloses that its content rails evaluate the message content field only, so an argument payload is never inspected, even when the call itself passes the schema check. [V33] [S15] And tool results bypass input rails, so tool output is trusted by default and can steer everything after it. [V33] Those are not bugs but documented scope — NVIDIA wrote both gaps down. So stack layers whose holes do not line up, and never let a diagram describe a single rail as protection.

<p class="kicker">Part IV · Autonomy</p>

<h2>Five autonomy levels, and each names who answers</h2>
<div class="rows">
<div class="row"><div class="num">1</div><div class="term">In the loop</div><div class="desc">Every action approved; approver answers. [V34]</div></div>
<div class="row"><div class="num">2</div><div class="term">On the loop</div><div class="desc">Acts inside pre-authorised bounds; monitor interrupts. [V34]</div></div>
<div class="row"><div class="num">3</div><div class="term">Supervised</div><div class="desc">Routine handled; high-stakes escalate. [V34]</div></div>
<div class="row"><div class="num">4</div><div class="term">Delegated</div><div class="desc">End-to-end in mission bounds; audited after. [V34]</div></div>
<div class="row"><div class="num">5</div><div class="term">Full autonomy</div><div class="desc">Own objectives; governance and audit. [V34]</div></div>
</div>

<p class="closing">"Each level implies a distinct accountability structure" [V34] — the level picks who answers.</p>

Note:
One through five run from every action approved, to a system operating on objectives set inside broad constraints with the human role reduced to governance and audit. [V34] One caveat on those names. They are the vault note's own synthesis, and the note says so. [V34] The paper underneath names its five levels operator, collaborator, consultant, approver and observer, and centres them on the role the user takes rather than on the system's scope, so the mapping between the two is approximate. [V34] I use the synthesis because it names the accountability holder directly, which is the decision you are actually making. The load-bearing sentence is that each level implies a distinct accountability structure. [V34] So this is not a maturity ladder to climb. Choosing a level is choosing who is answerable when it goes wrong — a decision written down, not an emergent property of a tool default.

<h2>Human approval is a control that degrades</h2>
<div class="matrix">
<div class="m-row">
<div class="src">Bainbridge</div><div class="ref">[S8]</div><div class="claim">The operator monitors a system installed because it outperforms them</div><div class="kind">1983</div>
</div>
<div class="m-row">
<div class="src">The Code</div><div class="ref">[V35]</div><div class="claim">Developers overseeing AI agents: "those skills atrophy" — 17% drop in skill mastery</div><div class="kind">Newsletter</div>
</div>
<div class="m-row">
<div class="src">RSNA</div><div class="ref">[S12]</div><div class="claim">Radiologists, 15+ years: 82% → 45.5% on a purported AI's incorrect suggestion</div><div class="kind">Reported</div>

<p class="closing">A <span class="neg">36.5-point</span> accuracy drop from one AI-labelled wrong suggestion [S12]: measure your approver's override rate.</p>

<div class="footnotes">
[S8] https://ckrybus.com/static/papers/Bainbridge_1983_Automatica.pdf · [S12] https://www.rsna.org/news/2023/may/ai-bias-may-impair-accuracy
[V35] <span class="src-title">Agentic Coding Is a Trap</span> — The Code (2026).
</div>

Note:
Whenever anyone says keep a human in the loop, they are proposing a control whose reliability is almost never measured. Lisanne Bainbridge described the problem in 1983, in the Ironies of Automation: the automation was installed because it outperforms the operator, and then the operator is asked to monitor it. [S8] That is the task humans are worst at. A 2026 newsletter reports that the skills required to supervise decay from not exercising them — a seventeen percent drop in skill mastery, with debugging declining most steeply. [V35] And in a domain of certified experts, radiologists with more than fifteen years of experience went from eighty-two percent accuracy to forty-five point five when the purported AI suggested the incorrect category. [S12] Purported is the report's own word: the suggestions were experimenter-controlled and only labelled as AI, which makes the thirty-six-and-a-half-point drop an effect of the label rather than of any model. Forty-three years apart, same finding. A human approval step is a real control, and it is not free.

<p class="kicker">Part IV · Autonomy</p>

<h2>The EU AI Act specifies what a human approver must be able to do</h2>
<p class="lede">A counter-signature does not satisfy Article 14. [S17]</p>

<ul>
  <li>Article 14(4)(b): the overseer must be enabled "to remain aware of the possible tendency of … over-relying on the output"; 14(4)(d) and (e): they must be able to override and halt the system [S17].</li>
  <li>Annex III (HR) turns on "materially influences decisions", not counter-signature [S16].</li>
  <li>Measure the override rate: decisions the approver changed, rejected or halted. Zero overrides is counter-signing, not oversight; seed known-bad cases and count how many are stopped.</li>
</ul>

<div class="footnotes">
[S17] <span class="src-title">EU AI Act Article 14</span>. https://artificialintelligenceact.eu/article/14/
[S16] <span class="src-title">Annex III HR guide</span> — Knowlee. https://www.knowlee.ai/blog/ai-act-annex-iii-hr-employment
</div>

Note:
Article 14 is the human-oversight article, and paragraph 4b is worth reading out loud: whoever is assigned oversight must be enabled to remain aware of the tendency to over-rely on the output — automation bias, in the legal text. [S17] Paragraphs 4d and 4e add that the same person must be able to override the output and halt the system. [S17] So the radiology number is the failure mode the article legislates against. And a counter-signature is not an exemption — though that guide covers employment systems, so take the reasoning, not the coverage. [S16] So if your verification level is a person clicking approve, measure the override rate: decisions that approver changed, rejected or halted. Zero overrides across a review period is counter-signing, not oversight. Test it: seed known-bad cases into the queue and count how many the approver stops.

<p class="kicker">Part IV · Counterargument</p>

<h2>Bounded autonomy can relocate blame instead of risk</h2>
<p class="lede">The strongest objection to putting a named human at the boundary, and I have no clean answer.</p>

<ul>
  <li>The named human becomes a liability sponge — "absorbing blame for a system they can't actually override" [V37].</li>
  <li>We cite the model's error rate as proof it cannot certify itself, then install a human whose error rate nobody measures.</li>
  <li>Partial answer: pick the autonomy level so the human's task stays inside what a human can actually do, and measure that.</li>
  <li>Honest answer: if the person cannot realistically override the system, the level is set wrong.</li>
</ul>

<div class="footnotes">
[V37] <span class="src-title">2026-07-22 Digest</span> — vault journal note.
</div>

Note:
When you place a named human at the boundary, you may not be reducing risk — you may be relocating liability. The term for the role is the moral crumple zone: the nearest human absorbs blame for a system they cannot actually override, while the technology's reputation stays intact. [V37] Notice the inconsistency in my own argument. I spent twenty minutes citing measured model error rates as proof that a model cannot certify itself, and then I proposed a human oracle whose error rate nobody in this room measures. Partial answer: choose the autonomy level so the human's task remains something a human can actually perform, and then measure whether they perform it. Honest answer: if the person cannot realistically override the system, you have set the level wrong and the sign-off is decoration.

<h2>Gate the irreversible actions, scope the credentials, name who answers</h2>
<p class="lede">Three permission changes to make, and three habits that only look like controls.</p>

<div class="compare">
<div>

<strong>Do this</strong>

<ul>
  <li>Enumerate irreversible actions; put each behind a deterministic gate. [V20]</li>
  <li>Scope every agent credential to the one task it serves. [S9]</li>
  <li>Write down the autonomy level per feature, with the name of who answers. [V34]</li>
</ul>

</div>
<div class="side-b">

<strong>Stop doing this</strong>

<ul>
  <li>Relying on a system prompt as a control. [V31]</li>
  <li>Describing a single guardrail as protection. [V33]</li>
  <li>Counting an approval click as oversight without measuring it. [S17]</li>
</ul>

</div>
</div>

<p class="closing">Cannot change the system? Ask for one number: the share of decisions the approver changed, rejected or halted. [S17]</p>

Note:
Start: enumerate every irreversible action your system can reach and put each one behind a deterministic gate, and that list is shorter than most teams expect. [V20] Enumerating it is an afternoon. Scope every agent credential to exactly one task, which is the direct fix for the incident I described. [S9] And write down the autonomy level for each feature together with the name of the person who answers for it. [V34] Stop: relying on a system prompt as a control, because it is not one. [V31] Stop describing a single guardrail as protection when its own documentation lists what it does not inspect. [V33] And stop counting an approval click as oversight unless you are measuring whether anyone ever declines. [S17] Now the money.

<p class="kicker">Part V · Cost</p>

<h2>The bill for closing a loop on an external check: more agents, more iterations, a memory layer</h2>
<div class="kv">
<div class="pair"><div class="k">Several agents, not one</div><div class="v">"Multi-agent systems use approximately 15× more tokens than chats" [V38]</div></div>
<div class="pair"><div class="k">More loop iterations</div><div class="v">Reflexion, a self-reflection loop, "can become worse with more compute budget", unlike self-consistency sampling, which majority-votes independent samples [V39]</div></div>
<div class="pair"><div class="k">A memory layer between turns</div><div class="v">Break-even spans turn 0 to turn 356; "no system wins on both cost and accuracy" [V40]</div></div>
</div>

<p class="closing">Take the 15× multiplier and the turn-0-to-356 memory break-even to the design review.</p>

<div class="footnotes">
[V38] [V39] [V40] <span class="src-title">Agentic Orchestration Patterns; Reflexion Cost-Efficiency; Agent Memory Architecture</span> — vault notes.
</div>

Note:
First: multi-agent orchestration costs roughly fifteen times the tokens of a straight chat. [V38] That buys real accuracy in some settings, and it is a fifteen-times bill in all of them. Second, the counter-intuitive one: iteration is not monotone. Unlike self-consistency, a reflection loop can get worse with more compute budget — spending more can lower accuracy. [V39] Third, memory layers, which every team adds by reflex: the break-even against simply resending the transcript ranges from turn zero to turn three hundred and fifty-six depending on the system, and no system wins on both cost and accuracy. [V40] So memory is a conditional optimisation with a precondition to check rather than assume.

<p class="kicker">Part V · Cost</p>

<h2>A 25× input-price gap makes the tier you run the check on a design decision</h2>
<p class="lede">Route the check down a tier, never the hard generation: the check is the smaller, more structured task.</p>

<ul>
  <li>Reported: a "25x input-price gap" between top-tier and cheap models [V49].</li>
  <li>Reported once, unverified: Microsoft cancelled Claude Code licences in one division for cost certainty [V49].</li>
  <li>Its limit, at the source's own scope: "cheap-model routing to hard legacy tasks (already the worst-case for agents) amplifies the probability of silent failures and verification debt" [V49].</li>
  <li>Another reason to prefer verification level 1: a compiler run costs no tokens.</li>
</ul>

<div class="footnotes">
[V49] <span class="src-title">The AI Cost Reckoning</span> — vault watch note (2026).
</div>

Note:
There is roughly a twenty-five times gap in input pricing between top-tier and cheap models. [V49] And the reported behaviour that follows is instructive — Microsoft cancelled Claude Code licences across one division and redirected those engineers to a cheaper tool for cost certainty. [V49] One secondary report, and the note does not independently verify the stated rationale. [V49] Which gives you a lever most teams are not pulling: run the expensive model to generate, and run a cheap model or, better, a plain program to check. The checking step is usually the smaller, more structured task, and it is exactly the one you can push down a tier or out of the model entirely. And the price: the same source says cheap-model routing to hard legacy tasks — already the worst case for agents, in its own parenthesis — amplifies the probability of silent failures and verification debt. [V49] That is legacy code; it says nothing about hard greenfield work. Which is one more argument for verification level one: a compiler run has no token cost at all.

<h2>Generation got cheap; review and integration did not</h2>
<p class="lede">"AI-written code still needs to be reviewed, integrated, tested, and released by humans" [V52].</p>

<div class="stats">
<div><div class="stat neu">+180% / +30%</div><div class="stat-cap">Coding activity against releases shipped, 100k+ developers [V52]</div></div>
<div><div class="stat">+15% / −7%</div><div class="stat-cap">Feature-branch against main-branch throughput, CircleCI, 28.7M workflows [V53]</div></div>
</div>

<ul>
  <li>76% more pull requests once agents ramped: "organizational absorption became the constraint" [V41].</li>

<p class="kicker">Part V · Practice</p>

<h2>Capture traces first, write the evals they ask for, then fail the merge on them</h2>
<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Trace before evals</div><div class="desc">"capture traces with cost metadata before writing a single custom eval" [V43]</div></div>
<div class="row"><div class="num">2</div><div class="term">Evals from traces</div><div class="desc">Write the evals the traces asked for; run them in dev and prod alike. [V43]</div></div>
<div class="row"><div class="num">3</div><div class="term">Fail the merge</div><div class="desc">A failing eval blocks the merge; a dashboard only records that it failed. [V43]</div></div>
</div>

<p class="closing">Existing monitoring cannot see "a confidently wrong answer that passed every infra check" [V43].</p>

<div class="footnotes">
[V43] <span class="src-title">Harness Engineering — Evaluation and Observability Loops</span> — vault report.
</div>

Note:
One: instrument first. Capture traces with cost metadata before you write a single custom evaluation, because the traces tell you which evaluations need to exist — and the ones you would have guessed are usually not those. [V43] Two: then write those evaluations, and run them identically in development and in production, so a regression means the same thing in both. [V43] Three: put the result on a gate. A failing evaluation blocks the merge; a dashboard only records that it failed, and only if somebody is looking at it. [V43] And the reason your existing monitoring will not cover this: a confidently wrong answer that passed every infrastructure check is invisible at the infrastructure layer. [V43] Latency was fine. Cost was fine. The answer was wrong.

<h2>If you write code — review the diff in a fresh session, gate the irreversible actions</h2>
<p class="lede">Four changes that are configuration rather than architecture, and three things to say no to.</p>

<div class="compare">

<ul>
  <li>Ask your coding assistant to review a diff in a fresh session, not the one that wrote it. [V17]</li>
  <li>Isolate your evaluator's context — artifact and criteria only, never the transcript. [V17]</li>

<p class="kicker">Part V · Monday</p>

<h2>If you judge output — ask which of the five levels checked it, and who chose the source</h2>
<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Which level checked it?</div><div class="desc">Level 4 — a model scoring a rubric — is coverage, not verification. [V18]</div></div>
<div class="row"><div class="num">2</div><div class="term">Faithful, or true?</div><div class="desc">Ask who selected the source, and what verified that selection. [V15]</div></div>
<div class="row"><div class="num">3</div><div class="term">How often, not how well?</div><div class="desc">Ask for all-k-succeed, not best-of-k. Demand the reliability floor. [V44]</div></div>
</div>

<p class="closing">Verified means you can name what checked it. These three questions get that name, without a compiler.</p>

<div class="footnotes">
[V15] [V18] <span class="src-title">Loop Engineering</span> · [V44] <span class="src-title">Unit Testing</span>.
</div>

Note:
Three questions, none of which requires you to read a model card. One: which of the five verification levels verified this decision — and if the answer is a model scored it, that is level four, which alone is not verification. [V18] Two: was the answer faithful, or was it true? Ask who selected the source document and what verified that selection, because a perfectly faithful quotation of the wrong source scores above ninety percent on the metric you will be shown. [V15] Three: how often rather than how well — ask for the rate at which all attempts succeed, not the best of several attempts. [V44] Three questions, no compiler required.

<p class="kicker">Part V · Monday</p>

<h2>If you decide budgets — fund the oracle, fund review capacity, budget the re-scope</h2>
<div class="rows">
<div class="row"><div class="num">1</div><div class="term">Fund the oracle</div><div class="desc">Formalising domain knowledge costs engineering time a generic vendor cannot copy. [S5] [V26]</div></div>
<div class="row"><div class="num">2</div><div class="term">Fund absorption</div><div class="desc">Review capacity is the constraint that showed up first in practice. [V41] [V52]</div></div>
<div class="row"><div class="num">3</div><div class="term">Budget the depreciation</div><div class="desc">Re-scope every model-judge step at each model upgrade. [V25] [S2]</div></div>
</div>

<p class="closing">Set the autonomy level per feature, with a named person against each. [V34] And fund on the rate at which all attempts succeed, per stage — not an end-to-end average. [V44] [V29]</p>

Note:
Three line items nobody puts in the plan. One: fund the oracle. Formalising your domain knowledge into machine-checkable form is the expensive part, and it is also the part a generic vendor cannot copy — the verifier may be more work than the generator, and someone has to write it. [S5] [V26] Two: fund absorption. Review capacity was the constraint that appeared first in every account I could find, and buying more generation without buying more absorption converts directly into review debt. [V41] [V52] Three: budget the depreciation — every model-judge step needs re-scoping at each model upgrade, so put it in the maintenance plan rather than discovering it in the bill. [V25] [S2] And set the autonomy level explicitly per feature, with a named person against each, because that decision is being made either way. [V34] And the bar for reliable: the rate at which all attempts succeed, per stage — an end-to-end average hides the stage that recovered zero percent. [V44] [V29]

<p class="kicker">Closing</p>

<h2>What follows from an external check that can fail the work, and a deny gate at the credential</h2>
<p class="lede">If reliability comes from those two mechanisms rather than prompting, four things follow.</p>

<ul>
  <li>The check is the hard part, not the prompt: unit tests, schema validation, compile steps over model output.</li>
  <li>16 points on LongMemEval came from the harness, not the model; Chronos is the paper authors' own harness [V23].</li>
  <li>Verification has a price [V14]: a second pass, another model, a deterministic check, someone's time. Name who re-scopes that check at model upgrades.</li>
  <li>The honest test of any AI system: what could tell you it was wrong, without asking it?</li>
</ul>

<div class="footnotes">
[V14] <span class="src-title">Loop Engineering</span> · [V23] <span class="src-title">Is Grep All You Need?</span>
</div>

Note:
First, the hard part moved from the prompt to the check — and your team already writes checks: unit tests, schema validation, a compile-and-run step, now run over model output. Second, model choice matters less than harness and oracle design: the sixteen-point accuracy swing came from the wrapper, not the weights. [V23] Third, verification is always paid for, and you can name the currency: a second inference pass, another model, a deterministic check, or review time. [V14] So my bet is that the job that lasts is owning that check: re-scoping it at every model upgrade because a verifier depreciates [V25], and standing behind its verdicts. A check nobody owns keeps passing work it stopped covering. Which reduces the whole hour to one question you can ask of any system, including the one that generated this deck. What could tell you it was wrong, without asking it? Thank you. Questions.
